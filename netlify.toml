[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; frame-src 'self' https:; base-uri 'self'; form-action 'self' mailto:; object-src 'none'"

# Service Worker immer frisch prüfen, damit Updates ankommen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Statische Assets lange cachen (Dateinamen ändern sich bei Bildwechsel)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---- Weiterleitungen (Livegang unter my.ftem.swiss-ski.ch) -------------------
# Alte App-Links (my.ftem war frueher das FTEM-Tool) und alle unbekannten Pfade
# landen auf der Landingpage statt "Page not found".
[[redirects]]
  from = "/dashboard/*"
  to = "/"
  status = 301

# Auffangnetz: unbekannte Pfade -> Startseite (bestehende Dateien wie fr.html,
# admin.html oder /assets/* sind davon nicht betroffen - Netlify leitet nur um,
# wenn keine Datei unter dem Pfad existiert).
[[redirects]]
  from = "/*"
  to = "/"
  status = 301
