# Automatischer Funktions-Check der Live-Seite, alle 6 Stunden.
# Prueft alle 4 Sprachseiten, Admin-Seite, Service-Worker, Manifest,
# Datenbank und die beiden Netlify-Funktionen. Bei bleibenden Problemen
# geht eine Warn-Mail an ALERT_TO (Versand via Resend, Secret RESEND_API_KEY).
# Manuell ausloesbar unter GitHub -> Actions -> "Seiten-Check" -> Run workflow.
name: Seiten-Check

on:
  schedule:
    - cron: '41 4,10,16,22 * * *'   # alle 6 h (UTC); bewusst nicht zur vollen Stunde
  workflow_dispatch:
    inputs:
      testalarm:
        description: 'Nur Testalarm-Mail verschicken (Seite wird nicht geprueft)'
        type: boolean
        default: false

concurrency:
  group: seiten-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_TO: michael.pleus@swiss-ski.ch
    steps:
      - uses: actions/checkout@v4
      - name: Testalarm-Mail verschicken (nur auf Wunsch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testalarm }}
        run: >-
          node .github/scripts/mailfail.mjs
          "✅ FTEM-Überwachung: Testalarm"
          "Dies ist ein absichtlich ausgelöster Testalarm - der Mailversand funktioniert. Die Seite wurde bei diesem Lauf nicht geprüft."
      - name: Live-Seite pruefen
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.testalarm) }}
        run: node .github/scripts/check.mjs
