 Erholung nach der Wettkampfsaison sichern und mit polysportiver Bewegung die Trainingsfreude erhalten.\n\nInhalt:\nUnstrukturierte, vielseitige Aktivitäten ohne biathlonspezifische Inhalte (Velo, Schwimmen, Spielsportarten) bei deutlich reduziertem Umfang; Schiesstraining pausiert."}, {"cid": "biathlon|2|0|4", "sport": "Biathlon", "theme": "Makroplanung", "label": "Regeneration\nApril bis mitte Mai", "text": "Ziele:\nKörperliche und mentale Erholung nach der intensiven Wettkampfsaison sichern und mit polysportiver Bewegung Belastungsmonotonie vorbeugen.\n\nInhalt:\nUnstrukturierte, vielseitige Aktivitäten ohne biathlonspezifische Inhalte (Velo, Schwimmen, Spielsportarten) bei deutlich reduziertem Umfang und tiefer Intensität; Schiesstraining pausiert."}, {"cid": "biathlon|2|0|5", "sport": "Biathlon", "theme": "Makroplanung", "label": "Regeneration\nApril bis mitte Mai", "text": "Ziele:\nKörperliche und mentale Erholung nach der intensiven Wettkampfsaison sichern und Belastungsmonotonie sowie Übertraining vorbeugen.\n\nInhalt:\nUnstrukturierte, vielseitige Aktivitäten ohne biathlonspezifische Inhalte (Velo, Schwimmen, Spielsportarten) bei deutlich reduziertem Umfang und tiefer Intensität; Schiesstraining pausiert."}, {"cid": "biathlon|2|0|6", "sport": "Biathlon", "theme": "Makroplanung", "label": "Regeneration\nApril bis mitte Mai", "text": "Ziele:\nKörperliche und mentale Erholung nach der internationalen Wettkampfsaison sichern und Übertraining vorbeugen.\n\nInhalt:\nUnstrukturierte, vielseitige Aktivitäten ohne biathlonspezifische Inhalte (Velo, Schwimmen, Spielsportarten) bei deutlich reduziertem Umfang und tiefer Intensität; Schiesstraining pausiert."}, {"cid": "biathlon|2|0|7", "sport": "Biathlon", "theme": "Makroplanung", "label": "Regeneration\nApril bis mitte Mai", "text": "Ziele:\nKörperliche und mentale Erholung nach der Weltcup-Saison sichern und Übertraining auf höchstem Belastungsniveau vorbeugen.\n\nInhalt:\nUnstrukturierte, vielseitige Aktivitäten ohne biathlonspezifische Inhalte (Velo, Schwimmen, Spielsportarten) bei deutlich reduziertem Umfang und tiefer Intensität; Schiesstraining pausiert."}, {"cid": "biathlon|2|1|0", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Bewegungs- und Spielgrundformen entwickeln\nUmfangreich, vielseitig und herausfordernd"}, {"cid": "biathlon|2|1|1", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nBelastungsverträglichkeit umfangreich und vielseitig aufbauen, athletische Grundlagen (Koordination, Beweglichkeit, Grundkraft) festigen sowie spielerisch ans Schiessen heranführen.\n\nInhalt:\nPolysportives Athletiktraining (~6.4 h/Woche) mit Lauf-ABC, Sprüngen, Körpergewichtsübungen, Techniktraining an der Langhantel sowie erste Rollski-Einheiten zur Schulung von Klassisch- und Skating-Grundbewegungen, ergänzt durch spielerische Schiessformen am Luftgewehr."}, {"cid": "biathlon|2|1|2", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nTrainingsgrundlagen breit aufbauen, Volumen und Häufigkeit steigern, sportartübergreifende Vielseitigkeit fördern sowie Schiessgrundtechnik (Anschlag, Atmung, Abzug) am Luftgewehr aufbauen.\n\nInhalt:\nAthletiktraining mit Fokus auf Langhanteltechnik, Rumpfstabilität und erste Sprungformen (~6.2 h/Woche), kombiniert mit Velo, Laufen, Schwimmen und ergänzenden Sportarten wie Leichtathletik oder Turnen sowie regelmässigem Schiesstraining am Luftgewehr im Liegen und Stehen."}, {"cid": "biathlon|2|1|3", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nTrainingsgrundlagen breit aufbauen, Volumen und Häufigkeit auf ein deutlich höheres Niveau steigern und die Schiesstechnik am KK-Gewehr automatisieren.\n\nInhalt:\nPolysportives Athletiktraining mit Langhanteltechnik, Rumpfstabilität und Sprungschule (~7.7 h/Woche), kombiniert mit Velo, Laufen, Schwimmen und ergänzenden Sportarten sowie systematischem Schiesstraining am KK-Gewehr (Anschlag, Druckpunkt, Abzugsverhalten) im Liegen und Stehen."}, {"cid": "biathlon|2|1|4", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nKonditionelle Grundlagen breit und nachhaltig aufbauen, Volumen und Häufigkeit auf hohem Niveau steigern sowie technische Schiesselemente am KK-Gewehr verfeinern.\n\nInhalt:\nPolysportives Athletiktraining (~9.1 h/Woche) mit Fokus auf funktioneller Effizienz, Langhanteltechnik, Plyometrie und Rumpfkraft, kombiniert mit Grundlagenausdauer auf Velo, im Laufen und auf Rollski bei tiefer bis mittlerer Intensität sowie flüssigem Repetieren und stabilem Abzugsverhalten im Schiesstraining."}, {"cid": "biathlon|2|1|5", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nKonditionelle Grundlagen breit und nachhaltig aufbauen, Volumen und Häufigkeit auf hohem Niveau steigern sowie technische Schiesselemente weiter verfeinern.\n\nInhalt:\nUmfangreiches Athletiktraining (~9.8 h/Woche) mit Fokus auf funktioneller Effizienz, Langhanteltechnik, Plyometrie und Rumpfkraft, kombiniert mit Grundlagenausdauer auf Velo, im Laufen und auf Rollski bei tiefer bis mittlerer Intensität sowie Verfeinerung der Schiesstechnik im Liegen und Stehen."}, {"cid": "biathlon|2|1|6", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nKonditionelle Grundlagen breit und nachhaltig auf hohem Umfangsniveau (18–22 h/Woche) aufbauen und die technischen Schiesselemente automatisieren.\n\nInhalt:\nAusdauertraining zu Fuss und auf Rollski, ergänzt mit Velo, Rudern und Schwimmen, kombiniert mit zwei intensiven Einheiten pro Woche (I4/I5), Athletiktraining (~11.7 h/Woche) mit Fokus auf Langhanteltechnik, Plyometrie und Rumpfkraft sowie hochfrequentem Schiesstraining zur Automatisierung der Schiesstechnik."}, {"cid": "biathlon|2|1|7", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nKonditionelle Grundlagen breit und nachhaltig auf höchstem Umfangsniveau (18–22 h/Woche) aufbauen und die technischen Schiesselemente automatisieren.\n\nInhalt:\nAusdauertraining zu Fuss und auf Rollski, ergänzt mit Velo, Rudern und Schwimmen, kombiniert mit zwei intensiven Einheiten pro Woche (I4/I5), Athletiktraining (~13.4 h/Woche) mit Fokus auf Langhanteltechnik, Plyometrie und Rumpfkraft sowie hochfrequentem Schiesstraining zur Automatisierung der Schiesstechnik."}, {"cid": "biathlon|2|1|8", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nKonditionelle Grundlagen auf Weltklasseniveau ausbauen, individuelle Bedürfnisse gezielt entwickeln und die Schiesstechnik unter Wettkampfbedingungen automatisieren.\n\nInhalt:\nHochvolumiges Ausdauertraining zu Fuss und auf Rollski mit spezifischen Trainingsgeräten, ergänzt durch Velo, Rudern und Schwimmen, Athletiktraining (~14.2 h/Woche) mit Fokus auf Langhanteltechnik, Plyometrie und Rumpfkraft sowie individualisiertem Schiesstraining mit höchster Frequenz."}, {"cid": "biathlon|2|2|0", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Bewegungs- und Spielgrundformen entwickeln\nUmfangreich, vielseitig und herausfordernd"}, {"cid": "biathlon|2|2|1", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nSportartspezifische Bewegungsqualität auf Rollski festigen, die Schnelligkeits-/Agilitätsfenster gezielt nutzen sowie die Schiessstellung sicher einnehmen.\n\nInhalt:\nErhöhter Anteil Rollski (klassisch und skating) mit Fokus auf Beinabstoss, Doppelstock und 1:2-Technik, ergänzt durch Sprint-, Koordinations- und Sprungformen, weiterführendes Krafttraining sowie regelmässiges Schiesstraining mit Fokus auf Anschlagstabilität."}, {"cid": "biathlon|2|2|2", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nGrundlagenausdauer (I1) und sportartspezifische Technik festigen, Schnelligkeit und Muskelaufbau gezielt entwickeln sowie das Schiessen zunehmend mit körperlicher Belastung kombinieren.\n\nInhalt:\nStrukturierte Ausdauereinheiten (Berg- und Crosslauf, Velo 60–120'), Rollski mit Technikfokus sowie Muskelaufbau, beginnendes Explosivkrafttraining, Rumpfkraft und Schiesstraining mit ersten Kombiformen Laufen/Schiessen."}, {"cid": "biathlon|2|2|3", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nGrundlagenausdauer (I1), sportartspezifische Technik und Muskelaufbau gezielt entwickeln, die Schnelligkeit gemäss Window of Opportunity (besonders bei den Jungen) nutzen sowie Schiesspräzision unter Belastung verbessern.\n\nInhalt:\nStrukturierte Ausdauereinheiten (Berg- und Crosslauf, Velo 60–120'), Rollski mit Technikfokus, Muskelaufbau, beginnendes Explosivkrafttraining und Rumpfkraft sowie regelmässige Kombitrainings Laufen/Rollski + Schiessen."}, {"cid": "biathlon|2|2|4", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nSchwellen-, Kapazitäts- und Maximalkraft gezielt entwickeln, das individuelle Athletenprofil schärfen sowie Schiessgeschwindigkeit und Präzision unter Belastung steigern.\n\nInhalt:\nStrukturierte Schwellenblöcke (I2/I3) ergänzt durch Kapazitätstraining, Muskelhypertrophie und intramuskuläres Koordinationstraining, kombiniert mit Rollski-Technik, ersten Sommerwettkämpfen (Swiss Biathlon Cup) sowie Kombitrainings mit Fokus auf Schiessgeschwindigkeit und 30/30-Präzision."}, {"cid": "biathlon|2|2|5", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nSchwellen-, Kapazitäts- und Maximalkraft gezielt entwickeln, das individuelle Athletenprofil weiter schärfen sowie Schiessgeschwindigkeit und Präzision unter Wettkampfbelastung steigern.\n\nInhalt:\nStrukturierte Schwellenblöcke (I2/I3) ergänzt durch Kapazitätstraining, Muskelhypertrophie und intramuskuläres Koordinationstraining, kombiniert mit Rollski-Technik, Sommerwettkämpfen (Swiss Biathlon Cup, IBU Junior Cup) sowie Kombitrainings mit Schiessgeschwindigkeit und 30/30-Präzision."}, {"cid": "biathlon|2|2|6", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nVO₂max und Grundlagenausdauer gezielt entwickeln, Muskelhypertrophie und Maximalkraft weiter ausbauen sowie die Schiessgeschwindigkeit standardisieren.\n\nInhalt:\nAusdauer- und Intervalltraining auf der Rollskibahn, ergänzt durch Sommerwettkämpfe (Swiss Biathlon Cup, IBU Cup), intramuskuläres Koordinationstraining und Explosivkrafttraining mit Zusatzgewichten sowie hochintensive Kombitrainings (Laufen/Rollski + Schiessen) mit standardisierter Schiessgeschwindigkeit."}, {"cid": "biathlon|2|2|7", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nVO₂max und Grundlagenausdauer gezielt entwickeln, Muskelhypertrophie und Maximalkraft weiter ausbauen sowie die Schiessgeschwindigkeit standardisieren.\n\nInhalt:\nAusdauer- und Intervalltraining auf der Rollskibahn, ergänzt durch nationale/internationale Sommerwettkämpfe (IBU World Cup Sommer, Swiss Biathlon Cup), intramuskuläres Koordinationstraining und Explosivkrafttraining mit Zusatzgewichten sowie hochintensive Kombitrainings mit standardisierter Schiessgeschwindigkeit."}, {"cid": "biathlon|2|2|8", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nVO₂max, Laktattoleranz und Schwellen-Geschwindigkeit auf Weltklasseniveau entwickeln, Muskelhypertrophie sowie Maximalkraft weiter ausbauen und die Schiessgeschwindigkeit unter Weltcup-Bedingungen sichern.\n\nInhalt:\nAusdauer- und Intervalltraining auf der Rollskibahn, ergänzt durch nationale/internationale Sommerwettkämpfe, intramuskuläres Koordinationstraining und Explosivkrafttraining mit Zusatzgewichten sowie individualisierte Kombitrainings mit Weltcup-Schiessgeschwindigkeit."}, {"cid": "biathlon|2|3|0", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Bewegungs- und Spielgrundformen entwickeln\nUmfangreich, vielseitig und herausfordernd"}, {"cid": "biathlon|2|3|1", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Ziele:\nÜbergang vom Rollski auf Schnee schaffen, spielerisches, sicheres Bewegen auf den Langlaufski (Klassisch und Skating) etablieren sowie den Wechsel vom Laufen zum Schiessen automatisieren.\n\nInhalt:\nErste Schneetrainings mit Spielformen (Elefantenwaschen, Spitalfangis, Skills Park), Grundtechniken (Diagonal, Gräten, Bogentreten, 1:2), Erhaltung der Athletik durch kurze, intensive Einheiten und vielseitige Sprünge sowie erste Kombiformen Skilaufen + Schiessen auf der Biathlonanlage."}, {"cid": "biathlon|2|3|2", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Ziele:\nTechnik auf Rollski und Schnee verfeinern, den Übergang zur Schneesaison vorbereiten sowie das Schiessen unter Skibelastung stabilisieren.\n\nInhalt:\nTechnikparcours auf Rollski, Laufen mit Stöcken im koupierten Gelände, Spiele und Staffeln, Explosivkraft- und Rumpfkrafttraining sowie Kombitrainings Skilaufen + Schiessen mit Fokus auf stabiler Anschlagstechnik nach Belastung."}, {"cid": "biathlon|2|3|3", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Ziele:\nTechnik auf Rollski und Schnee verfeinern, Explosivkraft entwickeln, den Übergang zur Schneesaison vorbereiten sowie die Schiessgeschwindigkeit unter Skibelastung stabilisieren.\n\nInhalt:\nTechnikparcours auf Rollski, Laufen mit Stöcken im koupierten Gelände, Spiele und Staffeln, Explosivkraft- und Rumpfkrafttraining sowie Kombitrainings Skilaufen + Schiessen mit Fokus auf Schiessgeschwindigkeit und Präzision."}, {"cid": "biathlon|2|3|4", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Ziele:\nForm über kurze Intervalle steuern, Maximal- sowie Schnellkraft auf das Saisonniveau bringen und die Schiessleistung unter Wettkampfbedingungen sichern.\n\nInhalt:\nFortführung aller Trainingsformen mit Akzent auf kurzen Intervallen, Schnell- und Explosivkraft mit und ohne Zusatzgewicht, Übergang auf Schnee mit Technikfokus sowie wettkampfnahe Kombitrainings mit Fokus auf Schiessstabilität und -geschwindigkeit."}, {"cid": "biathlon|2|3|5", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Ziele:\nForm über kurze Intervalle steuern, Maximal- und Schnellkraft auf das Saisonniveau bringen und die Schiessleistung unter Wettkampfbedingungen sichern.\n\nInhalt:\nFortführung aller Trainingsformen mit Akzent auf kurzen Intervallen, Schnell- und Explosivkraft mit und ohne Zusatzgewicht, Übergang auf Schnee mit Technikfokus sowie wettkampfnahe Kombitrainings mit Fokus auf Schiessstabilität und -geschwindigkeit."}, {"cid": "biathlon|2|3|6", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Ziele:\nRennintensität und VO₂max auf Wettkampfniveau bringen, auf Schnee adaptieren und die Schiessleistung unter Renntempo sichern.\n\nInhalt:\nTraining auf Schnee und Ski mit Renntempo-Intervallen, ergänzt durch Schnell- und Explosivkrafttraining, Rumpfkraft sowie wettkampfnahe Kombitrainings mit Schiessleistung unter Renntempo."}, {"cid": "biathlon|2|3|7", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Ziele:\nRennintensität und VO₂max auf Weltcup-Niveau bringen, auf Schnee adaptieren und die Schiessleistung unter Weltcup-Bedingungen sichern.\n\nInhalt:\nTraining auf Schnee und Ski mit Renntempo-Intervallen, ergänzt durch Schnell- und Explosivkrafttraining, Rumpfkraft sowie wettkampfnahe Kombitrainings mit Schiessleistung unter Weltcup-Tempo."}, {"cid": "biathlon|2|3|8", "sport": "Biathlon", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Ziele:\nTempohärte und Hochgeschwindigkeitstechnik auf Weltcup-Niveau bringen, auf Schnee adaptieren und die Schiessleistung unter Weltcup-Bedingungen konstant halten.\n\nInhalt:\nTraining auf Schnee und Ski mit Renntempo-Intervallen, ergänzt durch Schnell- und Explosivkrafttraining, Rumpfkraft sowie individualisierte Kombitrainings mit konstanter Schiessleistung unter Weltcup-Tempo."}, {"cid": "biathlon|2|4|0", "sport": "Biathlon", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Bewegungs- und Spielgrundformen entwickeln\nUmfangreich, vielseitig und herausfordernd"}, {"cid": "biathlon|2|4|1", "sport": "Biathlon", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Ziele:\nErste Wettkampferfahrungen in einem freudvollen, lernorientierten Umfeld sammeln, die im Sommer aufgebaute Bewegungsqualität auf Schnee anwenden und das Schiessen im Wettkampf erleben.\n\nInhalt:\nRegelmässiges Schneetraining mit Technikvielfalt, Teilnahme am Swiss Biathlon Cup - Kids und lokalen Animationen, ergänzt durch reduziertes Athletiktraining (~2.6 h/Woche) zur Krafterhaltung und Verletzungsprophylaxe sowie wettkampfnahe Schiessübungen."}, {"cid": "biathlon|2|4|2", "sport": "Biathlon", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Ziele:\nDie rund sechs Monate Schneezeit intensiv für Technik- und Grundlagentraining nutzen, über regionale Wettkämpfe Erfahrung sammeln sowie das Schiessen im Wettkampf festigen.\n\nInhalt:\nViel Zeit auf Ski mit Fokus auf Technik, Abfahrten, Spiele und Koordination, ergänzt durch erhaltendes Athletik- und Rumpfkrafttraining (~2.6 h/Woche), reduziertes Explosivkrafttraining, Plyometrie sowie Wettkämpfe auf nationaler Stufe."}, {"cid": "biathlon|2|4|3", "sport": "Biathlon", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Ziele:\nDie rund sechs Monate Schneezeit intensiv für Technik- und Grundlagentraining nutzen, über regionale sowie internationale Wettkämpfe Erfahrung sammeln und die Schiessleistung im Wettkampf festigen.\n\nInhalt:\nViel Zeit auf Ski mit Fokus auf Technik, Abfahrten, Spiele und Koordination, ergänzt durch erhaltendes Athletik- und Rumpfkrafttraining (~2.6 h/Woche), Explosivkrafttraining und Plyometrie mit reduziertem Volumen sowie Wettkämpfe auf nationaler Stufe und ersten internationalen Starts."}, {"cid": "biathlon|2|4|4", "sport": "Biathlon", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Ziele:\nDie rund sechs Monate Schneezeit für Form- und Leistungssteuerung in dichtem Wettkampfkalender nutzen und die Schiessleistung im internationalen Wettkampf stabilisieren.\n\nInhalt:\nViel Zeit auf Ski mit Grundlagen- und Techniktraining trotz Leistungseinbussen, Formsteuerung über kurze und kombinierte Intervalle, erhaltendes Athletik-, Explosiv- und Maximalkrafttraining (~2.6 h/Woche) mit an die Wettkämpfe angepasstem Volumen sowie Starts bei internationalen Wettkämpfen."}, {"cid": "biathlon|2|4|5", "sport": "Biathlon", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Ziele:\nDie rund sechs Monate Schneezeit für gezielte Form- und Leistungssteuerung im dichten internationalen Wettkampfkalender nutzen und die Schiessleistung im internationalen Wettkampf stabilisieren.\n\nInhalt:\nViel Zeit auf Ski mit Grundlagen- und Techniktraining trotz Leistungseinbussen, Formsteuerung über kurze und kombinierte Intervalle, erhaltendes Athletik-, Explosiv- und Maximalkrafttraining (~3.3 h/Woche) mit an die Wettkämpfe angepasstem Volumen sowie Starts bei internationalen Wettkämpfen und Serien."}, {"cid": "biathlon|2|4|6", "sport": "Biathlon", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Ziele:\nWettkampfleistung im internationalen Kalender abrufen, Form über gezieltes Tapering steuern und die Schiessleistung unter Weltcup-Bedingungen konstant halten.\n\nInhalt:\nWettkampforientiertes Skitraining mit individueller Belastungssteuerung, kombiniert mit erhaltendem Athletik-, Explosiv- und Maximalkrafttraining (~3.8 h/Woche) bei gleichbleibender Intensität und an die Wettkämpfe angepasstem Volumen sowie Starts im World Cup."}, {"cid": "biathlon|2|4|7", "sport": "Biathlon", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Ziele:\nWettkampfleistung im internationalen Spitzenkalender abrufen, Form über gezieltes Tapering steuern und die Schiessleistung unter Weltcup-Bedingungen konstant halten.\n\nInhalt:\nWettkampforientiertes Skitraining mit individueller Belastungssteuerung, kombiniert mit erhaltendem Athletik-, Explosiv- und Maximalkrafttraining (~4.3 h/Woche) bei gleichbleibender Intensität und an die Wettkämpfe angepasstem Volumen sowie Starts im World Cup, an der WM und an Olympischen Spielen."}, {"cid": "biathlon|2|4|8", "sport": "Biathlon", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Ziele:\nWettkampfleistung im internationalen Spitzenkalender konstant abrufen, Form über gezieltes Tapering steuern und die Schiessleistung unter Weltcup-Bedingungen auf höchstem Niveau abrufen.\n\nInhalt:\nWettkampforientiertes Skitraining mit hochgradig individualisierter Belastungssteuerung, kombiniert mit erhaltendem Athletik-, Explosiv- und Maximalkrafttraining (~4.6 h/Woche) bei gleichbleibender Intensität und an die Wettkämpfe angepasstem Volumen sowie Starts im World Cup, an der WM und an Olympischen Spielen."}, {"cid": "biathlon|3|0|0", "sport": "Biathlon", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Off Snow Skills F1-2\n\nTurnen\nLeichtathletik\nGeländetraining\nRollen und Gleiten\nRadsport"}, {"cid": "biathlon|3|0|1", "sport": "Biathlon", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC 1: 90' leichte bis moderate sportliche Bewegung am Stück\n\nSC 2: 30' intermittierende Bewegung am Stück (intensiv)"}, {"cid": "biathlon|3|0|2", "sport": "Biathlon", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC 1\n150' am Stück auf Ski, Rollski und zu Fuss (moderat)\n\nSC 2\n20' am Stück auf Ski, RS und zu Fuss (intensiv)\n\nSC 3\n1000m-Lauf\n\nLT\nPISTE"}, {"cid": "biathlon|3|0|3", "sport": "Biathlon", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC 1\n3000m-Fusslauf auf Laufbahn\n\nLT\nPISTE"}, {"cid": "biathlon|3|0|4", "sport": "Biathlon", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC 1\n3000m-Fusslauf auf Laufbahn\n\nLT\nPISTE"}, {"cid": "biathlon|3|0|5", "sport": "Biathlon", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC 1\n3000m-Fusslauf auf Laufbahn\n\nLT 1\nPISTE\n\nLT 2\nKapazitäts- und Effizienztests auf Laufband RS"}, {"cid": "biathlon|3|0|6", "sport": "Biathlon", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC 1\n3000m-Fusslauf auf Laufbahn\n\nLT\nKapazitäts- und Effizienztests auf Laufband RS"}, {"cid": "biathlon|3|1|0", "sport": "Biathlon", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Aktiven Alltag pflegen\n• Belastungsverträglichkeit aufbauen\n• Erwerben und Festigen von Bewegungsgrundformen"}, {"cid": "biathlon|3|1|1", "sport": "Biathlon", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Aktiven Alltag pflegen\n• Belastbar werden\n• Anwenden und Variieren von Bewegungsgrundformen"}, {"cid": "biathlon|3|1|2", "sport": "Biathlon", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Aktiven Alltag pflegen\nDie Belastungsverträglichkeit soll umfangreich, vielseitig und zugleich herausfordernd aufgebaut werden. Durch die Ausrichtung auf Polysportivität bleibt die Wahl der Sportarten individuell und ermöglicht eine abwechslungsreiche Gestaltung der körperlichen Aktivität."}, {"cid": "biathlon|3|1|3", "sport": "Biathlon", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Vorbereitungsphase 1\n• Grundlagen aufbauen\n• Volumen und Häufigkeit steigern\n• Intensität tief bis mittel, kaum harte Einheiten\n• Vielseitig: Velo, Laufen, Schwimmen,  Spiele\n• Andere Sportarten nutzen (Bike, Leichtathletik, Turnen)\n\nVorbereitungsphase 2\n• Grundlagenausdauer (I1)\n• Technik gezielt trainieren\n• Schnelligkeit: Sprints, Sprünge, Spiele\n• Laufen: Berglauf und Cross\n• Velo 60–120'\n\nVorwettkampfphase\n• Trainingsformen aus VP2 laufen weiter\n• Technik im Fokus\n• Rollski, auch Technikparcours\n• Laufen mit Stöcken\n• Spiele und Staffeln\n• Koupiertes Gelände\n\nWettkampfphase:\n• Grundlagen- und Techniktraining auf\n• Schnee trotz Leistungseinbussen\n• Schneezeit (ca. 6 Monate) intensiv nutzen\n• Form über Wettkämpfe steuern\n• Viel Zeit auf Schnee und Ski\n• Spiele und Koordination\n• Abfahrten trainieren"}, {"cid": "biathlon|3|1|4", "sport": "Biathlon", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Vorbereitungsphase 1\n• Grundlagen aufbauen\n• Volumen und Häufigkeit steigern\n• Intensität tief bis mittel, kaum harte Einheiten\n\nVorbereitungsphase 2\n• Schwellentraining ergänzend zu Grundlagen\n• I2 gezielt, z.B. im Technikbereich\n• Kapazitätstraining nach Schwellenblock integrieren\n• Je nach Athletenprofil zwischen Kapazitäts- und Schwellentraining abwägen\n• Zweite Hälfte oft: ein Schwellen- und ein Kapazitätstraining pro Woche\n\nVorwettkampfphase\n• Meist alle Trainingsformen weiterhin enthalten\n• Formsteuerung über kurze Intervalle\n\nWettkampfphase:\n• Grundlagen und Technik auf Schnee trotz Leistungseinbussen\n• Schneezeit (ca. 6 Monate) nutzen\n• Formsteuerung mit kurzen und kombinierten Intervallen bei starker Wettkampfdichte"}, {"cid": "biathlon|3|1|5", "sport": "Biathlon", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Vorbereitungsphase 1\n• Umfang 18–22h pro Woche\n• Ausdauertraining zu Fuss und auf Rollski, ergänzt mit Velo, Rudern, Schwimmen\n• 2 intensive Einheiten pro Woche (I4 und I5) zu Fuss oder Rollski\n\nVorbereitungsphase 2\n• VO₂max und Grundlagenausdauer entwickeln\n• Sommerwettkämpfe\n• Ausdauer- und Intervalltraining auf der Rollskibahn\n\nVorwettkampfphase\n• Rennintensität und VO₂max\n• Training auf Schnee und Ski\n\nWettkampfphase:\n• Wettkampfleistung erbringen\n• Tapering"}, {"cid": "biathlon|3|1|6", "sport": "Biathlon", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "• Entwicklung individueller Bedürfnisse\n• Trainingsbelastung und -umfang auf Weltklasseniveau\n• Spezifische Trainingsgeräte\n• VO₂max, Laktattoleranz, Schwellen-Geschwindigkeit\n• Tempohärte, Hochgeschwindigkeitstechnik"}, {"cid": "biathlon|4|0|0", "sport": "Biathlon", "theme": "Mobilität & Beweglichkeit", "label": "Skills-Checks (SC) & Leistungstests (LT) Mobilität", "text": "Beweglichkeit Swiss-Ski Off Snow Skills F1-2"}, {"cid": "biathlon|4|0|1", "sport": "Biathlon", "theme": "Mobilität & Beweglichkeit", "label": "Skills-Checks (SC) & Leistungstests (LT) Mobilität", "text": "SC 1: Cow Face Pose Arms (Schultermobilität)\nSC 2: Wall Slides (Schultermobilität)\nSC 3: Thoracic Wall Rotation (Brustwirbelsäule)\nSC 4: Pelvic Tilt im Längssitz (Hamstrings/Beckenkontrolle)\nSC 5: Thomas Test (Oberschenkel vorne/Hüftstreckung)\nSC 6: Shinbox Hip Extension (Hüftrotation)\nSC 7: Knee-to-Wall (Fussgelenksflexion)"}, {"cid": "biathlon|4|0|2", "sport": "Biathlon", "theme": "Mobilität & Beweglichkeit", "label": "Skills-Checks (SC) & Leistungstests (LT) Mobilität", "text": "SC 1: Cow Face iessen", "label": "Inhalt Schiessen", "text": "Vorbereitungsphase 1\n• KK-Gewehr richtig einstellen und Schiessposition automatisieren.\n• Druckpunkt und Abzugsverhalten.\n\nVorbereitungsphase 2\n• Ab- und Aufschultern automatisieren. • Athemrhythmus.\n\nVorwettkampfphase\n• Angepasstes Anlaufen, flüssige Abläufe, Atemrhythmus.\n\nWettkampfphase\n• Angepasstes Anlaufen, flüssige Abläufe, Atemrhythmus."}, {"cid": "biathlon|7|1|5", "sport": "Biathlon", "theme": "Schiessen", "label": "Inhalt Schiessen", "text": "Vorbereitungsphase 1\n• Flüssig repetieren, Druckpunkt und Abzugsverhalten.\n\nVorbereitungsphase 2\n• Flüssiges Ab- und Aufschultern, Atem- und Schiessrhythmus.\n\nVorwettkampfphase\n• Der Situation angepasst schiessen.\n\nWettkampfphase\n• Der Situation angepasst schiessen."}, {"cid": "biathlon|7|1|6", "sport": "Biathlon", "theme": "Schiessen", "label": "Inhalt Schiessen", "text": "Vorbereitungsphase 1\n• Technische Elemente verfeinern.\n\nVorbereitungsphase 2\n• Schiessgeschwindigkeit entwickeln.\n\nVorwettkampfphase\n• Sicher und rhythmisch schiessen und kompakte Schussbilder erzielen.\n\nWettkampfphase\n• Sicher und rhythmisch schiessen und kompakte Schussbilder erzielen."}, {"cid": "biathlon|7|1|7", "sport": "Biathlon", "theme": "Schiessen", "label": "Inhalt Schiessen", "text": "Vorbereitungsphase 1\n• Technische Elemente automatisieren.\n\nVorbereitungsphase 2\n• Schiessgeschwindigkeit standardisieren.\n\nVorwettkampfphase\n• Mit Drucksituationen umgehen lernen.\n\nWettkampfphase\n• Mit Drucksituationen umgehen lernen."}, {"cid": "biathlon|7|1|8", "sport": "Biathlon", "theme": "Schiessen", "label": "Inhalt Schiessen", "text": "Vorbereitungsphase 1\n• Technische Elemente automatisieren.\n\nVorbereitungsphase 2\n• Schiessgeschwindigkeit standardisieren.\n\nVorwettkampfphase\n• In Leaderposition agieren.\n\nWettkampfphase\n• In Leaderposition agieren."}, {"cid": "biathlon|8|0|1", "sport": "Biathlon", "theme": "Technik & Taktik Übergeordnet", "label": "Skills-Checks (SC) und Leistungstests (LT) Technik", "text": "Individuelle Übungsstruktur nach Stärken/Schwächen-Analyse"}, {"cid": "biathlon|9|0|0", "sport": "Biathlon", "theme": "Technik", "label": "Technik Klassisch", "text": "Element Schnee entdecken\n• Gleiten\n• Schieben\n• Rutschen\n• Drehen\n• Springen\n• Balancieren\n• Bremsen auf Rutschgeräten (Langlaufski, Snowboard oder Ski)"}, {"cid": "biathlon|9|0|1", "sport": "Biathlon", "theme": "Technik", "label": "Technik Klassisch", "text": "Spielerisch den Schnee entdecken und sich variantenreich auf LL-Ski bewegen.\nSpielformen und abwechslungsreiche Übungen, die vielseitige Bewegungsarten fördern. Elefantenwaschen, Skills Park, Namen-Memory, Der Fuchs geht um, Spitalfangis etc.\n\nSicher und selbständig langlaufen und bremsen\n\nKL-Schritt (Beinarbeit)\nStreckung des Abstossbeines, stabiles Gleiten auf Gleitski\n\nDiagonal\nWechsel von Bein- und Armarbeit in diagonaler Bewegung für Vortrieb.\n\nGräten\nScherenschritte bergauf: Ski in V-Form setzen, Kick aus den Beinen (kein Gleiten)\n\nDoppelstock\nBeide Stöcke gleichzeitig einsetzen, Körper nach vorne bringen und Arme aktiv strecken.\n\nBogentreten\nSeitliches Treten in einer Bogenspurlinie, Gewicht auf den Aussenski\n\nSpurwechsel\nSki parallel anheben, Gewicht verlagern und sanft in die neue Spur setzen.\n\nÜbungen\nÜber Wurzeln steigen, Himbeeren pflücken, La-Ola-Welle, Schaukelschuhe etc."}, {"cid": "biathlon|9|1|0", "sport": "Biathlon", "theme": "Technik", "label": "Technik Skating", "text": "Element Schnee entdecken\n• Gleiten\n• Schieben\n• Rutschen\n• Drehen\n• Springen\n• Balancieren\n• Bremsen auf Rutschgeräten (Langlaufski, Snowboard oder Ski)"}, {"cid": "biathlon|9|1|1", "sport": "Biathlon", "theme": "Technik", "label": "Technik Skating", "text": "Spielerisch den Schnee entdecken und sich variantenreich auf LL-Ski bewegen.\nSpielformen und abwechslungsreiche Übungen, die vielseitige Bewegungsarten fördern. Elefantenwaschen, Skills Park, Namen-Memory, Der Fuchs geht um, Spitalfangis etc.\n\nSicher und selbständig langlaufen und bremsen\n\nSchlittschuschritt (Beinarbeit) Streckung des Abstossbeines (seitlich), stabiles Gleiten auf Gleitski\n\n1:2\nSchlittschuhschritt mit Doppelstockstoss auf jeden zweiten Beinabstoss.\n\n1:1\nSchlittschuhschritt mit Doppelstockstoss auf jeden Beinabstoss.\n\nAsymm. SS\nAsymmetrische Armarbeit (Führungsarm)  und gleichzeitiges aufsetzen von Stock und Ski (sonst gleich wie 1:2)\n\nDiagonal SS\nBeinschritt (seitlich) mit diagonalem Stockeinsatz.\n\nSchlittschuschritt ohne Stockeinsatz\nTiefer Schwerpunkt mit dynamischer Gewichtsverlagerung für längeres Gleiten.\n\nÜbungen\nKnöchel berühren, Zäunen, Glöckner, Hip-Hopper etc."}, {"cid": "biathlon|10|0|0", "sport": "Biathlon", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen erzählen von einem Moment, auf den sie stolz sind."}, {"cid": "biathlon|10|0|1", "sport": "Biathlon", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben ihre Emotionen in schwierigen Situationen (z.B. bei Fehler) anhand einer Ampel.\n\nRot: Ich bin wütend.\nGelb: Ich bin unsicher.\nGrün: Ich bin ruhig/fokussiert."}, {"cid": "biathlon|10|0|2", "sport": "Biathlon", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen machen eine Aufgabe (z.B. Technikübung) mit Ablenkungen (z.B. Lärm): Fähigkeit testen, Konzentration zu halten."}, {"cid": "biathlon|10|0|3", "sport": "Biathlon", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Athleten:innen formulieren ein kleines Ziel für das Training und erklären, warum es ihnen wichtig ist.\nSC 2: Simulierte Stresssituation (z.B Wettkampfsimulation). Kinder sollen bewusst Techniken (z.B. Atmung) einsetzen, um „grün“ zu erreichen."}, {"cid": "biathlon|10|0|4", "sport": "Biathlon", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben eine Bestleistung: „Wie hast du dich gefühlt?“: Merkmale des persönlichen optimalen Leistungszustand identifizieren und  anwenden."}, {"cid": "biathlon|10|0|5", "sport": "Biathlon", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Während Training und Wettkampf bewusst Atemtechniken nutzen, um Ruhe zu bewahren.\nSC 3: Vor einer Technikaufgabe den Ablauf mental durchspielen."}, {"cid": "biathlon|10|0|6", "sport": "Biathlon", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Bei einer schwierigen Aufgabe (z.B. Zeitdruck) positive Selbstgespräche anwenden.\nSC 3: Technikübung mit eingebauten Ablenkungen durchführen."}, {"cid": "biathlon|10|0|7", "sport": "Biathlon", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC1: Vor dem Wettkampf eine etablierte mentale Aktivierungsroutine anwenden.\nSC2: Bei Drucksituationen gezielte Atemtechniken oder Selbstgespräche einsetzen.\nSC3: Nach einem Rückschlag den Fokus bewusst auf die nächste Aufgabe lenken.\nSC4: Eine bevorstehende Wettkampfsituation gezielt visualisieren."}, {"cid": "biathlon|10|1|0", "sport": "Biathlon", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative ermöglichen"}, {"cid": "biathlon|10|1|1", "sport": "Biathlon", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative fördern"}, {"cid": "biathlon|10|1|2", "sport": "Biathlon", "theme" "sport": "Biathlon", "theme": "Ernährung", "label": "Skills-Check (SC)", "text": "SC: Mit verschiedenen Snacks, Trinkstrategien oder Mahlzeiten vor/während/nach dem Training/Wettkampf experimentieren und individuell anpassen."}, {"cid": "biathlon|11|0|4", "sport": "Biathlon", "theme": "Ernährung", "label": "Skills-Check (SC)", "text": "SC 1: Ernährung und Hydration unter Wettkampfbedingungen testen (z.B. Gels, isotonische Getränke während Belastung).\n\nSC 2: Flüssigkeitsverlust, Energiebedarf und Regeneration dokumentieren und auswerten."}, {"cid": "biathlon|11|0|5", "sport": "Biathlon", "theme": "Ernährung", "label": "Skills-Check (SC)", "text": "SC: Etablierte Ernährungs- und Hydrationsstrategie für Training und Wettkampf."}, {"cid": "biathlon|11|1|0", "sport": "Biathlon", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "biathlon|11|1|1", "sport": "Biathlon", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "biathlon|11|1|2", "sport": "Biathlon", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nBewusstheit und Anpassung stärken Verständnis für Makronährstoffe (Kohlenhydrate, Eiweiss, Fett) und Flüssigkeitsbedarf vertiefen.\n\nVor dem Training\n1–2h vorher ca. 500 ml Wasser trinken. Bei Hitze oder viel Salzverlust leicht salzige Getränke verwenden (1x Prise Salz).\n\nWährend des Trainings\nAlle 15–20' 150–200 ml trinken, >1h Belastung zusätzliche Kohlenhydrate beigeben (z.B. verdünnte Fruchtsäfte, kohlenhydratreiche Getränke).\n\nNach dem Training\n0.5-1 l Flüssigkeit innerhalb von 30'. Bei intensiven Belastungen Proteinshake, Recovery-Drink, Elektrolytgetränke oder leicht salziges Wasser verwenden."}, {"cid": "biathlon|11|1|3", "sport": "Biathlon", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "biathlon|11|2|0", "sport": "Biathlon", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "biathlon|11|2|1", "sport": "Biathlon", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "biathlon|11|2|2", "sport": "Biathlon", "theme": "Ernährung", "label": "Essen", "text": "Vor dem Training\n2–3h vorher: Kohlenhydratreiche, leicht verdauliche Mahlzeit (z.B. Vollkornbrot mit Honig). 30' vorher: Kleiner Snack (z.B. Banane)\n\nWährend des Trainings (>1h Belastung)\n30–60 g Kohlenhydrate pro h (z.B. Energieriegel, Trockenfrüchte)\n\nNach dem Training\nInnerhalb von 30': Snack mit Kohlenhydraten und Eiweiss (z. B. Joghurt mit Obst, Milchshake).\n\nHauptmahlzeit: Ausgewogen mit Kohlenhydraten (z.B. Reis, Nudeln), Eiweiss (z. B. Huhn, Linsen) und Gemüse."}, {"cid": "biathlon|11|2|3", "sport": "Biathlon", "theme": "Ernährung", "label": "Essen", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "biathlon|12|0|0", "sport": "Biathlon", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC: Fragen an die Kinder: Wie viele Stunden Schlaf brauchen wir? Was hilft uns besser zu schlafen?"}, {"cid": "biathlon|12|0|1", "sport": "Biathlon", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC: Eine Woche lang Schlafdauer und wie sie sich am nächsten Tag fühlen dokumentieren."}, {"cid": "biathlon|12|0|2", "sport": "Biathlon", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC: Vor dem Schlafen Atemtechniken oder progressive Muskelrelaxation (PMR) ausprobieren."}, {"cid": "biathlon|12|0|3", "sport": "Biathlon", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC 1: Schlafdauer und Qualität eine Woche lang dokumentieren, zusammen mit der Trainingsleistung.\n\nSC 2: Abendroutinen reflektieren und Anpassungen vornehmen."}, {"cid": "biathlon|12|0|4", "sport": "Biathlon", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC 1: Plan für Schlaf- und Essenszeiten vor einem Wettkampf erstellen und umsetzen.\n\nSC 2: Gedanken vor dem Schlaf „parken“, z.B. durch Aufschreiben oder Atemübungen (Grübelstopp)"}, {"cid": "biathlon|12|0|5", "sport": "Biathlon", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC: Etablierte Schlafroutine für Training und Wettkampf."}, {"cid": "biathlon|12|1|0", "sport": "Biathlon", "theme": "Schlaf", "label": "Inhalt", "text": "Schlafdauer: 8–10h/Nacht\nSchlaf fördert Konzentration, Energie und Regeneration."}, {"cid": "biathlon|12|1|1", "sport": "Biathlon", "theme": "Schlaf", "label": "Inhalt", "text": "Schlafdauer\n8–10h/Nacht\n\nRoutine\nGleiche Schlafenszeiten, auch am Wochenende.\n\nEntspannung\n1h vor dem Schlafen Bildschirme meiden, Rituale wie Lesen oder Atemübungen einführen.\n\nSchlafumgebung\nDunkel, kühl, ruhig (16–18°C)."}, {"cid": "biathlon|12|1|2", "sport": "Biathlon", "theme": "Schlaf", "label": "Inhalt", "text": "Regelmässige Schlafzeiten\nEntspannungsrituale einbauen\n\nGedankenstopp\nBei längerer Wachzeit aufstehen. Gedanken aufschreiben, um den Kopf zu entlasten. Negative Gedanken über Schlaf in positive Überzeugungen umwandeln.\n\nOptimierter Einsatz von Koffein und Hilfsmitteln\nWirkung beachten (HWZ 6h, verstärkte Wirkung bei Jugendlichen), mind. 6h vor dem Schlaf meiden. Augenmasken, Gehörschutz etc. verwenden.\n\nPowernaps einplanen\nKurze Nickerchen von 10–15' zur Regeneration, ideal nach dem Mittagessen.\n\nAnpassungen bei Reisen und Wettkämpfen\nSchlaf- und Essenszeiten an Zeitverschiebungen anpassen. Strategien gegen Jetlag nutzen."}, {"cid": "biathlon|12|1|3", "sport": "Biathlon", "theme": "Schlaf", "label": "Inhalt", "text": "Eine gezielte und individuelle Schlafoptimierung sichert langfristige die Leistungsfähigkeit.\n\nRegelmässige Schlafroutinen und die Anpassung an Reisen oder Wettkämpfe sind entscheidend.\n\nSchlafprobleme sollten überwacht und bei Bedarf behandelt werden. Powernaps und Entspannungstechniken wie Gedankenstopp fördern Erholung und mentale Ruhe."}, {"cid": "biathlon|13|0|0", "sport": "Biathlon", "theme": "Förderstrukturen und Wettkämpfe", "label": "Kader", "text": "Skiclub"}, {"cid": "biathlon|13|0|1", "sport": "Biathlon", "theme": "Förderstrukturen und Wettkämpfe", "label": "Kader", "text": "RLZ / Skiclub"}, {"cid": "biathlon|13|0|2", "spor rie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Während Training und Wettkampf bewusst Atemtechniken nutzen, um Ruhe zu bewahren.\nSC 3: Vor einer Technikaufgabe den Ablauf mental durchspielen."}, {"cid": "skispringen|11|0|6", "sport": "Skispringen", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Bei einer schwierigen Aufgabe (z.B. Zeitdruck) positive Selbstgespräche anwenden.\nSC 3: Technikübung mit eingebauten Ablenkungen durchführen."}, {"cid": "skispringen|11|0|7", "sport": "Skispringen", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC1: Vor dem Wettkampf eine etablierte mentale Aktivierungsroutine anwenden.\nSC2: Bei Drucksituationen gezielte Atemtechniken oder Selbstgespräche einsetzen.\nSC3: Nach einem Rückschlag den Fokus bewusst auf die nächste Aufgabe lenken.\nSC4: Eine bevorstehende Wettkampfsituation gezielt visualisieren."}, {"cid": "skispringen|11|1|0", "sport": "Skispringen", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative ermöglichen"}, {"cid": "skispringen|11|1|1", "sport": "Skispringen", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative fördern"}, {"cid": "skispringen|11|1|2", "sport": "Skispringen", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "skispringen|11|1|3", "sport": "Skispringen", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "skispringen|11|1|4", "sport": "Skispringen", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "skispringen|12|0|0", "sport": "Skispringen", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Kinder schätzen, wie viel sie pro Training trinken sollten und überprüfen es (z.B. durch Markierungen an der Trinkflasche).\n\nSC 2: Kinder prüfen selbstständig, ob alle wichtigen Items dabei sind (Taschencheck)."}, {"cid": "skispringen|12|0|1", "sport": "Skispringen", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Einen Tag bezüglich Ernährung dokumentieren und diskutieren: Essen, Trinken und Snacks."}, {"cid": "skispringen|12|0|2", "sport": "Skispringen", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Selbständig eine Mahlzeit/Snack für vor, während und nach dem Training/Wettkampf zusammenstellen und diskutieren."}, {"cid": "skispringen|12|0|3", "sport": "Skispringen", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Mit verschiedenen Snacks, Trinkstrategien oder Mahlzeiten vor/während/nach dem Training/Wettkampf experimentieren und individuell anpassen."}, {"cid": "skispringen|12|0|4", "sport": "Skispringen", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Ernährung und Hydration unter Wettkampfbedingungen testen (z.B. Gels, isotonische Getränke während Belastung).\n\nSC 2: Flüssigkeitsverlust, Energiebedarf und Regeneration dokumentieren und auswerten."}, {"cid": "skispringen|12|0|5", "sport": "Skispringen", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Etablierte Ernährungs- und Hydrationsstrategie für Training und Wettkampf."}, {"cid": "skispringen|12|1|0", "sport": "Skispringen", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "skispringen|12|1|1", "sport": "Skispringen", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "skispringen|12|1|2", "sport": "Skispringen", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nBewusstheit und Anpassung stärken Verständnis für Makronährstoffe (Kohlenhydrate, Eiweiss, Fett) und Flüssigkeitsbedarf vertiefen.\n\nVor dem Training\n1–2h vorher ca. 500 ml Wasser trinken. Bei Hitze oder viel Salzverlust leicht salzige Getränke verwenden (1x Prise Salz).\n\nWährend des Trainings\nAlle 15–20' 150–200 ml trinken, >1h Belastung zusätzliche Kohlenhydrate beigeben (z.B. verdünnte Fruchtsäfte, kohlenhydratreiche Getränke).\n\nNach dem Training\n0.5-1 l Flüssigkeit innerhalb von 30'. Bei intensiven Belastungen Proteinshake, Recovery-Drink, Elektrolytgetränke oder leicht salziges Wasser verwenden."}, {"cid": "skispringen|12|1|3", "sport": "Skispringen", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "skispringen|12|2|0", "sport": "Skispringen", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "skispringen|12|2|1", "sport": "Skispringen", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "skispringen|12|2|2", "sport": "Skispringen", "theme": "Ernährung", "label": "Essen", "text": "Vor dem Training\n2–3h vorher: Kohlenhydratreiche, leicht verdauliche Mahlzeit (z.B. Vollkornbrot mit Honig). 30' vorher: Kleiner Snack (z.B. Banane)\n\nWährend des Trainings (>1h Belastung)\n30–60 g Kohlenhydrate pro h (z.B. Energieriegel, Trockenfrüchte)\n\nNach dem Training\nInnerhalb von 30': Snack mit Kohlenhydraten und Eiweiss (z. B. Joghurt mit Obst, Milchshake).\n\nHauptmahlzeit: Ausgewogen mit Kohlenhydraten (z.B. Reis, Nudeln), Eiweiss (z. B. Huhn, Linsen) und Gemüse."}, {"cid": "skispringen|12|2|3", "sport": "Skispringen", "theme": "Ernährung", "label": "Essen", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "skispringen|13|0|0", "sport": "Skispringen", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Fragen an die Kinder: Wie viele Stunden Schlaf brauchen wir? Was hilft uns besser zu schlafen?"}, {"cid": "skispringen|13|0|1", "sport": "Skispringen", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Eine Woche lang Schlafdauer und wie sie sich am nächsten Tag fühlen dokumentieren."}, {"cid": "skispringen|13|0|2", "sport": "Skispringen", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Vor dem Schlafen Atemtechniken oder progressive Muskelrelaxation (PMR) ausprobieren."}, {"cid": "skispringen|13|0|3", "sport": "Skispringen", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Schlafdauer und Qualität eine Woche lang dokumentieren, zusammen mit der Trainingsleistung.\n\nSC 2: Abendroutinen reflektieren und Anpassungen vornehmen."}, {"cid": "skispringen|13|0|4", "sport": "Skispringen", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Plan für Schlaf- und Essenszeiten vor einem Wettkampf erstellen und umsetzen.\n\nSC 2: Gedanken vor dem Schlaf „parken“, z.B. durch Aufschreiben oder Atemübungen (Grübelstopp)"}, {"cid": "skispringen|13|0|5", "sport": "Skispringen", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Etablierte Schlafroutine für Training und Wettkampf."}, {"cid": "skispringen|13|1|0", "sport": "Skispringen", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer: 8–10h/Nacht\nSchlaf fördert Konzentration, Energie und Regeneration."}, {"cid": "skispringen|13|1|1", "sport": "Skispringen", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer\n8–10h/Nacht\n\nRoutine\nGleiche Schlafenszeiten, auch am Wochenende.\n\nEntspannung\n1h vor dem Schlafen Bildschirme meiden, Rituale wie Lesen oder Atemübungen einführen.\n\nSchlafumgebung\nDunkel, kühl, ruhig (16–18°C)."}, {"cid": "skispringen|13|1|2", "sport": "Skispringen", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Regelmässige Schlafzeiten\nEntspannungsrituale einbauen\n\nGedankenstopp\nBei längerer Wachzeit aufstehen. Gedanken aufschreiben, um den Kopf zu entlasten. Negative Gedanken über Schlaf in positive Überzeugungen umwandeln.\n\nOptimierter Einsatz von Koffein und Hilfsmitteln\nWirkung beachten (HWZ 6h, verstärkte Wirkung bei Jugendlichen), mind. 6h vor dem Schlaf meiden. Augenmasken, Gehörschutz etc. verwenden.\n\nPowernaps einplanen\nKurze Nickerchen von 10–15' zur Regeneration, ideal nach dem Mittagessen.\n\nAnpassungen bei Reisen und Wettkämpfen\nSchlaf- und Essenszeiten an Zeitverschiebungen anpassen. Strategien gegen Jetlag nutzen."}, {"cid": "skispringen|13|1|3", "sport": "Skispringen", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Eine gezielte und individuelle Schlafoptimierung sichert langfristige die Leistungsfähigkeit.\n\nRegelmässige Schlafroutinen und die Anpassung an Reisen oder Wettkämpfe sind entscheidend.\n\nSchlafprobleme sollten überwacht und bei Bedarf behandelt werden. Powernaps und Entspannungstechniken wie Gedankenstopp fördern Erholung und mentale Ruhe."}, {"cid": "skispringen|14|0|0", "sport": "Skispringen", "theme": "Förderstrukturen und Wettkämpfe", "label": "Kader", "text": "Skiclub"}, {"cid": "skispringen|14|0|1", "sport": "Skispringen", "theme": "Förderstruktur ophylaxe (Beinachsenstabilität, Beweglichkeit, Rumpfkraft, Hamstringstärkung), abwechslungsreiches Training mit Fokus auf Koordination und Kraft."}, {"cid": "nordische-kombination|2|0|2", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Vorbereitungsphase 1 (VP1): Mitte Mai-Juli", "text": "Ziele: Schaffung einer kräftigen und widerstandsfähigen Muskulatur. Aufbau einer guten aeroben Grundlage. Koordinative Fähigkeiten fördern. Variation von Trainingsmethoden Technikweiterentwicklung\n\nInhalt: Skisprung Techniktraining (verschiedene Trainingsformen), Kraftausdauer (leichte Gewichte, hohe Wiederholungszahl), Muskelaufbau (moderate Gewichte, ca. zehn Wiederholungen), Plyometrie (hohe Wiederholungszahl). Lockere Ausdauereinheiten (Laufen, Fahrrad, Inline). Verletzungsprophylaxe (Beinachsenstabilität, Beweglichkeit, Rumpfkraft, Hamstringstärkung), abwechslungsreiches Training mit Fokus auf Koordination und Kraft."}, {"cid": "nordische-kombination|2|0|3", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Vorbereitungsphase 1 (VP1): Mitte Mai-Juli", "text": "Ziele: Schaffung einer kräftigen und widerstandsfähigen Muskulatur. Aufbau einer guten aeroben Grundlage. Koordinative Fähigkeiten fördern. Variation von Trainingsmethoden Technikweiterentwicklung\n\nInhalt: Skisprung Techniktraining (verschiedene Trainingsformen), Kraftausdauer (leichte Gewichte, hohe Wiederholungszahl), Muskelaufbau (moderate Gewichte, ca. zehn Wiederholungen), Plyometrie (hohe Wiederholungszahl). Lockere Ausdauereinheiten (Laufen, Fahrrad, Inline) und HIIT (High Intensity Interval Training). Verletzungsprophylaxe (Beinachsenstabilität, Beweglichkeit, Rumpfkraft, Hamstringstärkung), abwechslungsreiches Training mit Fokus auf Koordination und Kraft."}, {"cid": "nordische-kombination|2|0|4", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Vorbereitungsphase 1 (VP1): Mitte Mai-Juli", "text": "Coming Soon…"}, {"cid": "nordische-kombination|2|1|1", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Vorbereitungsphase 2 (VP2): Aug-Okt", "text": "Ziele: Aufbau von Schnelligkeit, Schnell-und Explosivkraft. Umsetzen der Grundlagenausdauer in spielerischen kurzen Intervallformen, Balance zwischen Erholung und Belastung. Technikweiterentwicklung\n\nInhalt: Skisprung Techniktraining (spezifisch, hohe Wiederholungszahl), Sprintformen, Plyometrie (Sprungformen, tiefe Wiederholungszahl), Kraftaufbau (mittlere bis tiefe Wiederholungszahlen, wenig Gewicht),  Intervallläufe, Regenerationsphasen (Schulferien) gezielt einbauen.\nVerletzungsprophylaxe (Beinachsenstabilität, Beweglichkeit, Rumpfkraft, Hamstringstärkung), Spezifisches Training mit Fokus auf Technik."}, {"cid": "nordische-kombination|2|1|2", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Vorbereitungsphase 2 (VP2): Aug-Okt", "text": "Ziele: Aufbau von Schnelligkeit, Schnell-und Explosivkraft. Balance zwischen Erholung und Belastung. Technikoptimierung\n\nInhalt: Skisprung Techniktraining (spezifisch, hohe Wiederholungszahl), Sprintformen, Plyometrie (Sprungformen, tiefe Wiederholungszahl), Maximalkraftaufbau (hohe bis maximale Gewichte, mittlere bis tiefe Wiederholungszahlen), Intervallläufe, Regenerationsphasen gezielt einbauen. Verletzungsprophylaxe (Beinachsenstabilität, Beweglichkeit, Rumpfkraft, Hamstringstärkung), Spezifisches Training mit Fokus auf Technik."}, {"cid": "nordische-kombination|2|1|3", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Vorbereitungsphase 2 (VP2): Aug-Okt", "text": "Coming Soon…"}, {"cid": "nordische-kombination|2|2|1", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Vorwettkampfphase (VWP): Nov", "text": "Ziele: Erhaltung der Schnell- und Explosivkraft. Gesund und mental stark bleiben.\n\nInhalt: Plyometrie (Sprungformen, tiefe Wiederholungszahl), Schnellkraftaufbau (tiefe Wiederholungszahlen), Koordinationstraining (Langlauf), Fokus auf Stabilisations-, Mobilisations- und Imitationstraining."}, {"cid": "nordische-kombination|2|2|2", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Vorwettkampfphase (VWP): Nov", "text": "Ziele: Erhaltung der Schnell- und Explosivkraft. Gesund und mental stark bleiben. Qualität vor Quantität. Transfer von Sommer auf Winterschanze\n\nInhalt: Plyometrie (Sprungformen, tiefe Wiederholungszahl), Maximalkraftaufbau (hohe bis maximale Gewichte, mittlere bis tiefe Wiederholungszahlen), Imitationen, Fokus auf Coolness und Präzision."}, {"cid": "nordische-kombination|2|2|3", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Vorwettkampfphase (VWP): Nov", "text": "Coming Soon…"}, {"cid": "nordische-kombination|2|3|1", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Wettkampfphase (WP): Dez-Apr", "text": "Ziele: Freude am Konkurrenzkampf entwickeln, Kraft- und Schnelligkeitstraining beibehalten, Erholung und Belastung ausbalancieren. So viele Schneesprünge wie möglich (Schneereiche Phasen nutzen).\n\nInhalt: Kraft- und Schnelligkeitstraining. Trainingsleistungen in den Wettkampf bringen."}, {"cid": "nordische-kombination|2|3|2", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Wettkampfphase (WP): Dez-Apr", "text": "Ziele: Wettkämpfe steuern das Training. Priorisierung der Wettkämpfe (wichtig, mittel, unwichtig). Trainingsblöcke mit Blick auf die Erholung einplanen, Kraft- und Schnelligkeitstraining beibehalten, Erholung und Belastung ausbalancieren.\n\nInhalt: Gezielte Wettkampfvorbereitung. Kraft- und Schnelligkeitstraining. Klare Regenerationsphasen."}, {"cid": "nordische-kombination|2|3|3", "sport": "Nordische Kombination", "theme": "Makroplanung", "label": "Wettkampfphase (WP): Dez-Apr", "text": "Coming Soon…"}, {"cid": "nordische-kombination|3|0|0", "sport": "Nordische Kombination", "theme": "Ausdauer", "label": "Skills-Checks (SC) und Leistungstests (LT) Ausdauer", "text": "Off Snow Skills F1-2"}, \n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "nordische-kombination|11|0|0", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Kinder schätzen, wie viel sie pro Training trinken sollten und überprüfen es (z.B. durch Markierungen an der Trinkflasche).\nSC 2: Kinder prüfen selbstständig, ob alle wichtigen Items dabei sind (Taschencheck)."}, {"cid": "nordische-kombination|11|0|1", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Einen Tag bezüglich Ernährung dokumentieren und diskutieren: Essen, Trinken und Snacks."}, {"cid": "nordische-kombination|11|0|2", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Selbständig eine Mahlzeit/Snack für vor, während und nach dem Training/Wettkampf zusammenstellen und diskutieren."}, {"cid": "nordische-kombination|11|0|3", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Mit verschiedenen Snacks, Trinkstrategien oder Mahlzeiten vor/während/nach dem Training/Wettkampf experimentieren und individuell anpassen."}, {"cid": "nordische-kombination|11|0|4", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Ernährung und Hydration unter Wettkampfbedingungen testen (z.B. Gels, isotonische Getränke während Belastung).\nSC 2: Flüssigkeitsverlust, Energiebedarf und Regeneration dokumentieren und auswerten."}, {"cid": "nordische-kombination|11|1|0", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "nordische-kombination|11|1|1", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "nordische-kombination|11|1|2", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nBewusstheit und Anpassung stärken Verständnis für Makronährstoffe (Kohlenhydrate, Eiweiss, Fett) und Flüssigkeitsbedarf vertiefen.\n\nVor dem Training\n1–2h vorher ca. 500 ml Wasser trinken. Bei Hize oder viel Salzverlust leicht salzige Getränke verwenden (1x Prise Salz).\n\nWährend des Trainings\nAlle 15–20' 150–200 ml trinken, >1h Belastung zusätzliche Kohlenhydrate beigeben (z.B. verdünnte Fruchtsäfte).\n\nNach dem Training\n0.5-1 l Flüssigkeit innerhalb von 30'. Bei intens. Belastungen Elektrolytgetränke oder leicht salziges Wasser verwenden."}, {"cid": "nordische-kombination|11|1|3", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "nordische-kombination|11|2|0", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "nordische-kombination|11|2|1", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "nordische-kombination|11|2|2", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Essen", "text": "Vor dem Training\n2–3h vorher: Kohlenhydratreiche, leicht verdauliche Mahlzeit (z.B. Vollkornbrot mit Honig). 30' vorher: Kleiner Snack (z.B. Banane)\n\nWährend des Trainings (>1h Belastung)\n30–60 g Kohlenhydrate pro h (z.B. Energieriegel, Trockenfrüchte)\n\nNach dem Training\nInnerhalb von 30': Snack mit Kohlenhydraten und Eiweiss (z. B. Joghurt mit Obst, Milchshake).\n\nHauptmahlzeit: Ausgewogen mit Kohlenhydraten (z.B. Reis, Nudeln), Eiweiss (z. B. Huhn, Linsen) und Gemüse."}, {"cid": "nordische-kombination|11|2|3", "sport": "Nordische Kombination", "theme": "Ernährung", "label": "Essen", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "nordische-kombination|12|0|0", "sport": "Nordische Kombination", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Fragen an die Kinder: Wie viele Stunden Schlaf brauchen wir? Was hilft uns besser zu schlafen?"}, {"cid": "nordische-kombination|12|0|1", "sport": "Nordische Kombination", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Eine Woche lang Schlafdauer und wie sie sich am nächsten Tag fühlen dokumentieren."}, {"cid": "nordische-kombination|12|0|2", "sport": "Nordische Kombination", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Vor dem Schlafen Atemtechniken oder progressive Muskelrelaxation (PMR) ausprobieren."}, {"cid": "nordische-kombination|12|0|3", "sport": "Nordische Kombination", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Schlafdauer und Qualität eine Woche lang dokumentieren, zusammen mit der Trainingsleistung.\nSC 2: Abendroutinen reflektieren und Anpassungen vornehmen."}, {"cid": "nordische-kombination|12|0|4", "sport": "Nordische Kombination", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Plan für Schlaf- und Essenszeiten vor einem Wettkampf erstellen und umsetzen.\nSC 2: Gedanken vor dem Schlaf „parken“, z.B. durch Aufschreiben oder Atemübungen (Grübelstopp)"}, {"cid": "nordische-kombination|12|1|0", "sport": "Nordische Kombination", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer: 8–10h/Nacht\nSchlaf fördert Konzentration, Energie und Regeneration."}, {"cid": "nordische-kombination|12|1|1", "sport": "Nordische Kombination", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer\n8–10h/Nacht\n\nRoutine\nGleiche Schlafenszeiten, auch am Wochenende.\n\nEntspannung\n1h vor dem Schlafen Bildschirme meiden, Rituale wie Lesen oder Atemübungen einführen.\n\nSchlafumgebung\nDunkel, kühl, ruhig (16–18°C)."}, {"cid": "nordische-kombination|12|1|2", "sport": "Nordische Kombination", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Regelmässige Schlafzeiten\nEntspannungsrituale einbauen\n\nGrübelstopp\nBei längerer Wachzeit aufstehen. Gedanken aufschreiben, um den Kopf zu entlasten. Negative Gedanken über Schlaf in positive Überzeugungen umwandeln.\n\nOptimierter Einsatz von Koffein und Hilfsmitteln\nWirkung beachten (HWZ 6h, verstärkte Wirkung bei Jugendlichen), mind. 6h vor dem Schlaf meiden. Augenmasken, Gehörschutz etc. verwenden.\n\nPowernaps einplanen\nKurze Nickerchen von 10–15' zur Regeneration, ideal nach dem Mittagessen.\n\nAnpassungen bei Reisen und Wettkämpfen\nSchlaf- und Essenszeiten an Zeitverschiebungen anpassen. Strategien gegen Jetlag nutzen."}, {"cid": "nordische-kombination|12|1|3", "sport": "Nordische Kombination", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Eine gezielte und individuelle Schlafoptimierung sichert langfristige die Leistungsfähigkeit.\n\nRegelmässige Schlafroutinen und die Anpassung an Reisen oder Wettkämpfe sind entscheidend.\n\nSchlafprobleme sollten überwacht und bei Bedarf behandelt werden. Powernaps und Entspannungstechniken wie Grübelstopp fördern Erholung und mentale Ruhe."}, {"cid": "nordische-kombination|13|0|0", "sport": "Nordische Kombination", "theme": "Förderstrukturen und Wettkämpfe", "label": "Kader", "text": "Skiclub"}, {"cid": "nordische-kombination|13|0|1", "sport": "Nordische Kombination", "theme": "Förderstrukturen und Wettkämpfe", "label": "Kader", "text": "RLZ/Skiclub"}, {"cid": "nordische-kombination|13|0|2", "sport": "Nordische Kombination", "theme": "Förderstrukturen und Wettkämpfe", "label": "Kader", "text": "RLZ/NLZ"}, {"cid": "nordische-kombination|13|0|3", "sport": "Nordische Kombination", "theme": "Förderstrukturen und Wettkämpfe", "label": "Kader", "text": "NLZ, Swiss-Ski C-Kader"}, {"cid": "nordische-kombination|13|0|4", "sport": "Nordische Kombination", "theme": "Förderstrukturen und Wettkämpfe", "label": "Kader", "text": "Swiss-Ski C/B-Kader"}, {"cid": "nordische-kombination|13|0|5", "sport": "Nordische Kombination", "theme": "Förderstrukturen und Wettkämpfe", "label": "Kader", "text": "Swiss Ski B/A-Kader"}, {"cid": "nordische-kombination|13|0|6" g vermeiden.\n\nKurssetzung:\n• Zeitlicher Aspekt: von Tor zu Tor +/- 1.3 sek.\n• Bank etwas höher setzen Negativ Kurve rund setzen\n\nGelände:\n• Unterschiedliches Gelände mit schnellen Rotationsmöglichkeiten\n• Etwas steilere Banks mit mehr Radius und Negativ Kurven mit mehr seitlichem Gefälle wählen\n\nHilfsmittel:\nRS-Tore, Farbe, Zeitmessung und Video gezielt einsetzen                                          Bäseli und Farbe als Markierung bei der Einfahrt, Zeitmessung und Videos gezielt einsetzen"}, {"cid": "skicross|8|1|6", "sport": "Skicross", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\n• Blocktrainings mit klarem Ziel (schnell, langsam, drehend, direkt, eng, weit, ... ).\n• In schlechten Verhältnissen oder schlechter Sicht trainieren.\n• Over Coaching vermeiden.\n• Spezifische Pistenpräparation (vermehrt auf gewässerten Pisten)\n\nKurssetzung:\nZeitlicher Aspekt von Tor zu Tor +/- 1.3 sek.\n\nGelände:\nUnterschiedliches Gelände mit schnellen Rotationsmöglichkeiten\n\nHilfsmittel:\nRS-Tore, Farbe, Zeitmessung und Video einsetzen"}, {"cid": "skicross|8|1|7", "sport": "Skicross", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\n• Blocktrainings mit klarem Ziel (schnell, langsam, drehend, direkt, eng, weit, ... ).\n• Repetition bis zur Automatisierung.\n• Over Coaching vermeiden.\n• Dem Wettkampfprofil angepasste Pistenpräparation.\n\nKurssetzung:\n• Zeitlicher Aspekt: von Tor zu Tor +/- 1.3 sek.\n• Dem Wettkampfprofil angepasste Kurssetzung\n\nGelände:\n• Unterschiedliches Gelände: flach, steil, Übergänge, Wellen-Mulden.\n• Schnelle Rotationsmöglichkeiten\n• Dem Wettkampfprofil angepasstes Gelände\n\nHilfsmittel:\nRS-Tore, Farbe, Zeitmessung und Video einsetzen, GPS"}, {"cid": "skicross|9|0|1", "sport": "Skicross", "theme": "Skicross Start", "label": "Technik/Taktik Start", "text": "Erste Versuche in einem SX Start"}, {"cid": "skicross|
