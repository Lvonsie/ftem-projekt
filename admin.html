 "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Einen Tag bezüglich Ernährung dokumentieren und diskutieren: Essen, Trinken und Snacks."}, {"cid": "skicross|14|0|2", "sport": "Skicross", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Selbständig eine Mahlzeit/Snack für vor, während und nach dem Training/Wettkampf zusammenstellen und diskutieren."}, {"cid": "skicross|14|0|3", "sport": "Skicross", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Mit verschiedenen Snacks, Trinkstrategien oder Mahlzeiten vor/während/nach dem Training/Wettkampf experimentieren und individuell anpassen."}, {"cid": "skicross|14|0|4", "sport": "Skicross", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Ernährung und Hydration unter Wettkampfbedingungen testen (z.B. Gels, isotonische Getränke während Belastung).\nSC 2: Flüssigkeitsverlust, Energiebedarf und Regeneration dokumentieren und auswerten."}, {"cid": "skicross|14|1|0", "sport": "Skicross", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "skicross|14|1|1", "sport": "Skicross", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "skicross|14|1|2", "sport": "Skicross", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nBewusstheit und Anpassung stärken Verständnis für Makronährstoffe (Kohlenhydrate, Eiweiss, Fett) und Flüssigkeitsbedarf vertiefen.\n\nVor dem Training\n1–2h vorher ca. 500 ml Wasser trinken. Bei Hize oder viel Salzverlust leicht salzige Getränke verwenden (1x Prise Salz).\n\nWährend des Trainings\nAlle 15–20' 150–200 ml trinken, >1h Belastung zusätzliche Kohlenhydrate beigeben (z.B. verdünnte Fruchtsäfte).\n\nNach dem Training\n0.5-1 l Flüssigkeit innerhalb von 30'. Bei intens. Belastungen Elektrolytgetränke oder leicht salziges Wasser verwenden."}, {"cid": "skicross|14|1|3", "sport": "Skicross", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "skicross|14|2|0", "sport": "Skicross", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "skicross|14|2|1", "sport": "Skicross", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "skicross|14|2|2", "sport": "Skicross", "theme": "Ernährung", "label": "Essen", "text": "Vor dem Training\n2–3h vorher: Kohlenhydratreiche, leicht verdauliche Mahlzeit (z.B. Vollkornbrot mit Honig). 30' vorher: Kleiner Snack (z.B. Banane)\n\nWährend des Trainings (>1h Belastung)\n30–60 g Kohlenhydrate pro h (z.B. Energieriegel, Trockenfrüchte)\n\nNach dem Training\nInnerhalb von 30': Snack mit Kohlenhydraten und Eiweiss (z. B. Joghurt mit Obst, Milchshake).\n\nHauptmahlzeit: Ausgewogen mit Kohlenhydraten (z.B. Reis, Nudeln), Eiweiss (z. B. Huhn, Linsen) und Gemüse."}, {"cid": "skicross|14|2|3", "sport": "Skicross", "theme": "Ernährung", "label": "Essen", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "skicross|15|0|0", "sport": "Skicross", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Fragen an die Kinder: Wie viele Stunden Schlaf brauchen wir? Was hilft uns besser zu schlafen?"}, {"cid": "skicross|15|0|1", "sport": "Skicross", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Eine Woche lang Schlafdauer und wie sie sich am nächsten Tag fühlen dokumentieren."}, {"cid": "skicross|15|0|2", "sport": "Skicross", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Vor dem Schlafen Atemtechniken oder progressive Muskelrelaxation (PMR) ausprobieren."}, {"cid": "skicross|15|0|3", "sport": "Skicross", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Schlafdauer und Qualität eine Woche lang dokumentieren, zusammen mit der Trainingsleistung.\nSC 2: Abendroutinen reflektieren und Anpassungen vornehmen."}, {"cid": "skicross|15|0|4", "sport": "Skicross", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Plan für Schlaf- und Essenszeiten vor einem Wettkampf erstellen und umsetzen.\nSC 2: Gedanken vor dem Schlaf „parken“, z.B. durch Aufschreiben oder Atemübungen (Grübelstopp)"}, {"cid": "skicross|15|1|0", "sport": "Skicross", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer: 8–10h/Nacht\nSchlaf fördert Konzentration, Energie und Regeneration."}, {"cid": "skicross|15|1|1", "sport": "Skicross", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer\n8–10h/Nacht\n\nRoutine\nGleiche Schlafenszeiten, auch am Wochenende.\n\nEntspannung\n1h vor dem Schlafen Bildschirme meiden, Rituale wie Lesen oder Atemübungen einführen.\n\nSchlafumgebung\nDunkel, kühl, ruhig (16–18°C)."}, {"cid": "skicross|15|1|2", "sport": "Skicross", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Regelmässige Schlafzeiten\nEntspannungsrituale einbauen\n\nGrübelstopp\nBei längerer Wachzeit aufstehen. Gedanken aufschreiben, um den Kopf zu entlasten. Negative Gedanken über Schlaf in positive Überzeugungen umwandeln.\n\nOptimierter Einsatz von Koffein und Hilfsmitteln\nWirkung beachten (HWZ 6h, verstärkte Wirkung bei Jugendlichen), mind. 6h vor dem Schlaf meiden. Augenmasken, Gehörschutz etc. verwenden.\n\nPowernaps einplanen\nKurze Nickerchen von 10–15' zur Regeneration, ideal nach dem Mittagessen.\n\nAnpassungen bei Reisen und Wettkämpfen\nSchlaf- und Essenszeiten an Zeitverschiebungen anpassen. Strategien gegen Jetlag nutzen."}, {"cid": "skicross|15|1|3", "sport": "Skicross", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Eine gezielte und individuelle Schlafoptimierung sichert langfristige die Leistungsfähigkeit.\n\nRegelmässige Schlafroutinen und die Anpassung an Reisen oder Wettkämpfe sind entscheidend.\n\nSchlafprobleme sollten überwacht und bei Bedarf behandelt werden. Powernaps und Entspannungstechniken wie Grübelstopp fördern Erholung und mentale Ruhe."}, {"cid": "skicross|16|0|0", "sport": "Skicross", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Skiclub"}, {"cid": "skicross|16|0|1", "sport": "Skicross", "theme": "Förderstrukturen & Wettkä  Tests (Nordboard, Jump), Powertest"}, {"cid": "freeski-park-pipe|5|0|7", "sport": "Freeski Park & Pipe", "theme": "Kraft & Explosivität", "label": "Skills-Checks (SC) & Leistungstests (LT) Kraft", "text": "SC 1: Kniebeuge vorne\nSC 2: Kniebeuge hinten\nSC 3: Reisskniebeuge\nSC 4: Umsetzen\nSC 5: Reissen\nSC 6: Drop Snatch\nSC 7: Nordic Hamstring\n\nST: NLZ Test oder LD Magglingen"}, {"cid": "freeski-park-pipe|5|1|0", "sport": "Freeski Park & Pipe", "theme": "Kraft & Explosivität", "label": "Inhalt Kraft", "text": "Eingrenzen\nSpielerische Formen der Basis-bewegungen: Stossen, Stützen, Bremsen, Ziehen\nGanzheitlich Stark\n\nAktiven Alltag pflegen\n• Belastungsverträglichkeit aufbauen: Kraft, Stabilität & Schnellkraft\n• Erwerben und Festigen von spielerischen Krafteinheiten"}, {"cid": "freeski-park-pipe|5|1|1", "sport": "Freeski Park & Pipe", "theme": "Kraft & Explosivität", "label": "Inhalt Kraft", "text": "Eingrenzen\nSpielerische Formen der Basisbewegungen: Stossen, Stützen, Bremsen, Ziehen\nGanzheitlich Stark\n\nSommer\n• Techniktraining (Bewegungsschulung)\n• Koordination im vollen Bewegungsumfang\n• Übungen mit dem eigenen Körpergewicht\n• Variantenreiche Sprungformen\n\nWinter\n• Variantenreiche Sprungformen\n• Erhaltung der Kraft (ganzheitlich stark bleiben)"}, {"cid": "freeski-park-pipe|5|1|2", "sport": "Freeski Park & Pipe", "theme": "Kraft & Explosivität", "label": "Inhalt Kraft", "text": "Eingrenzen\nSpielerische Formen der Basisbewegungen: Stossen, Stützen, Bremsen, Ziehen\nGanzheitlich Stark\n\nVorbereitungsphase 1\n• Langhanteltechnik mit Körpergewicht und leichten Zusatzgewicht (unterschiedliche Kniebeugeformen)\n• Erste Sprungformen mit Fokus auf korrekte Landungsmechanismen (Beinachse)\n• Entwicklung der Rumpfkontrolle und der Stabilität\n\nVorbereitungsphase 2\n• Kraftpotential steigern\n• Steigerung der Explosivkraft\n• Rumpfkrafttraining statisch mit einzelnen dynamischen Formen\n\nVorwettkampfphase\n• Explosivkrafttraining\n• Rumpfkrafttraining\n\nWettkampfphase\n• Krafttraining mit reduziertem Volumen\n• Rumpfkrafttraining erhalten\n• Präventionsprogramme (ISPA)"}, {"cid": "freeski-park-pipe|5|1|3", "sport": "Freeski Park & Pipe", "theme": "Kraft & Explosivität", "label": "Inhalt Kraft", "text": "Belasten\nEntwickeln der Kraft mittels Muskelkraftübungen. Tiefe bis mittlere Intensität mit hohem Trainingsumfang. Die Qualität ist hierbei entscheidend. Technisches Ausarbeiten der Muskelkraftübungen, bei guter Qualität bereits mit Zusatzgewichten arbeiten.\n\nVorbereitungsphase 1\n• Heranführen der unteren Extremitäten und des Rumpfes an die höheren Lasten der nächsten Stufe\n• Technisches erarbeiten der Langhanteltechnik in den Muskelleistungsübungen\n\nVorbereitungsphase 2\n• Muskelpotential Aufbauen (Muskelkraftübungen als Trainingsübung anwenden)\n• weiter Entwickeln und anschliessendes Nutzen der Muskelleistungsübungen\n• Rumpfkrafttraining statisch und dynamisch mit Zusatzgewichten\n• Explosivkrafttraining mit und ohne Zusatzgewichten\n\nVorwettkampfphase\n• Steigerung der Maximalkraft durch intramuskuläres Koordinationstraining (Muskelpotential ausprägen)\n• Steigerung der Explosivkraft mit und ohne Zusatzlast\n• Sprung und Landevarianten einbauen\n• dynamische und statische Rumpfkraft polarisiert und sportartspezifisch einbauen\n\nWettkampfphase\n• Explosiv- und Maximalkraft erhalten\n• hohe Intensitäten und reduzierter Umfang der Krafteinheiten\n• Präventionsprogramme"}, {"cid": "freeski-park-pipe|5|1|4", "sport": "Freeski Park & Pipe", "theme": "Kraft & Explosivität", "label": "Inhalt Kraft", "text": "Belasten\nEntwickeln der Kraft mittels Muskelkraftübungen. Tiefe bis mittlere Intensität mit hohem Trainingsumfang. Die Qualität ist hierbei entscheidend. Technisches Ausarbeiten der Muskelkraftübungen, bei guter Qualität bereits mit Zusatzgewichten arbeiten.\n\nVorbereitungsphase 1\n• Heranführen der unteren Extremitäten und des Rumpfes an die höheren Lasten der nächsten Stufe\n• Technisches erarbeiten der Langhanteltechnik in den Muskelleistungsübungen\n\nVorbereitungsphase 2\n• Muskelpotential Aufbauen (Muskelkraftübungen als Trainingsübung anwenden)\n• weiter Entwickeln und anschliessendes Nutzen der Muskelleistungsübungen\n• Rumpfkrafttraining statisch und dynamisch mit Zusatzgewichten\n• Explosivkrafttraining mit und ohne Zusatzgewichten\n\nVorwettkampfphase\n• Steigerung der Maximalkraft durch intramuskuläres Koordinationstraining (Muskelpotential ausprägen)\n• Steigerung der Explosivkraft mit und ohne Zusatzlast\n• Sprung und Landevarianten einbauen\n• dynamische und statische Rumpfkraft polarisiert und sportartspezifisch einbauen\n\nWettkampfphase\n• Explosiv- und Maximalkraft erhalten\n• hohe Intensitäten und reduzierter Umfang der Krafteinheiten\n• Präventionsprogramme"}, {"cid": "freeski-park-pipe|6|0|0", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC  \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\n\nOff Snow Skills F1-2\n\nSiehe Swiss-Ski-Skills"}, {"cid": "freeski-park-pipe|6|0|1", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\nSC 1: Sprint (25m)\nSC 2: 30x Seilspringen Einfachdurchzüge"}, {"cid": "freeski-park-pipe|6|0|2", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\nSC 1: Sprint (25m & 50m)\nSC 2: 50x Seilspringen Einfachdurchzüge, 10 Doppeldurchzüge am Stück"}, {"cid": "freeski-park-pipe|6|0|3", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\nSC 1: Sprint (30m & 60m)\nSC 2: 50x Seilspringen Einfachdurchzüge, 20x Doppeldurchzüge am Stück"}, {"cid": "freeski-park-pipe|6|0|4", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\nSC 1: Sprint (30m & 80m)\nSC 2: 100x Seilspringen Einfachdurchzüge, 30x Doppeldurchzüge am Stück"}, {"cid": "freeski-park-pipe|6|0|5", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\nSC 1: Sprint (30m & 100m)\nSC 2: 100x Seilspringen Einfachdurchzüge, 40x Doppeldurchzüge am Stück"}, {"cid": "freeski-park-pipe|6|0|6", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC 1: Sprints über unterschliedliche Distanzen 30 m/ 80-100 m\nSC 2: Seilspringen 200x Einfachdurchzüge, 100x Doppeldurchzüge\nSC 3: Leichtathletische Grundlagen (Lauf ABC und Sprungvarianten maximal)"}, {"cid": "freeski-park-pipe|6|1|0", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Beginne jedes Training mit Übungen aus\nden Bewegungs- und Spielgrundformen. Diese Formen sind sportübergreifend und fördern die Bewegungskompetenz der Kinder.\nSchnelligkeit:\nÜbungen aus den Bewegungs- und Spielgrundformen zur Steigerung der Explosivität: Laufen,\nSpringen, Hüpf- und Sprungformen verpackt in Spielformen oder Übungsformen zu Verbesserung der koordinativen Kompetenz, werfen und fangen, Seilspringen.\n\nExplosivität:\nÜbungen aus den Bewegungs- und Spielgrundformen zur Steigerung der Explosivität: Laufen, Springen, Hüpf- und Sprungformen verpackt in Spielformen\noder Übungsformen zu Verbesserung der koordinativen Kompetenz, werfen und fangen, Seilspringen\n\nGestalte die Spiel- und Bewegungsgrundformen freudvoll und\nverpack sie in fantasievolle, abwechslungsreiche Spiele."}, {"cid": "freeski-park-pipe|6|1|1", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Wähle Übungen aus den Bewegungs- und\nSpielgrundformen, welche einen der Entwicklungsfaktoren\nKraft, Explosivität oder Schnelligkeit akzentuieren.\n\nSchnelligkeit:\nÜbungen aus den Bewegungs- und Spielgrundformen zur Steigerung der Explosivität: Laufen,\nSpringen, Hüpf- und Sprungformen verpackt in Spielformen oder Übungsformen zu Verbesserung der koordinativen Kompetenz, werfen und fangen, Seilspringen.\n\nExplosivität:\nÜbungen aus den Bewegungs- und Spielgrundformen zur Steigerung der Explosivität: Laufen, Springen, Hüpf- und Sprungformen verpackt in Spielformen\noder Übungsformen zu Verbesserung der koordinativen Kompetenz, werfen und fangen, Seilspringen\n\nGestalte die Spiel- und Bewegungsgrundformen freudvoll und verpack sie in fantasievolle, abwechslungsreiche Spiele."}, {"cid": "freeski-park-pipe|6|1|2", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Wähle Übungen aus den Bewegungs- und\nSpielgrundformen, welche einen der Entwicklungsfaktoren\nKraft, Explosivität oder Schnelligkeit akzentuieren.\n\nSchnelligkeit:\nÜbungen aus den Bewegungs- und Spielgrundformen zur Steigerung der Explosivität: Laufen,\nSpringen, Hüpf- und Sprungformen verpackt in Spielformen oder Übungsformen zu Verbesserung der koordinativen Kompetenz, werfen und fangen, Seilspringen.\nÜbungen aus den athletischen Basisbewegungen:\nBeschleunigung, maximal schnell sein oder Sprints mit Richtungswechsel.\n\nExplosivität:\nÜbungen aus den athletischen Basisbewegungen\nHüpfen/Springen, Springen/Landen und Werfen:\nSeilspringen, Reifensprünge oder Wurfformen."}, {"cid": "freeski-park-pipe|6|1|3", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Schnelligkeit:\nVariiere in der Wahl der athletischen Erscheinungsform:\n• Beschleunigung\n• Maximalgeschwindigkeit\n• Richtungswechsel\nvon Training zu Training oder plane zwei athletische Erscheinungsformen in der gleichen Einheit ein.\n\nExplosivität:\nBeginne das Explosivkrafttraining mit 60-70% Grundlagentraining und 30-40% Leistungstraining, steigere dann allmählich den Anteil des Leistungstrainings.\nLeistungstraining: Explosivität: Einfach- vor Mehrfachsprünge (z.B. Doppelbeinsprünge vertikal sowie horizontal)\nGrundlagentraining Explosivität: Steigerung der Belastbarkeit, z.B. durch verschiedene Formen des Seilspringens (Oberschenkel-, Fussgelenkdominant, mit Partner, Doppelsprünge etc.)"}, {"cid": "freeski-park-pipe|6|1|4", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Erhöhe den Anteil des Grundlagentrainings Explosivität\nund Kraft (mind. 2/3), technisches und athletisches\nGrundlagentraining zur Reduzierung der Belastung anstelle\ndes Leistungstrainings (1/3).\n\nSchnelligkeit:\nLeistungstraining Schnelligkeit: Lineares Sprinttraining;\nAkzentuierung des Trainings der Frequenzschnelligkeit\nGrundlagentraining Schnelligkeit: Übungen für die\nBewegungskontrolle (Techniktraining).\n\nExplosivität:\nErhöhe im Training der Explosivität den Anteil des athletischen und technischen Grundlagentrainings\nLeistungstraining: Explosivität: Einfach- vor Mehrfachsprünge (z.B. Doppelbeinsprünge vertikal sowie horizontal)\nGrundlagentraining Explosivität: Steigerung der Belastbarkeit, z.B. durch verschiedene Formen des Seilspringens"}, {"cid": "freeski-park-pipe|6|1|5", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Schnelligkeit:\nspezifisch\n• Beschleunigungen\n• Richtungswechsel\n• Maximalgeschwindigkeit\n• Zwischen einzelnen Sprints 1:10-20 Pause (z.B. 5sec. Sprintdauer = mind. 100 Sec. Pause)\nallgemein:\n• Widerstand Stossen/ Ziehen (Beschleunigen)\n• Widerstand ziehen (Transitionsphase)\n• Zugunterstützung (Overspeed)\n\nExplosivität:\n• Sprungformen entwickeln\n• Leistungstraining Explosivität: Bei Sprungformen Einfach- vor\nMehrfachsprünge (z.B. Doppelbeinsprünge vertikal sowie horizontal)"}, {"cid": "freeski-park-pipe|6|1|6", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Schnelligkeit:\nspezifisch\n• Beschleunigungen\n• Richtungswechsel\n• Maximalgeschwindigkeit\n• Zwischen einzelnen Sprints 1:10-20 Pause (z.B. 5sec. Sprintdauer = mind. 100 Sec. Pause)\nallgemein:\n• Widerstand Stossen/ Ziehen (Beschleunigen)\n• Widerstand ziehen (Transitionsphase)\n• Zugunterstützung (Overspeed)\n\nExplosivität:\n• Sprungformen entwickeln\n• Entwicklung der Sprungformen auf der gesamten Kraft-Geschwindigkeitskurve\n• Nutzung des exzentrischen Vordehnens\n• Übungsformen wählen, die auch auf kurze Brems- und Beschleunigungsphasen ausgerichtet sind."}, {"cid": "freeski-park-pipe|6|1|7", "sport": "Freeski Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Schnelligkeit:\nspezifisch\n• Beschleunigungen\n• Richtungswechsel\n• Maximalgeschwindigkeit\n• Zwischen einzelnen Sprints 1:10-20 Pause (z.B. 5sec. Sprintdauer = mind. 100 Sec. Pause)\nallgemein:\n• Widerstand Stossen/ Ziehen (Beschleunigen)\n• Widerstand ziehen (Transitionsphase)\n• Zugunterstützung (Overspeed)\n\nExplosivität:\n• Sprungformen trainieren, die  der Charakteristik sowie  der Belastungsdynamik der Zielform gleichen\n• Sprungformen auf der gesamten Kraft-Geschwindigkeitskurve trainieren\n• Nutzung des exzentrischen Vordehnens\n• Übungsformen wählen, die auch auf kurze Brems- und Beschleunigungsphasen ausgerichtet sind."}, {"cid": "freeski-park-pipe|9|0|0", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen erzählen von einem Moment, auf den sie stolz sind."}, {"cid": "freeski-park-pipe|9|0|1", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben ihre Emotionen in schwierigen Situationen (z.B. bei Fehler) anhand einer Ampel.\n\nRot: Ich bin wütend.\nGelb: Ich bin unsicher.\nGrün: Ich bin ruhig/fokussiert."}, {"cid": "freeski-park-pipe|9|0|2", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen machen eine Aufgabe (z.B. Technikübung) mit Ablenkungen (z.B. Lärm): Fähigkeit testen, Konzentration zu halten."}, {"cid": "freeski-park-pipe|9|0|3", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Athleten:innen formulieren ein kleines Ziel für das Training und erklären, warum es ihnen wichtig ist.\nSC 2: Simulierte Stresssituation (z.B Wettkampfsimulation). Kinder sollen bewusst Techniken (z.B. Atmung) einsetzen, um „grün“ zu erreichen."}, {"cid": "freeski-park-pipe|9|0|4", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben eine Bestleistung: „Wie hast du dich gefühlt?“: Merkmale des persönlichen optimalen Leistungszustand identifizieren und  anwenden."}, {"cid": "freeski-park-pipe|9|0|5", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Während z.B. Intervalltraining bewusst Atemtechniken nutzen, um Ruhe zu bewahren.\nSC 3: Vor einer Technikaufgabe den Ablauf mental durchspielen."}, {"cid": "freeski-park-pipe|9|0|6", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Bei einer schwierigen Aufgabe (z.B. Zeitdruck) positive Selbstgespräche anwenden.\nSC 3: Technikübung mit eingebauten Ablenkungen durchführen."}, {"cid": "freeski-park-pipe|9|0|7", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "Coming soon…"}, {"cid": "freeski-park-pipe|9|1|0", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative ermöglichen"}, {"cid": "freeski-park-pipe|9|1|1", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "freeski-park-pipe|9|1|2", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "freeski-park-pipe|9|1|3", "sport": "Freeski Park & Pipe", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "freeski-park-pipe|10|0|0", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Kinder schätzen, wie viel sie pro Training trinken sollten und überprüfen es (z.B. durch Markierungen an der Trinkflasche).\nSC 2: Kinder prüfen selbstständig, ob alle wichtigen Items dabei sind (Taschencheck)."}, {"cid": "freeski-park-pipe|10|0|1", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Einen Tag bezüglich Ernährung dokumentieren und diskutieren: Essen, Trinken und Snacks."}, {"cid": "freeski-park-pipe|10|0|2", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Selbständig eine Mahlzeit/Snack für vor, während und nach dem Training/Wettkampf zusammenstellen und diskutieren."}, {"cid": "freeski-park-pipe|10|0|3", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Mit verschiedenen Snacks, Trinkstrategien oder Mahlzeiten vor/während/nach dem Training/Wettkampf experimentieren und individuell anpassen."}, {"cid": "freeski-park-pipe|10|0|4", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Ernährung und Hydration unter Wettkampfbedingungen testen (z.B. Gels, isotonische Getränke während Belastung).\nSC 2: Flüssigkeitsverlust, Energiebedarf und Regeneration dokumentieren und auswerten."}, {"cid": "freeski-park-pipe|10|0|5", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "Coming soon…"}, {"cid": "freeski-park-pipe|10|1|0", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "freeski-park-pipe|10|1|1", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "freeski-park-pipe|10|1|2", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nBewusstheit und Anpassung stärken Verständnis für Makronährstoffe (Kohlenhydrate, Eiweiss, Fett) und Flüssigkeitsbedarf vertiefen.\n\nVor dem Training\n1–2h vorher ca. 500 ml Wasser trinken. Bei Hize oder viel Salzverlust leicht salzige Getränke verwenden (1x Prise Salz).\n\nWährend des Trainings\nAlle 15–20' 150–200 ml trinken, >1h Belastung zusätzliche Kohlenhydrate beigeben (z.B. verdünnte Fruchtsäfte).\n\nNach dem Training\n0.5-1 l Flüssigkeit innerhalb von 30'. Bei intens. Belastungen Elektrolytgetränke oder leicht salziges Wasser verwenden."}, {"cid": "freeski-park-pipe|10|1|3", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "freeski-park-pipe|10|2|0", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "freeski-park-pipe|10|2|1", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "freeski-park-pipe|10|2|2", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Essen", "text": "Vor dem Training\n2–3h vorher: Kohlenhydratreiche, leicht verdauliche Mahlzeit (z.B. Vollkornbrot mit Honig). 30' vorher: Kleiner Snack (z.B. Banane)\n\nWährend des Trainings (>1h Belastung)\n30–60 g Kohlenhydrate pro h (z.B. Energieriegel, Trockenfrüchte)\n\nNach dem Training\nInnerhalb von 30': Snack mit Kohlenhydraten und Eiweiss (z. B. Joghurt mit Obst, Milchshake).\n\nHauptmahlzeit: Ausgewogen mit Kohlenhydraten (z.B. Reis, Nudeln), Eiweiss (z. B. Huhn, Linsen) und Gemüse."}, {"cid": "freeski-park-pipe|10|2|3", "sport": "Freeski Park & Pipe", "theme": "Ernährung", "label": "Essen", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "freeski-park-pipe|11|0|0", "sport": "Freeski Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Fragen an die Kinder: Wie viele Stunden Schlaf brauchen wir? Was hilft uns besser zu schlafen?"}, {"cid": "freeski-park-pipe|11|0|1", "sport": "Freeski Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Eine Woche lang Schlafdauer und wie sie sich am nächsten Tag fühlen dokumentieren."}, {"cid": "freeski-park-pipe|11|0|2", "sport": "Freeski Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Vor dem Schlafen Atemtechniken oder progressive Muskelrelaxation (PMR) ausprobieren."}, {"cid": "freeski-park-pipe|11|0|3", "sport": "Freeski Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Schlafdauer und Qualität eine Woche lang dokumentieren, zusammen mit der Trainingsleistung.\nSC 2: Abendroutinen reflektieren und Anpassungen vornehmen."}, {"cid": "freeski-park-pipe|11|0|4", "sport": "Freeski Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Plan für Schlaf- und Essenszeiten vor einem Wettkampf erstellen und umsetzen.\nSC 2: Gedanken vor dem Schlaf „parken“, z.B. durch Aufschreiben oder Atemübungen (Grübelstopp)"}, {"cid": "freeski-park-pipe|11|0|5", "sport": "Freeski Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "Coming soon…"}, {"cid": "freeski-park-pipe|11|1|0", "sport": "Freeski Park & Pipe", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer: 8–10h/Nacht\nSchlaf fördert Konzentration, Energie und Regeneration."}, {"cid": "freeski-park-pipe|11|1|1", "sport": "Freeski Park & Pipe", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer\n8–10h/Nacht\n\nRoutine\nGleiche Schlafenszeiten, auch am Wochenende.\n\nEntspannung\n1h vor dem Schlafen Bildschirme meiden, Rituale wie Lesen oder Atemübungen einführen.\n\nSchlafumgebung\nDunkel, kühl, ruhig (16–18°C)."}, {"cid": "freeski-park-pipe|11|1|2", "sport": "Freeski Park & Pipe", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Regelmässige Schlafzeiten\nEntspannungsrituale einbauen\n\nGrübelstopp\nBei längerer Wachzeit aufstehen. Gedanken aufschreiben, um den Kopf zu entlasten. Negative Gedanken über Schlaf in positive Überzeugungen umwandeln.\n\nOptimierter Einsatz von Koffein und Hilfsmitteln\nWirkung beachten (HWZ 6h, verstärkte Wirkung bei Jugendlichen), mind. 6h vor dem Schlaf meiden. Augenmasken, Gehörschutz etc. verwenden.\n\nPowernaps einplanen\nKurze Nickerchen von 10–15' zur Regeneration, ideal nach dem Mittagessen.\n\nAnpassungen bei Reisen und Wettkämpfen\nSchlaf- und Essenszeiten an Zeitverschiebungen anpassen. Strategien gegen Jetlag nutzen."}, {"cid": "freeski-park-pipe|11|1|3", "sport": "Freeski Park & Pipe", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Eine gezielte und individuelle Schlafoptimierung sichert langfristige die Leistungsfähigkeit.\n\nRegelmässige Schlafroutinen und die Anpassung an Reisen oder Wettkämpfe sind entscheidend.\n\nSchlafprobleme sollten überwacht und bei Bedarf behandelt werden. Powernaps und Entspannungstechniken wie Grübelstopp fördern Erholung und mentale Ruhe."}, {"cid": "freeski-park-pipe|12|0|0", "sport": "Freeski Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Skiclub,Sportclub"}, {"cid": "freeski-park-pipe|12|0|1", "sport": "Freeski Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "RLZ,Skiclub,Sportclub"}, {"cid": "freeski-park-pipe|12|0|2", "sport": "Freeski Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "RV, NLZ"}, {"cid": "freeski-park-pipe|12|0|3", "sport": "Freeski Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "NLZ, Swiss-Ski Kader"}, {"cid": "freeski-park-pipe|12|0|4", "sport": "Freeski Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss-Ski Kader"}, {"cid": "freeski-park-pipe|12|0|5", "sport": "Freeski Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss Ski Kader NM"}, {"cid": " ing soon…"}, {"cid": "freeski-park-pipe|13|0|1", "sport": "Freeski Park & Pipe", "theme": "Selektionen", "label": "Testing & Leistungsdiagnostik", "text": "Heimtrainereinschätzung\n• Wird von der Trägerschaft erstellt\n• Muss über das Assessment termingerecht eingereicht werden\n• Empfehlung: AWK mit geforderten Wochenumfängen (+/-)\n\nTesting\nMeldung ohne Powertest, Wettkampfresultate und TCU-Resultate möglich\n\nWettkampfresultate\n• Die Regionale Gesamtrangliste U11/U13 der jeweiligen interregionalen Tour wird beigezogen\n• Wir empfehlen, an den interregionalen Touren in deiner Region teilzunehmen. (BUZZ Tour, Eastside Tour, Tour Freestyle Romand)"}, {"cid": "freeski-park-pipe|13|0|2", "sport": "Freeski Park & Pipe", "theme": "Selektionen", "label": "Testing & Leistungsdiagnostik", "text": "Heimtrainereinschätzung\n• Wird von den Trägerschaft erstellt\n• Muss über das Assessment termingerecht eingereicht werden\n• AWK mit geforderten Wochenumfängen (+/-)\n\nEs müssen folgende Test-Resultate vorliegen:\n• Powertest\n• TCU\n• Liegen keine Resultate vor = Note 1\n• Notengebung gemäss Prozentangaben in PISTE Guidelines\n\nWettkampfresultate\n• Die Regionale Gesamtrangliste U11/U13 der jeweiligen interregionalen Tour wird beigezogen..\n• bzw. die Nationale Gesamtrangliste U15/U18 wird beigezogen\n• Dies höchste Punktzahl aus den möglichen Disziplinen wird berücksichtigt\n• Für eine Regionale Karte müssen Wettkampfesultate vorliegen\n• Keine Wettkampfresultate = Note 1\n• Notengebung gemäss PISTE Guidelines"}, {"cid": "freeski-park-pipe|13|0|3", "sport": "Freeski Park & Pipe", "theme": "Selektionen", "label": "Testing & Leistungsdiagnostik", "text": "Heimtrainereinschätzung\n• Wird von den Trägerschaft erstellt\n• Muss über das Assessment termingerecht eingereicht werden\n• AWK mit geforderten Wochenumfängen (+/-)\n\nEs müssen folgende Test-Resultate vorliegen:\n• Powertest\n• TCU On- und Off-Snow mit Werten von mindestens 55% Performer oder 75% Contender\n• Liegen keine Resultate vor = Note 1\n• Notengebung gemäss Prozentangaben in PISTE Guidelines\n• Für eine Nationale Karte muss ein nationaler Powertest mit mind. Mittelwert 51 Punkte absolviert werden (ab 26/27 mit 55 P.)\n• Notengebung gemäss Prozentangaben in PISTE Guidelines\n\nWettkampfresultate\n• Die FIS/WSPL Liste wird beigezogen\n• Dies höchste Punktzahl aus den möglichen Disziplinen wird berücksichtigt\n• Notengebung gemäss PISTE Guidelines (www.Thatsnowsports.ch)\n• Verletztenstatus muss mit Arztzeugnis bei Assessment begründet werden"}, {"cid": "freeski-park-pipe|13|0|4", "sport": "Freeski Park & Pipe", "theme": "Selektionen", "label": "Testing & Leistungsdiagnostik", "text": "Heimtrainereinschätzung\n• Wird von den Trägerschaft erstellt\n• Muss über das Assessment termingerecht eingereicht werden\n• AWK mit geforderten Wochenumfängen (+/-)\n\nEs müssen folgende Test-Resultate vorliegen:\n• Powertest mit mind. 55 Punkten (ab 26/27 mit 60 P.)\n• TCU On- und Off-Snow Resultate mit mindestens 80%-Score\n• NLZ Test muss absolviert werden\n• Liegen keine Resultate vor = Note 1\n• Notengebung gemäss Prozentangaben in PISTE Guidelines\n\nWettkampfresultate\n• Die FIS/WSPL Liste wird beigezogen\n• Dies höchste Punktzahl aus den möglichen Disziplinen wird berücksichtigt\n• Notengebung gemäss PISTE Guidelines\n• Verletztenstatus muss mit Arztzeugnis bei Assessment begründet werden"}, {"cid": "freeski-park-pipe|13|0|5", "sport": "Freeski Park & Pipe", "theme": "Selektionen", "label": "Testing & Leistungsdiagnostik", "text": "Siehe die jeweiligen Selektionsrichtlinien auf der Swiss-Ski-Homepage"}, {"cid": "freeski-park-pipe|14|0|0", "sport": "Freeski Park & Pipe", "theme": "Umfeldmanagement", "label": "Ansprechpersonen", "text": "Familie"}, {"cid": "freeski-park-pipe|14|0|1", "sport": "Freeski Park & Pipe", "theme": "Umfeldmanagement", "label": "Ansprechpersonen", "text": "• Familie\n• Trainer:innen"}, {"cid": "freeski-park-pipe|14|0|2", "sport": "Freeski Park & Pipe", "theme" oard Alpin", "theme": "Makroplanung", "label": "Vorbereitungsphase 1 (VP1): Mitte Mai-Aug", "text": "Ziele: Muskulatur stark und wiederstandsfähig machen. Langhanteltechnik verbessern. Aufbau einer guten aeroben Grundlage. Koordinative Fähigkeiten fördern. Variation von Trainingsmethoden.\n\nInhalt: Kraftausdauer (leichte Gewichte, hohe Wiederholungszahl), Muskelaufbau (moderate Gewichte, ca. zehn Wiederholungen), gegen Ende dieser Phase Maximalkrafttraining. Plyometrie (hohe Wiederholungszahl). Lange, lockere Ausdauereinheiten (Fahrrad, Laufen, Inline). Abwechslungsreiches Training mit Fokus auf Koordination, Kraft und Ausdauer."}, {"cid": "snowboard-alpin|2|1|1", "sport": "Snowboard Alpin", "theme": "Makroplanung", "label": "Vorbereitungsphase 2 (VP2): Sept-Okt", "text": "Ziele: Aufbau von Schnelligkeit, Schnell-und Explosivkraft. Umsetzen der Grundlagenausdauer in intensiven Intervallformen, Balance zwischen Erholung und Belastung.\n\nInhalt: Sprintformen, Plyometrie (Sprungformen, tiefe Wiederholungszahl), Kraftaufbau (hohe Gewichte, mittlere bis tiefe Wiederholungszahlen) Intervallläufe und Grundlagenausdauer,   Regenerationsphasen gezielt einbauen"}, {"cid": "snowboard-alpin|2|2|1", "sport": "Snowboard Alpin", "theme": "Makroplanung", "label": "Vorwettkampfphase (VWP): Nov", "text": "Ziele: Erhaltung der Schnell- und Explosivkraft. Nutzung des Schneetrainings zum koordinativen Umsetzung der konditionellen Fähigkeiten. Gesund und mental stark bleiben.\n\nInhalt: Schneetraining mit hohem Umfang an Trainingsläufen. Wettkampf-Simulationen. Fokus auf Coolness und Präzision. Grundlagenausdauer zurRegeneration. Erhaltungstraining im Krafttraining."}, {"cid": "snowboard-alpin|2|3|1", "sport": "Snowboard Alpin", "theme": "Makroplanung", "label": "Wettkampfphase (WP): Dez-Apr", "text": "Ziele: Wettkämpfe steuern das Training. Priorisierung der Wettkämpfe (wichtig, mittel, unwichtig). Trainingsblöcke mit Blick auf die Erholung einplanen, Kraft- und Schnelligkeitstraining beibehalten, Erholung und Belastung ausbalancieren.\n\nInhalt: Gezielte Wettkampfvorbereitung. Kraft- und Schnelligkeitstraining. Klare Regenerationsphasen."}, {"cid": "snowboard-alpin|3|0|0", "sport": "Snowboard Alpin", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nSC: Off Snow Skills F1 (Leichtathletik: schnell laufen, Geländetraining: laufen im Gelände, Radsport: Pumtrack, Spielen)"}, {"cid": "snowboard-alpin|3|0|1", "sport": "Snowboard Alpin", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nSC 1: Off Snow Skills F3 (Leichtathletik: schnell laufen, Geländetraining: laufen im Gelände, Radsport: Pumptrack und Wald/Trail, Rollen&Gleiten: Inlineskate und Eislauf, Spielen)\nSC 2: 30 Minuten Dauerlauf bei \"Sprechtempo\" (Dokument Seiler)\nSC 3: Off Snow skills F3 (1000 Meter unter 4 Minuten für Übertritt zu T1)"}, {"cid": "snowboard-alpin|3|0|2", "sport": "Snowboard Alpin", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nSC 1: 45 Minuten Dauerlauf bei \"Sprechtempo\" (Dokument Seiler)\nSC 2: 1000 Meter mit Verbesserter Zeit im Vergleich zu persöhnlicher Messung im F3\nSC 3: 12 Minuten Lauf (Powertest)"}, {"cid": "snowboard-alpin|3|0|3", "sport": "Snowboard Alpin", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nZeitpunkt ST: Nationaler Powertest\n\nSC 1: 75 Minuten Dauerlauf bei \"Sprechtempo\" (Dokument Seiler)\nSC 2: 1000 Meter mit Verbesserter Zeit im Vergleich zu persöhnlicher Messung im T1\n\nST: 12 Minuten Lauf (Powertest)"}, {"cid": "snowboard-alpin|3|0|4", "sport": "Snowboard Alpin", "theme": "Ausdauer", "label": • Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "snowboard-alpin|12|0|0", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Kinder schätzen, wie viel sie pro Training trinken sollten und überprüfen es (z.B. durch Markierungen an der Trinkflasche).\nSC 2: Kinder prüfen selbstständig, ob alle wichtigen Items dabei sind (Taschencheck)."}, {"cid": "snowboard-alpin|12|0|1", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Einen Tag bezüglich Ernährung dokumentieren und diskutieren: Essen, Trinken und Snacks."}, {"cid": "snowboard-alpin|12|0|2", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Selbständig eine Mahlzeit/Snack für vor, während und nach dem Training/Wettkampf zusammenstellen und diskutieren."}, {"cid": "snowboard-alpin|12|0|3", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Mit verschiedenen Snacks, Trinkstrategien oder Mahlzeiten vor/während/nach dem Training/Wettkampf experimentieren und individuell anpassen."}, {"cid": "snowboard-alpin|12|0|4", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Ernährung und Hydration unter Wettkampfbedingungen testen (z.B. Gels, isotonische Getränke während Belastung).\nSC 2: Flüssigkeitsverlust, Energiebedarf und Regeneration dokumentieren und auswerten."}, {"cid": "snowboard-alpin|12|1|0", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "snowboard-alpin|12|1|1", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "snowboard-alpin|12|1|2", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nBewusstheit und Anpassung stärken Verständnis für Makronährstoffe (Kohlenhydrate, Eiweiss, Fett) und Flüssigkeitsbedarf vertiefen.\n\nVor dem Training\n1–2h vorher ca. 500 ml Wasser trinken. Bei Hize oder viel Salzverlust leicht salzige Getränke verwenden (1x Prise Salz).\n\nWährend des Trainings\nAlle 15–20' 150–200 ml trinken, >1h Belastung zusätzliche Kohlenhydrate beigeben (z.B. verdünnte Fruchtsäfte).\n\nNach dem Training\n0.5-1 l Flüssigkeit innerhalb von 30'. Bei intens. Belastungen Elektrolytgetränke oder leicht salziges Wasser verwenden."}, {"cid": "snowboard-alpin|12|1|3", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "snowboard-alpin|12|2|0", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "snowboard-alpin|12|2|1", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "snowboard-alpin|12|2|2", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Essen", "text": "Vor dem Training\n2–3h vorher: Kohlenhydratreiche, leicht verdauliche Mahlzeit (z.B. Vollkornbrot mit Honig). 30' vorher: Kleiner Snack (z.B. Banane)\n\nWährend des Trainings (>1h Belastung)\n30–60 g Kohlenhydrate pro h (z.B. Energieriegel, Trockenfrüchte)\n\nNach dem Training\nInnerhalb von 30': Snack mit Kohlenhydraten und Eiweiss (z. B. Joghurt mit Obst, Milchshake).\n\nHauptmahlzeit: Ausgewogen mit Kohlenhydraten (z.B. Reis, Nudeln), Eiweiss (z. B. Huhn, Linsen) und Gemüse."}, {"cid": "snowboard-alpin|12|2|3", "sport": "Snowboard Alpin", "theme": "Ernährung", "label": "Essen", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "snowboard-alpin|13|0|0", "sport": "Snowboard Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Fragen an die Kinder: Wie viele Stunden Schlaf brauchen wir? Was hilft uns besser zu schlafen?"}, {"cid": "snowboard-alpin|13|0|1", "sport": "Snowboard Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Eine Woche lang Schlafdauer und wie sie sich am nächsten Tag fühlen dokumentieren."}, {"cid": "snowboard-alpin|13|0|2", "sport": "Snowboard Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Vor dem Schlafen Atemtechniken oder progressive Muskelrelaxation (PMR) ausprobieren."}, {"cid": "snowboard-alpin|13|0|3", "sport": "Snowboard Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Schlafdauer und Qualität eine Woche lang dokumentieren, zusammen mit der Trainingsleistung.\nSC 2: Abendroutinen reflektieren und Anpassungen vornehmen."}, {"cid": "snowboard-alpin|13|0|4", "sport": "Snowboard Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Plan für Schlaf- und Essenszeiten vor einem Wettkampf erstellen und umsetzen.\nSC 2: Gedanken vor dem Schlaf „parken“, z.B. durch Aufschreiben oder Atemübungen (Grübelstopp)"}, {"cid": "snowboard-alpin|13|1|0", "sport": "Snowboard Alpin", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer: 8–10h/Nacht\nSchlaf fördert Konzentration, Energie und Regeneration."}, {"cid": "snowboard-alpin|13|1|1", "sport": "Snowboard Alpin", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer\n8–10h/Nacht\n\nRoutine\nGleiche Schlafenszeiten, auch am Wochenende.\n\nEntspannung\n1h vor dem Schlafen Bildschirme meiden, Rituale wie Lesen oder Atemübungen einführen.\n\nSchlafumgebung\nDunkel, kühl, ruhig (16–18°C)."}, {"cid": "snowboard-alpin|13|1|2", "sport": "Snowboard Alpin", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Regelmässige Schlafzeiten\nEntspannungsrituale einbauen\n\nGrübelstopp\nBei längerer Wachzeit aufstehen. Gedanken aufschreiben, um den Kopf zu entlasten. Negative Gedanken über Schlaf in positive Überzeugungen umwandeln.\n\nOptimierter Einsatz von Koffein und Hilfsmitteln\nWirkung beachten (HWZ 6h, verstärkte Wirkung bei Jugendlichen), mind. 6h vor dem Schlaf meiden. Augenmasken, Gehörschutz etc. verwenden.\n\nPowernaps einplanen\nKurze Nickerchen von 10–15' zur Regeneration, ideal nach dem Mittagessen.\n\nAnpassungen bei Reisen und Wettkämpfen\nSchlaf- und Essenszeiten an Zeitverschiebungen anpassen. Strategien gegen Jetlag nutzen."}, {"cid": "snowboard-alpin|13|1|3", "sport": "Snowboard Alpin", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Eine gezielte und individuelle Schlafoptimierung sichert langfristige die Leistungsfähigkeit.\n\nRegelmässige Schlafroutinen und die Anpassung an Reisen oder Wettkämpfe sind entscheidend.\n\nSchlafprobleme sollten überwacht und bei Bedarf behandelt werden. Powernaps und Entspannungstechniken wie Grübelstopp fördern Erholung und mentale Ruhe."}, {"cid": "snowboard-alpin|14|0|1", "sport": "Snowboard Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Sporster"}, {"cid": "snowboard-alpin|14|0|2", "sport": "Snowboard Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Contender"}, {"cid": "snowboard-alpin|14|0|3", "sport": "Snowboard Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss Ski Kader C / Performer"}, {"cid": "snowboard-alpin|14|0|4", "sport": "Snowboard Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss Ski Kader C"}, {"cid": "snowboard-alpin|14|0|5", "sport": "Snowboard Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss-Ski Kader A /B"}, {"cid": "snowboard-alpin|14|0|6", "sport": "Snowboard Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss-Ski Kader A / NM"}, {"cid": "snowboard-alpin|14|0|7", "sport": "Snowboard Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "NM"}, {"cid": "snowboard-alpin|14|1|1", "sport": "Snowboard Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "Lokal"}, {"cid": "snowboard-alpin|14|1|2", "sport": "Snowboard Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "Lokal, Regional VP2): Sept-Okt", "text": "Ziele: Aufbau von Schnelligkeit, Schnell-und Explosivkraft. Umsetzen der Grundlagenausdauer in intensiven Intervallformen, Balance zwischen Erholung und Belastung.\n\nInhalt: Sprintformen, Plyometrie (Sprungformen, tiefe Wiederholungszahl), Kraftaufbau (hohe Gewichte, mittlere bis tiefe Wiederholungszahlen) Intervallläufe und Grundlagenausdauer,   Regenerationsphasen gezielt einbauen"}, {"cid": "snowboard-cross|2|2|1", "sport": "Snowboard Cross", "theme": "Makroplanung", "label": "Vorwettkampfphase (VWP): Nov", "text": "Ziele: Erhaltung der Schnell- und Explosivkraft. Nutzung des Schneetrainings zum koordinativen Umsetzung der konditionellen Fähigkeiten. Gesund und mental stark bleiben.\n\nInhalt: Schneetraining mit hohem Umfang an Trainingsläufen. Wettkampf-Simulationen. Fokus auf Coolness und Präzision. Grundlagenausdauer zurRegeneration. Erhaltungstraining im Krafttraining."}, {"cid": "snowboard-cross|2|3|1", "sport": "Snowboard Cross", "theme": "Makroplanung", "label": "Wettkampfphase (WP): Dez-Apr", "text": "Ziele: Wettkämpfe steuern das Training. Priorisierung der Wettkämpfe (wichtig, mittel, unwichtig). Trainingsblöcke mit Blick auf die Erholung einplanen, Kraft- und Schnelligkeitstraining beibehalten, Erholung und Belastung ausbalancieren.\n\nInhalt: Gezielte Wettkampfvorbereitung. Kraft- und Schnelligkeitstraining. Klare Regenerationsphasen."}, {"cid": "snowboard-cross|3|0|0", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nSC: Off Snow Skills F1 (Leichtathletik: schnell laufen, Geländetraining: laufen im Gelände, Radsport: Pumtrack, Spielen)"}, {"cid": "snowboard-cross|3|0|1", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nSC 1: Off Snow Skills F3 (Leichtathletik: schnell laufen, Geländetraining: laufen im Gelände, Radsport: Pumptrack und Wald/Trail, Rollen&Gleiten: Inlineskate und Eislauf, Spielen)\nSC 2: 30 Minuten Dauerlauf bei \"Sprechtempo\" (Dokument Seiler)\nSC 3: Off Snow skills F3 (1000 Meter unter 4 Minuten für Übertritt zu T1)"}, {"cid": "snowboard-cross|3|0|2", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nSC 1: 45 Minuten Dauerlauf bei \"Sprechtempo\" (Dokument Seiler)\nSC 2: 1000 Meter mit Verbesserter Zeit im Vergleich zu persöhnlicher Messung im F3\nSC 3: 12 Minuten Lauf (Powertest)"}, {"cid": "snowboard-cross|3|0|3", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nZeitpunkt ST: Nationaler Powertest\n\nSC 1: 75 Minuten Dauerlauf bei \"Sprechtempo\" (Dokument Seiler)\nSC 2: 1000 Meter mit Verbesserter Zeit im Vergleich zu persöhnlicher Messung im T1\n\nST: 12 Minuten Lauf (Powertest)"}, {"cid": "snowboard-cross|3|0|4", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nZeitpunkt ST: Nationaler Powertest / NLZ Tests (Anfang Vorbereitungsphase / Ende Vorbereitungsphase)\n\nSC 1: 90 Minuten Dauerlauf bei \"Sprechtempo\" (Dokument Seiler)\nSC 2: 12 Minuten Lauf mit verbesserter Leistung im Verglleich zum Powertest\nSC 3: 1000 Meter mit Verbesserter Zeit im Vergleich zu persöhnlicher Messung im T2\n\nST: Wattbike 30 Sekunden und 3 Minuten MPO (NLZ Tests)"}, {"cid": "snowboard-cross|3|0|5", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nZeitpunkt ST NLZ und ST Swissski Kader: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nSC 1: mind. 90 Minuten Dauerlauf bei \"Sprechtempo\" (Dokument Seiler)\nSC 2: 12 Minuten Lauf mit verbesserter Leistung im Verglleich zur Messung im T3\nSC 3: 1000 Meter mit Verbesserter Zeit im Vergleich zu persöhnlicher Messung im T3\n\nST NLZ: Wattbike 30 Sekunden und 3 Minuten MPO (NLZ Tests)\nST Swissski Kader: Laktatstufentest"}, {"cid": "snowboard-cross|3|0|6", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nZeitpunkt ST NLZ und ST Swissski Kader: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nST NLZ: Wattbike 30 Sekunden und 3 Minuten MPO (NLZ Tests)\nST Swissski Kader: Laktatstufentest"}, {"cid": "snowboard-cross|3|0|7", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Zeitpunkt SC: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nZeitpunkt ST Swissski Kader: Anfang Vorbereitungsphase / Ende Vorbereitungsphase\n\nST Swissski Kader: Laktatstufentest"}, {"cid": "snowboard-cross|3|1|0", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Aktiven Alltag pflegen\n\n• Belastungsverträglichkeit aufbauen\n• Erwerben und Festigen von Bewegungsgrundformen"}, {"cid": "snowboard-cross|3|1|1", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Aktiven Alltag pflegen\n\n• Belastbar werden\n• Anwenden und Variieren von Bewegungsgrundformen"}, {"cid": "snowboard-cross|3|1|2", "sport": "Snowboard Cross", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Aktiven Alltag pflegen\n\nDie Belastungsverträglichkeit soll umfangreich, vielseitig und zugleich herausfordernd aufgebaut werden. Durch die Ausrichtung auf Polysportivität bleibt die Wahl der Sportarten individuell und ermöglicht eine abwechslungsr Belastung oder in/als Trainingseinheit (Cool-Down, Yoga)\n\nMobilisation mit Faszienrolle\n• Nach Bedarf zur allgemeinen und individuell lokalen Entspannung und Regeneration von Muskeln und Gewebe nach der Belastung\n• Vor dynamischen oder statischen Übungen"}, {"cid": "snowboard-cross|4|1|4", "sport": "Snowboard Cross", "theme": "Mobilität & Beweglichkeit", "label": "Inhalt Mobilität", "text": "Dynamische Übungen (Mobilität)\n• Dynamische Bewegungen mit maximalem Bewegungsumfang\n• Vor der Belastung (zur Vorbereitung der Bewegungsumfänge im Training)\n• nach der Belastung\n • als Trainingseinheit oder Tagesroutine\n\nStatische Übungen (Beweglichkeit/Stretching)\n• Statische Positionen im maximalen Bewegungsumfang halten\n• Nach der Belastung oder in/als Trainingseinheit/  Tagesroutine (Cool-Down, Yoga)\n\nMobilisation mit Faszienrolle\n• Nach Bedarf zur allgemeinen und individuell lokalen Entspannung und Regeneration von Muskeln und Gewebe nach der Belastung\n• Vor dynamischen oder statischen Übungen"}, {"cid": "snowboard-cross|5|0|0", "sport": "Snowboard Cross", "theme": "Kraft", "label": "Skills-Checks (SC) & Leistungstests (LT) Kraft", "text": "Swiss-Ski Off Snow Skills Kraft und Stabilität F1-2"}, {"cid": "snowboard-cross|5|0|1", "sport": "Snowboard Cross", "theme": "Kraft", "label": "Skills-Checks (SC) & Leistungstests (LT) Kraft", "text": "SC 1: Kniebeuge einbeinig auf Box\nSC 2: Kniebeuge mit Miniband ohne Zusatzgewicht\nSC 3: Reisskniebeuge mit Stab\nSC 4: Bridging beidbeinig statisch\nSC 5: Standwaage\nSC 6 : Sprung von kniehohem Element  mit beidbeiniger Landung\nSC 7: Liegestütz\nSC 8: Klimmzug (exzentrische Phase)"}, {"cid": "snowboard-cross|5|0|2", "sport": "Snowboard Cross", "theme": "Kraft", "label": "Skills-Checks (SC) & Leistungstests (LT) Kraft", "text": "SC 1: Kniebeuge einbeinig\nSC 2: Kniebeuge mit Zusatzgewicht vorne\nSC 3: Reisskniebeuge mit Reckstange / Langhantel\nSC 4: Umsetzen mit Reckstange / Langhantel\nSC 5: Leg Curls exzentrisch und k ne) Simulation versch. Situationen in einem Heat (an Erster Stelle liegend = Abwehren / Überholmanöver)\n• Antizipieren: lernen Situationen vorauszusehen (besprechen, was wo passieren könnte)\n• Teamtaktik im selben Heat\n\n• Abwehren >> Situationen simulieren\n\n• Windschatten fahren und Überholen\n\n• Strategie vornehmen und diese auch so fahren"}, {"cid": "snowboard-cross|15|0|0", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen erzählen von einem Moment, auf den sie stolz sind."}, {"cid": "snowboard-cross|15|0|1", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben ihre Emotionen in schwierigen Situationen (z.B. bei Fehler) anhand einer Ampel.\n\nRot: Ich bin wütend.\nGelb: Ich bin unsicher.\nGrün: Ich bin ruhig/fokussiert."}, {"cid": "snowboard-cross|15|0|2", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen machen eine Aufgabe (z.B. Technikübung) mit Ablenkungen (z.B. Lärm): Fähigkeit testen, Konzentration zu halten."}, {"cid": "snowboard-cross|15|0|3", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Athleten:innen formulieren ein kleines Ziel für das Training und erklären, warum es ihnen wichtig ist.\nSC 2: Simulierte Stresssituation (z.B Wettkampfsimulation). Kinder sollen bewusst Techniken (z.B. Atmung) einsetzen, um „grün“ zu erreichen."}, {"cid": "snowboard-cross|15|0|4", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben eine Bestleistung: „Wie hast du dich gefühlt?“: Merkmale des persönlichen optimalen Leistungszustand identifizieren und  anwenden."}, {"cid": "snowboard-cross|15|0|5", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Während z.B. Intervalltraining bewusst Atemtechniken nutzen, um Ruhe zu bewahren.\nSC 3: Vor einer Technikaufgabe den Ablauf mental durchspielen."}, {"cid": "snowboard-cross|15|0|6", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Bei einer schwierigen Aufgabe (z.B. Zeitdruck) positive Selbstgespräche anwenden.\nSC 3: Technikübung mit eingebauten Ablenkungen durchführen."}, {"cid": "snowboard-cross|15|1|0", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative ermöglichen"}, {"cid": "snowboard-cross|15|1|1", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative fördern"}, {"cid": "snowboard-cross|15|1|2", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "snowboard-cross|15|1|3", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "snowboard-cross|15|1|4", "sport": "Snowboard Cross", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "snowboard-cross|16|0|0", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Kinder schätzen, wie viel sie pro Training trinken sollten und überprüfen es (z.B. durch Markierungen an der Trinkflasche).\nSC 2: Kinder prüfen selbstständig, ob alle wichtigen Items dabei sind (Taschencheck)."}, {"cid": "snowboard-cross|16|0|1", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Einen Tag bezüglich Ernährung dokumentieren und diskutieren: Essen, Trinken und Snacks."}, {"cid": "snowboard-cross|16|0|2", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Selbständig eine Mahlzeit/Snack für vor, während und nach dem Training/Wettkampf zusammenstellen und diskutieren."}, {"cid": "snowboard-cross|16|0|3", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Mit verschiedenen Snacks, Trinkstrategien oder Mahlzeiten vor/während/nach dem Training/Wettkampf experimentieren und individuell anpassen."}, {"cid": "snowboard-cross|16|0|4", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Ernährung und Hydration unter Wettkampfbedingungen testen (z.B. Gels, isotonische Getränke während Belastung).\nSC 2: Flüssigkeitsverlust, Energiebedarf und Regeneration dokumentieren und auswerten."}, {"cid": "snowboard-cross|16|1|0", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "snowboard-cross|16|1|1", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "snowboard-cross|16|1|2", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nBewusstheit und Anpassung stärken Verständnis für Makronährstoffe (Kohlenhydrate, Eiweiss, Fett) und Flüssigkeitsbedarf vertiefen.\n\nVor dem Training\n1–2h vorher ca. 500 ml Wasser trinken. Bei Hize oder viel Salzverlust leicht salzige Getränke verwenden (1x Prise Salz).\n\nWährend des Trainings\nAlle 15–20' 150–200 ml trinken, >1h Belastung zusätzliche Kohlenhydrate beigeben (z.B. verdünnte Fruchtsäfte).\n\nNach dem Training\n0.5-1 l Flüssigkeit innerhalb von 30'. Bei intens. Belastungen Elektrolytgetränke oder leicht salziges Wasser verwenden."}, {"cid": "snowboard-cross|16|1|3", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "snowboard-cross|16|2|0", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "snowboard-cross|16|2|1", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "snowboard-cross|16|2|2", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Essen", "text": "Vor dem Training\n2–3h vorher: Kohlenhydratreiche, leicht verdauliche Mahlzeit (z.B. Vollkornbrot mit Honig). 30' vorher: Kleiner Snack (z.B. Banane)\n\nWährend des Trainings (>1h Belastung)\n30–60 g Kohlenhydrate pro h (z.B. Energieriegel, Trockenfrüchte)\n\nNach dem Training\nInnerhalb von 30': Snack mit Kohlenhydraten und Eiweiss (z. B. Joghurt mit Obst, Milchshake).\n\nHauptmahlzeit: Ausgewogen mit Kohlenhydraten (z.B. Reis, Nudeln), Eiweiss (z. B. Huhn, Linsen) und Gemüse."}, {"cid": "snowboard-cross|16|2|3", "sport": "Snowboard Cross", "theme": "Ernährung", "label": "Essen", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "snowboard-cross|17|0|0", "sport": "Snowboard Cross", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Fragen an die Kinder: Wie viele Stunden Schlaf brauchen wir? Was hilft uns besser zu schlafen?"}, {"cid": "snowboard-cross|17|0|1", "sport": "Snowboard Cross", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Eine Woche lang Schlafdauer und wie sie sich am nächsten Tag fühlen dokumentieren."}, {"cid": "snowboard-cross|17|0|2", "sport": "Snowboard Cross", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Vor dem Schlafen Atemtechniken oder progressive Muskelrelaxation (PMR) ausprobieren."}, {"cid": "snowboard-cross|17|0|3", "sport": "Snowboard Cross", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Schlafdauer und Qualität eine Woche lang dokumentieren, zusammen mit der Trainingsleistung.\nSC 2: Abendroutinen reflektieren und Anpassungen vornehmen."}, {"cid": "snowboard-cross|17|0|4", "sport": "Snowboard Cross", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Plan für Schlaf- und Essenszeiten vor einem Wettkampf erstellen und umsetzen.\nSC 2: Gedanken vor dem Schlaf „parken“, z.B. durch Aufschreiben oder Atemübungen (Grübelstopp)"}, {"cid": "snowboard-cross|17|1|0", "sport": "Snowboard Cross", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer: 8–10h/Nacht\nSchlaf fördert Konzentration, Energie und Regeneration."}, {"cid": "snowboard-cross|17|1|1", "sport": "Snowboard Cross", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer\n8–10h/Nacht\n\nRoutine\nGleiche Schlafenszeiten, auch am Wochenende.\n\nEntspannung\n1h vor dem Schlafen Bildschirme meiden, Rituale wie Lesen oder Atemübungen einführen.\n\nSchlafumgebung\nDunkel, kühl, ruhig (16–18°C)."}, {"cid": "snowboard-cross|17|1|2", "sport": "Snowboard Cross", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Regelmässige Schlafzeiten\nEntspannungsrituale einbauen\n\nGrübelstopp\nBei längerer Wachzeit aufstehen. Gedanken aufschreiben, um den Kopf zu entlasten. Negative Gedanken über Schlaf in positive Überzeugungen umwandeln.\n\nOptimierter Einsatz von Koffein und Hilfsmitteln\nWirkung beachten (HWZ 6h, verstärkte Wirkung bei Jugendlichen), mind. 6h vor dem Schlaf meiden. Augenmasken, Gehörschutz etc. verwenden.\n\nPowernaps einplanen\nKurze Nickerchen von 10–15' zur Regeneration, ideal nach dem Mittagessen.\n\nAnpassungen bei Reisen und Wettkämpfen\nSchlaf- und Essenszeiten an Zeitverschiebungen anpassen. Strategien gegen Jetlag nutzen."}, {"cid": "snowboard-cross|17|1|3", "sport": "Snowboard Cross", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Eine gezielte und individuelle Schlafoptimierung sichert langfristige die Leistungsfähigkeit.\n\nRegelmässige Schlafroutinen und die Anpassung an Reisen oder Wettkämpfe sind entscheidend.\n\nSchlafprobleme sollten überwacht und bei Bedarf behandelt werden. Powernaps und Entspannungstechniken wie Grübelstopp fördern Erholung und mentale Ruhe."}, {"cid": "snowboard-cross|18|0|0", "sport": "Snowboard Cross", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Skiclub"}, {"cid": "snowboard-cross|18|0|1", "sport": "Snowboard Cross", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Skiclub, RLZ (BASE/ BABE)"}, {"cid": "snowboard-cross|18|0|2", "sport": "Snowboard Cross", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "RLZ (BASE/BABE) Swiss-Ski Kader"}, {"cid": "snowboard-cross|18|0|3", "sport": "Snowboard Cross", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss Ski Kader"}, {"cid": "snowboard-cross|18|0|4", "sport": "Snowboard Cross", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss Ski  A Kader"}, {"cid": "snowboard-cross|18|0|5", "sport": "Snowboard Cross", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss Ski Kade anung", "label": "Vorbereitungsphase 1 (VP1): Mitte Mai-Aug", "text": "Coming soon…"}, {"cid": "snowboard-park-pipe|2|0|1", "sport": "Snowboard Park & Pipe", "theme": "Makroplanung", "label": "Vorbereitungsphase 1 (VP1): Mitte Mai-Aug", "text": "Ziele: Schaffen einer kräftigen und widerstandsfähigen Muskulatur. Aufbau einer guten aeroben Grundlagen. Techniktraining an der Langhantel (Muskelkraftübungen,niedrige Lasten mit hohem Volumen), Steigerung der Kraftentwicklung mittels moderaten Gewichten, koordinatives Arbeiten an Beinachsenstabilität, Lande und Sprungmechanismen. Abwechslungsreiches Training: Bag, Dryslope, Skate und Inline, Trampolin und Akrobatik"}, {"cid": "snowboard-park-pipe|2|0|2", "sport": "Snowboard Park & Pipe", "theme": "Makroplanung", "label": "Vorbereitungsphase 1 (VP1): Mitte Mai-Aug", "text": "Ziele: Schaffen einer kräftigen und widerstandsfähigen Muskulatur. Aufbau einer guten aeroben Grundlagen. Techniktraining an der Langhantel (Muskelleistungsübungen, niedrige Lasten mit hohem Volumen), Steigerung der Kraftentwicklung mittels moderaten Gewichten, koordinatives Arbeiten an Beinachsenstabilität, Lande und Sprungmechanismen. Abwechslungsreiches Training: Bag, Dryslope, Skate und Inline, Trampolin und Akrobatik"}, {"cid": "snowboard-park-pipe|2|1|0", "sport": "Snowboard Park & Pipe", "theme": "Makroplanung", "label": "Vorbereitungsphase 2 (VP2): Sept-Okt", "text": "Coming soon…"}, {"cid": "snowboard-park-pipe|2|1|1", "sport": "Snowboard Park & Pipe", "theme": "Makroplanung", "label": "Vorbereitungsphase 2 (VP2): Sept-Okt", "text": "Ziele: Steigerung der Maximalkraft mittels Krafttraining (Lang- und Kurzhantel,mittlere bis tiefe Wiederholungszahlen), Umsetzen der Grundlagenausdauer in intensiven Intervallformen, Steigerung der Anzahl Bag Trainings gegen Ende dieser Phase"}, {"cid": "snowboard-park-pipe|2|2|0", "sport": "Snowboard Park & Pipe", "theme": "Makroplanung", "label": "Vorwettkampfphase (VWP): Nov", "text": "Coming soon…"}, {"cid": "snowboard-park-pipe|2|2|1", "sport": "Snowboard Park & Pipe", "theme": "Makroplanung", "label": "Vorwettkampfphase (VWP): Nov", "text": "Ziele: Steigerung der Schnell- und Explosivkraft. Plyometrische und statodynamische Formen einbauen. Erhalt der Maximalkraft mit gezielten gesetzten Reizen. Regenerative Ausdauerformen im Grundlagenbereich einbauen. Das Bag- und On-Snow Training steht im Fokus"}, {"cid": "snowboard-park-pipe|2|3|0", "sport": "Snowboard Park & Pipe", "theme": "Makroplanung", "label": "Wettkampfphase (WP): Dez-Apr", "text": "Coming soon…"}, {"cid": "snowboard-park-pipe|2|3|1", "sport": "Snowboard Park & Pipe", "theme": "Makroplanung", "label": "Wettkampfphase (WP): Dez-Apr", "text": "Ziele: Wettkämpfe steuern das Training. Priorisierung der Wettkämpfe (wichtig, mittel, unwichtig). Trainingsblöcke mit Blick auf die Erholung einplanen, Kraft- und Schnelligkeitstraining beibehalten, Erholung und Belastung ausbalancieren. Inhalt: Gezielte Wettkampfvorbereitung. Kraft- und Schnelligkeitstraining. Klare Regenerationsphasen."}, {"cid": "snowboard-park-pipe|3|0|0", "sport": "Snowboard Park & Pipe", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC: Off Snow Skills F1"}, {"cid": "snowboard-park-pipe|3|0|1", "sport": "Snowboard Park & Pipe", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC: Off Snow Skills F2"}, {"cid": "snowboard-park-pipe|3|0|2", "sport": "Snowboard Park & Pipe", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC 1: 1.5-2 h leichte bis moderate sportliche Bewegung am Stück\nSC 2: 30 min intermittierende Bewegung am Stück (intensiv)"}, {"cid": "snowboard-park-pipe|3|0|3", "sport": "Snowboard Park & Pipe", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC 1: 1.5-2 h leichte bis moderate sportliche Bewegung am Stück\nSC 2: 45 min intermittierende Bewegung am Stück (int
