t über 80% HFmax\n• Freie Spielzeit\n• Gezielt viele kurze Pausen einbauen"}, {"cid": "snowboard-park-pipe|3|1|2", "sport": "Snowboard Park & Pipe", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Vorbereitungsphase 1\n• Grundlagenausdauer\n\nVorbereitungsphase 2\n• Grundlagenausdauer\n• Intervallformen (VO2max)\n\nVorwettkampfphase\n• Intervallformen (VO2max)\n• Grundlagenausdauer als Regeneration\n\nWettkampfphase\n• Grundlagenausdauer zur Regeneration\n\nVielseitige ausdauerne Belastungen. Ziel ist der Erhalt des aeroben Potentials der Kindheit:\nIntermittierendes Training:\n• Intensive und extensive Intervalle\n• Wiederholte Sprints\n• Small- sided Games\n\nkontinuierliche Dauerbelastung mit mässiger Intensität wie zum Beispiel:\nHIIT oder Small-Sided Games"}, {"cid": "snowboard-park-pipe|3|1|3", "sport": "Snowboard Park & Pipe", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Vorbereitungsphase 1\n• Grundlagenausdauer\n\nVorbereitungsphase 2\n• Grundlagenausdauer\n• Intervallformen (VO2max)\n\nVorwettkampfphase\n• Intervallformen (VO2max)\n• Grundlagenausdauer als Regeneration\n\nWettkampfphase\n• Grundlagenausdauer zur Regeneration\n\nVielseitige Belastungsformen zum Weiterentwickeln der aeroben und anaeroben Leistungsfähigkeit, sowie zur Verbesserung der Erholungsfähigkeit:\n• Dauermethode\n• Intervallmethode (Mittel- und Kurzzeitintervall)\n• Spielerische Intervallformen (Staffetten, Parcours)\n\nIdee: Ausdauerbelastungen hauptächlich zum Erhalt der Ausdauer, sowie zum Verbessern der Leistungsfähigkeit und der Erholungsfähigkeit in der Höhe"}, {"cid": "snowboard-park-pipe|3|1|4", "sport": "Snowboard Park & Pipe", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Vorbereitungsphase 1\n• Grundlagenausdauer (aerobe Basis)\n\nVorbereitungsphase 2\n• Grundlagenausdauer\n• Intervallformen (VO2max, Laktatverträglichkeit)\n\nVorwettkampfphase\n• Intervallformen (Laktatverträglichkeit, VO2max)\n• Grundlagenausdauer (als Regeneration und ab xplosivität", "label": "Skills-Checks (SC) & Leistungstests (LT) Kraft", "text": "SC 1: Kniebeuge einbeinig\nSC 2: Kniebeuge mit Langhantel vorne\nSC 3: Kniebeuge mit Langhantel hinten\nSC 4: Reisskniebeuge mit Langhantel\nSC 5: Umsetzen aus dem Hang\nSC 6: Reissen aus dem Hang\nSC 7: Drop Snatch mit Langhantel\nSC 8: Nordic Hamstring\nSC 9: Sprung von kniehohem Element mit einbeiniger Landung\nSC 10: Seitsprünge mit Stabilisieren\nSC 11: Box Jump to High Jump\nSC 12: Kombinationsbewegungen mit Langhantel imbalanced\nSC 13: Rotated Sit Ups Full ROM im GHD\n\nST: NLZ Tests (Nordboard, Jump), Powertest"}, {"cid": "snowboard-park-pipe|5|0|7", "sport": "Snowboard Park & Pipe", "theme": "Kraft & Explosivität", "label": "Skills-Checks (SC) & Leistungstests (LT) Kraft", "text": "SC 1: Kniebeuge vorne\nSC 2: Kniebeuge hinten\nSC 3: Reisskniebeuge\nSC 4: Umsetzen\nSC 5: Reissen\nSC 6: Drop Snatch\nSC 7: Nordic Hamstring\n\nST: NLZ Test oder LD Magglingen"}, {"cid": "snowboard-park-pipe|5|1|0", "sport": "Snowboard Park & Pipe", "theme": "Kraft & Explosivität", "label": "Inhalt Kraft", "text": "Eingrenzen\nSpielerische Formen der Basis-bewegungen: Stossen, Stützen, Bremsen, Ziehen\nGanzheitlich Stark\n\nAktiven Alltag pflegen\n• Belastungsverträglichkeit aufbauen: Kraft, Stabilität & Schnellkraft\n• Erwerben und Festigen von spielerischen Krafteinheiten"}, {"cid": "snowboard-park-pipe|5|1|1", "sport": "Snowboard Park & Pipe", "theme": "Kraft & Explosivität", "label": "Inhalt Kraft", "text": "Eingrenzen\nSpielerische Formen der Basisbewegungen: Stossen, Stützen, Bremsen, Ziehen\nGanzheitlich Stark\n\nSommer\n• Techniktraining (Bewegungsschulung)\n• Koordination im vollen Bewegungsumfang\n• Übungen mit dem eigenen Körpergewicht\n• Variantenreiche Sprungformen\n\nWinter\n• Variantenreiche Sprungformen\n• Erhaltung der Kraft (ganzheitlich stark bleiben)"}, {"cid": "snowboard-park-pipe|5|1|2", "sport": "Snowboard Park & Pipe", "theme": "Kraft & Explosivität", "label": "Inhalt Kraft", "text": "Eingrenzen\nSpielerische Formen der Basisbewegungen: Stossen, Stützen, Bremsen, Ziehen\nGanzheitlich Stark\n\nVorbereitungsphase 1\n• Langhanteltechnik mit Körpergewicht und leichten Zusatzgewicht (unterschiedliche Kniebeugeformen)\n• Erste Sprungformen mit Fokus auf korrekte Landungsmechanismen (Beinachse)\n• Entwicklung der Rumpfkontrolle und der Stabilität\n\nVorbereitungsphase 2\n• Kraftpotential steigern\n• Steigerung der Explosivkraft\n• Rumpfkrafttraining statisch mit einzelnen dynamischen Formen\n\nVorwettkampfphase\n• Explosivkrafttraining\n• Rumpfkrafttraining\n\nWettkampfphase\n• Krafttraining mit reduziertem Volumen\n• Rumpfkrafttraining erhalten\n• Präventionsprogramme (ISPA)"}, {"cid": "snowboard-park-pipe|5|1|3", "sport": "Snowboard Park & Pipe", "theme": "Kraft & Explosivität", "label": "Inhalt Kraft", "text": "Belasten\nEntwickeln der Kraft mittels Muskelkraftübungen. Tiefe bis mittlere Intensität mit hohem Trainingsumfang. Die Qualität ist hierbei entscheidend. Technisches Ausarbeiten der Muskelkraftübungen, bei guter Qualität bereits mit Zusatzgewichten arbeiten.\n\nVorbereitungsphase 1\n• Heranführen der unteren Extremitäten und des Rumpfes an die höheren Lasten der nächsten Stufe\n• Technisches erarbeiten der Langhanteltechnik in den Muskelleistungsübungen\n\nVorbereitungsphase 2\n• Muskelpotential Aufbauen (Muskelkraftübungen als Trainingsübung anwenden)\n• weiter Entwickeln und anschliessendes Nutzen der Muskelleistungsübungen\n• Rumpfkrafttraining statisch und dynamisch mit Zusatzgewichten\n• Explosivkrafttraining mit und ohne Zusatzgewichten\n\nVorwettkampfphase\n• Steigerung der Maximalkraft durch intramuskuläres Koordinationstraining (Muskelpotential ausprägen)\n• Steigerung der Explosivkraft mit und ohne Zusatzlast\n• Sprung und Landevarianten einbauen\n• dynamische und statische Rumpfkraft polarisiert und sportartspezifisch einbauen\n\nWettkampfphase\n• Explosiv- und Maximalkraft erhalten\n• hohe Intensitäten und reduzierter Umfang der Krafteinheiten\n• Präventionsprogramme"}, {"cid": "snowboard-park-pipe|5|1|4", "sport": "Snowboard Park & Pipe", "theme": "Kraft & Explosivität", "label": "Inhalt Kraft", "text": "Belasten\nEntwickeln der Kraft mittels Muskelkraftübungen. Tiefe bis mittlere Intensität mit hohem Trainingsumfang. Die Qualität ist hierbei entscheidend. Technisches Ausarbeiten der Muskelkraftübungen, bei guter Qualität bereits mit Zusatzgewichten arbeiten.\n\nVorbereitungsphase 1\n• Heranführen der unteren Extremitäten und des Rumpfes an die höheren Lasten der nächsten Stufe\n• Technisches erarbeiten der Langhanteltechnik in den Muskelleistungsübungen\n\nVorbereitungsphase 2\n• Muskelpotential Aufbauen (Muskelkraftübungen als Trainingsübung anwenden)\n• weiter Entwickeln und anschliessendes Nutzen der Muskelleistungsübungen\n• Rumpfkrafttraining statisch und dynamisch mit Zusatzgewichten\n• Explosivkrafttraining mit und ohne Zusatzgewichten\n\nVorwettkampfphase\n• Steigerung der Maximalkraft durch intramuskuläres Koordinationstraining (Muskelpotential ausprägen)\n• Steigerung der Explosivkraft mit und ohne Zusatzlast\n• Sprung und Landevarianten einbauen\n• dynamische und statische Rumpfkraft polarisiert und sportartspezifisch einbauen\n\nWettkampfphase\n• Explosiv- und Maximalkraft erhalten\n• hohe Intensitäten und reduzierter Umfang der Krafteinheiten\n• Präventionsprogramme"}, {"cid": "snowboard-park-pipe|6|0|0", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC  \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\n\nOff Snow Skills F1-2\n\nSiehe Swiss-Ski-Skills"}, {"cid": "snowboard-park-pipe|6|0|1", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\nSC 1: Sprint (25m)\nSC 2: 30x Seilspringen Einfachdurchzüge"}, {"cid": "snowboard-park-pipe|6|0|2", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\nSC 1: Sprint (25m & 50m)\nSC 2: 50x Seilspringen Einfachdurchzüge, 10 Doppeldurchzüge am Stück"}, {"cid": "snowboard-park-pipe|6|0|3", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\nSC 1: Sprint (30m & 60m)\nSC 2: 50x Seilspringen Einfachdurchzüge, 20x Doppeldurchzüge am Stück"}, {"cid": "snowboard-park-pipe|6|0|4", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\nSC 1: Sprint (30m & 80m)\nSC 2: 100x Seilspringen Einfachdurchzüge, 30x Doppeldurchzüge am Stück"}, {"cid": "snowboard-park-pipe|6|0|5", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC \"Lauf-ABC\": Punktevergabe (1-4) in den Kriterien Rhythmus, Körperhaltung, Dynamik & Koordination.\nSC 1: Sprint (30m & 100m)\nSC 2: 100x Seilspringen Einfachdurchzüge, 40x Doppeldurchzüge am Stück"}, {"cid": "snowboard-park-pipe|6|0|6", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Skills-Checks (SC) & Leistungstests (LT) Schnelligkeit", "text": "SC 1: Sprints über unterschliedliche Distanzen 30 m/ 80-100 m\nSC 2: Seilspringen 200x Einfachdurchzüge, 100x Doppeldurchzüge\nSC 3: Leichtathletische Grundlagen (Lauf ABC und Sprungvarianten maximal)"}, {"cid": "snowboard-park-pipe|6|1|0", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Beginne jedes Training mit Übungen aus\nden Bewegungs- und Spielgrundformen. Diese Formen sind sportübergreifend und fördern die Bewegungskompetenz der Kinder.\nSchnelligkeit:\nÜbungen aus den Bewegungs- und Spielgrundformen zur Steigerung der Explosivität: Laufen,\nSpringen, Hüpf- und Sprungformen verpackt in Spielformen oder Übungsformen zu Verbesserung der koordinativen Kompetenz, werfen und fangen, Seilspringen.\n\nExplosivität:\nÜbungen aus den Bewegungs- und Spielgrundformen zur Steigerung der Explosivität: Laufen, Springen, Hüpf- und Sprungformen verpackt in Spielformen\noder Übungsformen zu Verbesserung der koordinativen Kompetenz, werfen und fangen, Seilspringen\n\nGestalte die Spiel- und Bewegungsgrundformen freudvoll und\nverpack sie in fantasievolle, abwechslungsreiche Spiele."}, {"cid": "snowboard-park-pipe|6|1|1", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Wähle Übungen aus den Bewegungs- und\nSpielgrundformen, welche einen der Entwicklungsfaktoren\nKraft, Explosivität oder Schnelligkeit akzentuieren.\n\nSchnelligkeit:\nÜbungen aus den Bewegungs- und Spielgrundformen zur Steigerung der Explosivität: Laufen,\nSpringen, Hüpf- und Sprungformen verpackt in Spielformen oder Übungsformen zu Verbesserung der koordinativen Kompetenz, werfen und fangen, Seilspringen.\n\nExplosivität:\nÜbungen aus den Bewegungs- und Spielgrundformen zur Steigerung der Explosivität: Laufen, Springen, Hüpf- und Sprungformen verpackt in Spielformen\noder Übungsformen zu Verbesserung der koordinativen Kompetenz, werfen und fangen, Seilspringen\n\nGestalte die Spiel- und Bewegungsgrundformen freudvoll und verpack sie in fantasievolle, abwechslungsreiche Spiele."}, {"cid": "snowboard-park-pipe|6|1|2", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Wähle Übungen aus den Bewegungs- und\nSpielgrundformen, welche einen der Entwicklungsfaktoren\nKraft, Explosivität oder Schnelligkeit akzentuieren.\n\nSchnelligkeit:\nÜbungen aus den Bewegungs- und Spielgrundformen zur Steigerung der Explosivität: Laufen,\nSpringen, Hüpf- und Sprungformen verpackt in Spielformen oder Übungsformen zu Verbesserung der koordinativen Kompetenz, werfen und fangen, Seilspringen.\nÜbungen aus den athletischen Basisbewegungen:\nBeschleunigung, maximal schnell sein oder Sprints mit Richtungswechsel.\n\nExplosivität:\nÜbungen aus den athletischen Basisbewegungen\nHüpfen/Springen, Springen/Landen und Werfen:\nSeilspringen, Reifensprünge oder Wurfformen."}, {"cid": "snowboard-park-pipe|6|1|3", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Schnelligkeit:\nVariiere in der Wahl der athletischen Erscheinungsform:\n• Beschleunigung\n• Maximalgeschwindigkeit\n• Richtungswechsel\nvon Training zu Training oder plane zwei athletische Erscheinungsformen in der gleichen Einheit ein.\n\nExplosivität:\nBeginne das Explosivkrafttraining mit 60-70% Grundlagentraining und 30-40% Leistungstraining, steigere dann allmählich den Anteil des Leistungstrainings.\nLeistungstraining: Explosivität: Einfach- vor Mehrfachsprünge (z.B. Doppelbeinsprünge vertikal sowie horizontal)\nGrundlagentraining Explosivität: Steigerung der Belastbarkeit, z.B. durch verschiedene Formen des Seilspringens (Oberschenkel-, Fussgelenkdominant, mit Partner, Doppelsprünge etc.)"}, {"cid": "snowboard-park-pipe|6|1|4", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Erhöhe den Anteil des Grundlagentrainings Explosivität\nund Kraft (mind. 2/3), technisches und athletisches\nGrundlagentraining zur Reduzierung der Belastung anstelle\ndes Leistungstrainings (1/3).\n\nSchnelligkeit:\nLeistungstraining Schnelligkeit: Lineares Sprinttraining;\nAkzentuierung des Trainings der Frequenzschnelligkeit\nGrundlagentraining Schnelligkeit: Übungen für die\nBewegungskontrolle (Techniktraining).\n\nExplosivität:\nErhöhe im Training der Explosivität den Anteil des athletischen und technischen Grundlagentrainings\nLeistungstraining: Explosivität: Einfach- vor Mehrfachsprünge (z.B. Doppelbeinsprünge vertikal sowie horizontal)\nGrundlagentraining Explosivität: Steigerung der Belastbarkeit, z.B. durch verschiedene Formen des Seilspringens"}, {"cid": "snowboard-park-pipe|6|1|5", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Schnelligkeit:\nspezifisch\n• Beschleunigungen\n• Richtungswechsel\n• Maximalgeschwindigkeit\n• Zwischen einzelnen Sprints 1:10-20 Pause (z.B. 5sec. Sprintdauer = mind. 100 Sec. Pause)\nallgemein:\n• Widerstand Stossen/ Ziehen (Beschleunigen)\n• Widerstand ziehen (Transitionsphase)\n• Zugunterstützung (Overspeed)\n\nExplosivität:\n• Sprungformen entwickeln\n• Leistungstraining Explosivität: Bei Sprungformen Einfach- vor\nMehrfachsprünge (z.B. Doppelbeinsprünge vertikal sowie horizontal)"}, {"cid": "snowboard-park-pipe|6|1|6", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Schnelligkeit:\nspezifisch\n• Beschleunigungen\n• Richtungswechsel\n• Maximalgeschwindigkeit\n• Zwischen einzelnen Sprints 1:10-20 Pause (z.B. 5sec. Sprintdauer = mind. 100 Sec. Pause)\nallgemein:\n• Widerstand Stossen/ Ziehen (Beschleunigen)\n• Widerstand ziehen (Transitionsphase)\n• Zugunterstützung (Overspeed)\n\nExplosivität:\n• Sprungformen entwickeln\n• Entwicklung der Sprungformen auf der gesamten Kraft-Geschwindigkeitskurve\n• Nutzung des exzentrischen Vordehnens\n• Übungsformen wählen, die auch auf kurze Brems- und Beschleunigungsphasen ausgerichtet sind."}, {"cid": "snowboard-park-pipe|6|1|7", "sport": "Snowboard Park & Pipe", "theme": "Schnelligkeit & Agilität", "label": "Inhalt Schnelligkeit", "text": "Schnelligkeit:\nspezifisch\n• Beschleunigungen\n• Richtungswechsel\n• Maximalgeschwindigkeit\n• Zwischen einzelnen Sprints 1:10-20 Pause (z.B. 5sec. Sprintdauer = mind. 100 Sec. Pause)\nallgemein:\n• Widerstand Stossen/ Ziehen (Beschleunigen)\n• Widerstand ziehen (Transitionsphase)\n• Zugunterstützung (Overspeed)\n\nExplosivität:\n• Sprungformen trainieren, die  der Charakteristik sowie  der Belastungsdynamik der Zielform gleichen\n• Sprungformen auf der gesamten Kraft-Geschwindigkeitskurve trainieren\n• Nutzung des exzentrischen Vordehnens\n• Übungsformen wählen, die auch auf kurze Brems- und Beschleunigungsphasen ausgerichtet sind."}, {"cid": "snowboard-park-pipe|9|0|0", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen erzählen von einem Moment, auf den sie stolz sind."}, {"cid": "snowboard-park-pipe|9|0|1", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben ihre Emotionen in schwierigen Situationen (z.B. bei Fehler) anhand einer Ampel.\n\nRot: Ich bin wütend.\nGelb: Ich bin unsicher.\nGrün: Ich bin ruhig/fokussiert."}, {"cid": "snowboard-park-pipe|9|0|2", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen machen eine Aufgabe (z.B. Technikübung) mit Ablenkungen (z.B. Lärm): Fähigkeit testen, Konzentration zu halten."}, {"cid": "snowboard-park-pipe|9|0|3", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Athleten:innen formulieren ein kleines Ziel für das Training und erklären, warum es ihnen wichtig ist.\nSC 2: Simulierte Stresssituation (z.B Wettkampfsimulation). Kinder sollen bewusst Techniken (z.B. Atmung) einsetzen, um „grün“ zu erreichen."}, {"cid": "snowboard-park-pipe|9|0|4", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben eine Bestleistung: „Wie hast du dich gefühlt?“: Merkmale des persönlichen optimalen Leistungszustand identifizieren und  anwenden."}, {"cid": "snowboard-park-pipe|9|0|5", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Während z.B. Intervalltraining bewusst Atemtechniken nutzen, um Ruhe zu bewahren.\nSC 3: Vor einer Technikaufgabe den Ablauf mental durchspielen."}, {"cid": "snowboard-park-pipe|9|0|6", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Bei einer schwierigen Aufgabe (z.B. Zeitdruck) positive Selbstgespräche anwenden.\nSC 3: Technikübung mit eingebauten Ablenkungen durchführen."}, {"cid": "snowboard-park-pipe|9|0|7", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "Coming soon…"}, {"cid": "snowboard-park-pipe|9|1|0", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative ermöglichen"}, {"cid": "snowboard-park-pipe|9|1|1", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "snowboard-park-pipe|9|1|2", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "snowboard-park-pipe|9|1|3", "sport": "Snowboard Park & Pipe", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "snowboard-park-pipe|10|0|0", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Kinder schätzen, wie viel sie pro Training trinken sollten und überprüfen es (z.B. durch Markierungen an der Trinkflasche).\nSC 2: Kinder prüfen selbstständig, ob alle wichtigen Items dabei sind (Taschencheck)."}, {"cid": "snowboard-park-pipe|10|0|1", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Einen Tag bezüglich Ernährung dokumentieren und diskutieren: Essen, Trinken und Snacks."}, {"cid": "snowboard-park-pipe|10|0|2", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Selbständig eine Mahlzeit/Snack für vor, während und nach dem Training/Wettkampf zusammenstellen und diskutieren."}, {"cid": "snowboard-park-pipe|10|0|3", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Mit verschiedenen Snacks, Trinkstrategien oder Mahlzeiten vor/während/nach dem Training/Wettkampf experimentieren und individuell anpassen."}, {"cid": "snowboard-park-pipe|10|0|4", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Ernährung und Hydration unter Wettkampfbedingungen testen (z.B. Gels, isotonische Getränke während Belastung).\nSC 2: Flüssigkeitsverlust, Energiebedarf und Regeneration dokumentieren und auswerten."}, {"cid": "snowboard-park-pipe|10|0|5", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "Coming soon…"}, {"cid": "snowboard-park-pipe|10|1|0", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "snowboard-park-pipe|10|1|1", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "snowboard-park-pipe|10|1|2", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nBewusstheit und Anpassung stärken Verständnis für Makronährstoffe (Kohlenhydrate, Eiweiss, Fett) und Flüssigkeitsbedarf vertiefen.\n\nVor dem Training\n1–2h vorher ca. 500 ml Wasser trinken. Bei Hize oder viel Salzverlust leicht salzige Getränke verwenden (1x Prise Salz).\n\nWährend des Trainings\nAlle 15–20' 150–200 ml trinken, >1h Belastung zusätzliche Kohlenhydrate beigeben (z.B. verdünnte Fruchtsäfte).\n\nNach dem Training\n0.5-1 l Flüssigkeit innerhalb von 30'. Bei intens. Belastungen Elektrolytgetränke oder leicht salziges Wasser verwenden."}, {"cid": "snowboard-park-pipe|10|1|3", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "snowboard-park-pipe|10|2|0", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "snowboard-park-pipe|10|2|1", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "snowboard-park-pipe|10|2|2", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Essen", "text": "Vor dem Training\n2–3h vorher: Kohlenhydratreiche, leicht verdauliche Mahlzeit (z.B. Vollkornbrot mit Honig). 30' vorher: Kleiner Snack (z.B. Banane)\n\nWährend des Trainings (>1h Belastung)\n30–60 g Kohlenhydrate pro h (z.B. Energieriegel, Trockenfrüchte)\n\nNach dem Training\nInnerhalb von 30': Snack mit Kohlenhydraten und Eiweiss (z. B. Joghurt mit Obst, Milchshake).\n\nHauptmahlzeit: Ausgewogen mit Kohlenhydraten (z.B. Reis, Nudeln), Eiweiss (z. B. Huhn, Linsen) und Gemüse."}, {"cid": "snowboard-park-pipe|10|2|3", "sport": "Snowboard Park & Pipe", "theme": "Ernährung", "label": "Essen", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "snowboard-park-pipe|11|0|0", "sport": "Snowboard Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Fragen an die Kinder: Wie viele Stunden Schlaf brauchen wir? Was hilft uns besser zu schlafen?"}, {"cid": "snowboard-park-pipe|11|0|1", "sport": "Snowboard Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Eine Woche lang Schlafdauer und wie sie sich am nächsten Tag fühlen dokumentieren."}, {"cid": "snowboard-park-pipe|11|0|2", "sport": "Snowboard Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Vor dem Schlafen Atemtechniken oder progressive Muskelrelaxation (PMR) ausprobieren."}, {"cid": "snowboard-park-pipe|11|0|3", "sport": "Snowboard Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Schlafdauer und Qualität eine Woche lang dokumentieren, zusammen mit der Trainingsleistung.\nSC 2: Abendroutinen reflektieren und Anpassungen vornehmen."}, {"cid": "snowboard-park-pipe|11|0|4", "sport": "Snowboard Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Plan für Schlaf- und Essenszeiten vor einem Wettkampf erstellen und umsetzen.\nSC 2: Gedanken vor dem Schlaf „parken“, z.B. durch Aufschreiben oder Atemübungen (Grübelstopp)"}, {"cid": "snowboard-park-pipe|11|0|5", "sport": "Snowboard Park & Pipe", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "Coming soon…"}, {"cid": "snowboard-park-pipe|11|1|0", "sport": "Snowboard Park & Pipe", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer: 8–10h/Nacht\nSchlaf fördert Konzentration, Energie und Regeneration."}, {"cid": "snowboard-park-pipe|11|1|1", "sport": "Snowboard Park & Pipe", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer\n8–10h/Nacht\n\nRoutine\nGleiche Schlafenszeiten, auch am Wochenende.\n\nEntspannung\n1h vor dem Schlafen Bildschirme meiden, Rituale wie Lesen oder Atemübungen einführen.\n\nSchlafumgebung\nDunkel, kühl, ruhig (16–18°C)."}, {"cid": "snowboard-park-pipe|11|1|2", "sport": "Snowboard Park & Pipe", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Regelmässige Schlafzeiten\nEntspannungsrituale einbauen\n\nGrübelstopp\nBei längerer Wachzeit aufstehen. Gedanken aufschreiben, um den Kopf zu entlasten. Negative Gedanken über Schlaf in positive Überzeugungen umwandeln.\n\nOptimierter Einsatz von Koffein und Hilfsmitteln\nWirkung beachten (HWZ 6h, verstärkte Wirkung bei Jugendlichen), mind. 6h vor dem Schlaf meiden. Augenmasken, Gehörschutz etc. verwenden.\n\nPowernaps einplanen\nKurze Nickerchen von 10–15' zur Regeneration, ideal nach dem Mittagessen.\n\nAnpassungen bei Reisen und Wettkämpfen\nSchlaf- und Essenszeiten an Zeitverschiebungen anpassen. Strategien gegen Jetlag nutzen."}, {"cid": "snowboard-park-pipe|11|1|3", "sport": "Snowboard Park & Pipe", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Eine gezielte und individuelle Schlafoptimierung sichert langfristige die Leistungsfähigkeit.\n\nRegelmässige Schlafroutinen und die Anpassung an Reisen oder Wettkämpfe sind entscheidend.\n\nSchlafprobleme sollten überwacht und bei Bedarf behandelt werden. Powernaps und Entspannungstechniken wie Grübelstopp fördern Erholung und mentale Ruhe."}, {"cid": "snowboard-park-pipe|12|0|0", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Skiclub,Sportclub"}, {"cid": "snowboard-park-pipe|12|0|1", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "RLZ,Skiclub,Sportclub"}, {"cid": "snowboard-park-pipe|12|0|2", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "RV, NLZ"}, {"cid": "snowboard-park-pipe|12|0|3", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "NLZ, Swiss-Ski Kader"}, {"cid": "snowboard-park-pipe|12|0|4", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss-Ski Kader"}, {"cid": "snowboard-park-pipe|12|0|5", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss Ski Kader NM"}, {"cid": "snowboard-park-pipe|12|1|0", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "keine"}, {"cid": "snowboard-park-pipe|12|1|1", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "Talent Card Lokal"}, {"cid": "snowboard-park-pipe|12|1|2", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "Talent Card Lokal oder Regional"}, {"cid": "snowboard-park-pipe|12|1|3", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "Talent Card Regional oder National"}, {"cid": "snowboard-park-pipe|12|1|4", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "Talent Card National"}, {"cid": "snowboard-park-pipe|12|1|5", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "Elite, Bronze, Silber"}, {"cid": "snowboard-park-pipe|12|1|6", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "Elite, Silber oder Gold"}, {"cid": "snowboard-park-pipe|12|1|7", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "Silber oder Gold"}, {"cid": "snowboard-park-pipe|12|2|0", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Wettkampfart", "text": "keine"}, {"cid": "snowboard-park-pipe|12|2|1", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Wettkampfart", "text": "Wettbewerbe in der Interregion (Ost, Mitte, West)"}, {"cid": "snowboard-park-pipe|12|2|2", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Wettkampfart", "text": "Wettbewerbe in der Interregion (Ost, Mitte, West) oder Stufe National-C"}, {"cid": "snowboard-park-pipe|12|2|3", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Wettkampfart", "text": "Wettbewerbe in der Interregion (Ost, Mitte, West) und Stufe National-C"}, {"cid": "snowboard-park-pipe|12|2|4", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Wettkampfart", "text": "NC/FIS Junior, NB/FIS, NA/Europa Cup, JWM, EYOF, YOG"}, {"cid": "snowboard-park-pipe|12|2|5", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Wettkampfart", "text": "NB/FIS, NA und Europa Cup, JWM, EYOF, YOG"}, {"cid": "snowboard-park-pipe|12|2|6", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Wettkampfart", "text": "World Cup, WM, OG"}, {"cid": "snowboard-park-pipe|12|3|0", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Anzahl Wettkämpfe", "text": "Keine"}, {"cid": "snowboard-park-pipe|12|3|1", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Anzahl Wettkämpfe", "text": "2 bis 4"}, {"cid": "snowboard-park-pipe|12|3|2", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Anzahl Wettkämpfe", "text": "4 bis 6"}, {"cid": "snowboard-park-pipe|12|3|3", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Anzahl Wettkämpfe", "text": "Style 4 bis 6"}, {"cid": "snowboard-park-pipe|12|3|4", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Anzahl Wettkämpfe", "text": "Style 8 bis 10"}, {"cid": "snowboard-park-pipe|12|3|5", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Anzahl Wettkämpfe", "text": "~10"}, {"cid": "snowboard-park-pipe|12|3|6", "sport": "Snowboard Park & Pipe", "theme": "Förderstrukturen & Wettkämpfe", "label": "Anzahl Wettkämpfe", "text": "~12"}, {"cid": "snowboard-park-pipe|13|0|0", "sport": "Snowboard Park & Pipe", "theme": "Selektionen", "label": "Testing & Leistungsdiagnostik", "text": "Coming soon…"}, {"cid": "snowboard-park-pipe|13|0|1", "sport": "Snowboard Park & Pipe", "theme": "Selektionen", "label": "Testing & Leistungsdiagnostik", "text": "Heimtrainereinschätzung\n• Wird von der Trägerschaft erstellt\n• Muss über das Assessment termingerecht eingereicht werden\n• Empfehlung: AWK mit geforderten Wochenumfängen (+/-)\n\nTesting\nMeldung ohne Powertest, Wettkampfresultate und TCU-Resultate möglich\n\nWettkampfresultate\n• Die Regionale Gesamtrangliste U11/U13 der jeweiligen interregionalen Tour wird beigezogen\n• Wir empfehlen, an den interregionalen Touren in deiner Region teilzunehmen. (BUZZ Tour, Eastside Tour, Tour Freestyle Romand)"}, {"cid": "snowboard-park-pipe|13|0|2", "sport": "Snowboard Park & Pipe", "theme": "Selektionen", "label": "Testing & Leistungsdiagnostik", "text": "Heimtrainereinschätzung\n• Wird von den Trägerschaft erstellt\n• Muss über das Assessment termingerecht eingereicht werden\n• AWK mit geforderten Wochenumfängen (+/-)\n\nEs müssen folgende Test-Resultate vorliegen:\n• Powertest\n• TCU\n• Liegen keine Resultate vor = Note 1\n• Notengebung gemäss Prozentangaben in PISTE Guidelines\n\nWettkampfresultate\n• Die Regionale Gesamtrangliste U11/U13 der jeweiligen interregionalen Tour wird beigezogen..\n• bzw. die Nationale Gesamtrangliste U15/U18 wird beigezogen\n• Dies höchste Punktzahl aus den möglichen Disziplinen wird berücksichtigt\n• Für eine Regionale Karte müssen Wettkampfesultate vorliegen\n• Keine Wettkampfresultate = Note 1\n• Notengebung gemäss PISTE Guidelines"}, {"cid": "snowboard-park-pipe|13|0|3", "sport": "Snowboard Park & Pipe", "theme": "Selektionen", "label": "Testing & Leistungsdiagnostik", "text": "Heimtrainereinschätzung\n• Wird von den Trägerschaft erstellt\n• Muss über das Assessment termingerecht eingereicht werden\n• AWK mit geforderten Wochenumfängen (+/-)\n\nEs müssen folgende Test-Resultate vorliegen:\n• Powertest\n• TCU On- und Off-Snow mit Werten von mindestens 55% Performer oder 75% Contender\n• Liegen keine Resultate vor = Note 1\n• Notengebung gemäss Prozentangaben in PISTE Guidelines\n• Für eine Nationale Karte muss ein nationaler Powertest mit mind. Mittelwert 51 Punkte absolviert werden (ab 26/27 mit 55 P.)\n• Notengebung gemäss Prozentangaben in PISTE Guidelines\n\nWettkampfresultate\n• Die FIS/WSPL Liste wird beigezogen\n• Dies höchste Punktzahl aus den möglichen Disziplinen wird berücksichtigt\n• Notengebung gemäss PISTE Guidelines (www.Thatsnowsports.ch)\n• Verletztenstatus muss mit Arztzeugnis bei Assessment begründet werden"}, {"cid": "snowboard-park-pipe|13|0|4", "sport": "Snowboard Park & Pipe", "theme": "Selektionen", "label": "Testing & Leistungsdiagnostik", "text": "Heimtrainereinschätzung\n• Wird von den Trägerschaft erstellt\n• Muss über das Assessment termingerecht eingereicht werden\n• AWK mit geforderten Wochenumfängen (+/-)\n\nEs müssen folgende Test-Resultate vorliegen:\n• Powertest mit mind. 55 Punkten (ab 26/27 mit 60 P.)\n• TCU On- und Off-Snow Resultate mit mindestens 80%-Score\n• NLZ Test muss absolviert werden\n• Liegen keine R ": "Snowboard Park & Pipe", "theme": "Material", "label": "Off Snow", "text": "• Turnschuhe Outdoor\n• Hallenschuhe / Turnschuhe Indoor\n• Velo/MTB plus Helm und Protektoren\n• Skateboard (plus Skateschuhe) plus Helm und Protektoren / Inlines plus Helm und Protektoren\n\nBag-Training\n• Neopren\n• Snowboardschuhe\n• Snowboard plus Bindung\n• Helm"}, {"cid": "snowboard-park-pipe|15|1|0", "sport": "Snowboard Park & Pipe", "theme": "Material", "label": "On Snow Allgemein", "text": "• Snowboard plus Bindung\n• Snowboardboots\n• Helm und Goggles\n• Rückenpanzer\n• Mouthguard (empfohlen)\n\n--> Material kann/soll gemietet oder übernommen werden (ausser Helm und Mouthguard)"}, {"cid": "snowboard-park-pipe|15|1|1", "sport": "Snowboard Park & Pipe", "theme": "Material", "label": "On Snow Allgemein", "text": "• Snowboard plus Bindung\n• Snowboardboots\n• Helm und Goggles\n• Rückenpanzer\n• Mouthguard (empfohlen)"}, {"cid": "snowboard-park-pipe|15|1|2", "sport": "Snowboard Park & Pipe", "theme": "Material", "label": "On Snow Allgemein", "text": "• mind. 2 Training Snowboard plus Bindung\n• mind. 2 Wettkampf Snowboard plus Bindung\n• 2x Snowboardboots\n• 2x Helm und Goggles\n• Rückenpanzer\n• Mouthguard (empfohlen)"}];
const PW="ftem26*";
const SUPA_URL="",SUPA_KEY="";
const gate=document.getElementById('gate'),app=document.getElementById('app');
const listEl=document.getElementById('list'),statusEl=document.getElementById('astatus'),saveBtn=document.getElementById('asave');
const base={};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
document.getElementById('gateform').addEventListener('submit',function(e){
  e.preventDefault();
  if(document.getElementById('gatepw').value===PW){gate.classList.add('hidden');app.hidden=false;init();}
  else{document.getElementById('gateerr').textContent='Falsches Passwort.';}
});
function render(){
  let html='',lastSport=null;
  DATA.forEach(function(it,idx){
    if(it.sport!==lastSport){html+='<div class="sport-h">'+esc(it.sport)+'</div>';lastSport=it.sport;}
    const meta='<b>'+esc(it.theme)+'</b>'+(it.label?(' &middot; '+esc(it.label)):'');
    html+='<div class="item" data-i="'+idx+'"><div class="meta">'+meta+'</div><textarea>'+esc(it.text)+'</textarea></div>';
  });
  listEl.innerHTML=html;
  listEl.querySelectorAll('.item').forEach(function(el){
    const i=+el.dataset.i;base[DATA[i].cid]=DATA[i].text;
    const ta=el.querySelector('textarea');
    ta.addEventListener('input',function(){el.classList.toggle('changed',ta.value!==base[DATA[i].cid]);updateCount();});
  });
}
function changed(){
  const out=[];
  listEl.querySelectorAll('.item').forEach(function(el){
    const i=+el.dataset.i,ta=el.querySelector('textarea');
    if(ta.value!==base[DATA[i].cid])out.push({cid:DATA[i].cid,txt:ta.value});
  });
  return out;
}
function updateCount(){const n=changed().length;saveBtn.disabled=n===0;statusEl.textContent=n?(n+' ungespeicherte Änderung(en)'):'Alles gespeichert';}
function init(){
  render();updateCount();
  document.getElementById('afilter').addEventListener('input',function(e){
    const q=e.target.value.trim().toLowerCase();
    listEl.querySelectorAll('.item').forEach(function(el){el.classList.toggle('hidden',q&&el.textContent.toLowerCase().indexOf(q)<0);});
    listEl.querySelectorAll('.sport-h').forEach(function(h){let s=h.nextElementSibling,any=false;while(s&&s.classList.contains('item')){if(!s.classList.contains('hidden'))any=true;s=s.nextElementSibling;}h.classList.toggle('hidden',q&&!any);});
  });
  saveBtn.addEventListener('click',save);
  if(!SUPA_URL||!SUPA_KEY){
    document.getElementById('note').textContent='Hinweis: Cloud-Speicher (Supabase) ist noch nicht eingerichtet – Änderungen können bearbeitet und als Datei heruntergeladen, aber noch nicht direkt live gespeichert werden. Siehe SETUP-ADMIN.md.';
    saveBtn.textContent='Änderungen herunterladen';
  }else{
    fetch(SUPA_URL+'/rest/v1/ftem_overrides?select=cid,txt',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}})
      .then(function(r){return r.ok?r.json():[];}).then(function(rows){
        const m={};(rows||[]).forEach(function(x){m[x.cid]=x.txt;});
        listEl.querySelectorAll('.item').forEach(function(el){const i=+el.dataset.i,cid=DATA[i].cid;if(m[cid]!=null){el.querySelector('textarea').value=m[cid];base[cid]=m[cid];}});
        updateCount();
      }).catch(function(){});
  }
}
function save(){
  const ch=changed();if(!ch.length)return;
  if(!SUPA_URL||!SUPA_KEY){
    const blob=new Blob([JSON.stringify(ch,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ftem-aenderungen.json';a.click();return;
  }
  saveBtn.disabled=true;statusEl.textContent='Speichere …';
  fetch(SUPA_URL+'/rest/v1/ftem_overrides',{method:'POST',
    headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify(ch.map(function(x){return {cid:x.cid,txt:x.txt};}))})
   .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);
     ch.forEach(function(x){base[x.cid]=x.txt;});
     listEl.querySelectorAll('.item').forEach(function(el){el.classList.remove('changed');});
     statusEl.textContent='Gespeichert ✓ – Änderungen sind jetzt live.';saveBtn.disabled=true;
   }).catch(function(err){statusEl.textContent='Fehler beim Speichern: '+err.message;saveBtn.disabled=false;});
}
</script></body></html>
