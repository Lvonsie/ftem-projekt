<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>FTEM Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef1f4;color:#1d2630;font-size:14px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gatebox{background:#fff;border:1px solid #e4e8ec;border-radius:16px;padding:30px 28px;width:340px;max-width:100%;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.08)}
.gatebox h1{font-size:19px;margin:0 0 6px}
.gatebox p{color:#697080;font-size:13px;margin:0 0 18px}
.gatebox input{width:100%;padding:10px 12px;border:1px solid #cfd6dd;border-radius:9px;font-size:14px}
.gatebox button{margin-top:12px;width:100%;background:#d52b1e;color:#fff;border:none;border-radius:9px;padding:10px;font-weight:800;font-size:14px;cursor:pointer}
.gateerr{color:#d52b1e;font-size:12.5px;margin-top:10px;min-height:16px}
header.abar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid #e4e8ec;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header.abar h1{font-size:16px;margin:0;font-weight:800}
header.abar .sp{flex:1}
.afilter{padding:7px 11px;border:1px solid #cfd6dd;border-radius:8px;font-size:13px;min-width:170px}
.asave{background:#d52b1e;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:800;font-size:13px;cursor:pointer}
.asave:disabled{opacity:.5;cursor:default}
.astatus{font-size:12.5px;color:#697080}
.note{max-width:1000px;margin:14px auto 0;padding:0 18px;color:#8a6a00;font-size:12.5px}
.wrap{max-width:1000px;margin:0 auto;padding:16px 18px 70px}
.sport-h{font-size:15px;font-weight:800;margin:22px 0 8px;color:#d52b1e}
.item{background:#fff;border:1px solid #e4e8ec;border-left:4px solid #cfd6dd;border-radius:12px;padding:11px 13px;margin:0 0 10px}
.item.changed{border-left-color:#d52b1e}
.item .meta{font-size:11.5px;color:#697080;margin:0 0 6px;font-weight:700}
.item .meta b{color:#1d2630}
.item textarea{width:100%;min-height:68px;resize:vertical;border:1px solid #dfe4ea;border-radius:8px;padding:8px 9px;font:inherit;font-size:13px;line-height:1.5;color:#1d2630}
.item textarea:focus{outline:none;border-color:#d52b1e}
.hidden{display:none!important}
</style></head>
<body>
<div id="gate"><form id="gateform" class="gatebox">
  <h1>&#128274; FTEM Admin</h1>
  <p>Bitte Passwort eingeben, um Inhalte zu bearbeiten.</p>
  <input id="gatepw" type="password" placeholder="Passwort" autocomplete="current-password">
  <button type="submit">Anmelden</button>
  <div id="gateerr" class="gateerr"></div>
</form></div>
<div id="app" hidden>
  <header class="abar">
    <h1>FTEM &ndash; Inhalte bearbeiten</h1>
    <input id="afilter" class="afilter" type="search" placeholder="Suchen &hellip;">
    <span class="sp"></span>
    <span id="astatus" class="astatus"></span>
    <button id="asave" class="asave" disabled>Alle &Auml;nderungen speichern</button>
    <a href="index.html" style="text-decoration:none;font-size:13px;font-weight:700;color:#d52b1e">&#8617; Zur Seite</a>
  </header>
  <div id="note" class="note"></div>
  <div class="wrap"><div id="list"></div></div>
</div>

 "Methode Riesenslalom", "text": "Parallelschwung"}, {"cid": "ski-alpin|9|1|1", "sport": "Ski Alpin", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\nEinfache Stationen im vorgegeben Raum\n\nKurssetzung:\n-\n\nGelände:\nFlache bis mittelsteile und gleichmässige Piste mit schnellen Rotationsmöglichkeiten\n\nHilfsmittel:\nMinikipp/RS-Tore/Bäseli"}, {"cid": "ski-alpin|9|1|2", "sport": "Ski Alpin", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\n• Stationen mit klarem Ziel.\n• Einfacher Lauf mit gleichmässiger Kurssetzung.\n\nKurssetzung:\n• Zeitlicher Aspekt: von Tor zu Tor +/- 1.3 Sek.\n\nGelände:\nEher flache/mittelsteile und gleichmässige Piste mit schnellen Rotationsmöglichkeiten.\n\nHilfmittel:\nRS-Tore, Minikipp, Bäseli als Hilfsmarkierung."}, {"cid": "ski-alpin|9|1|3", "sport": "Ski Alpin", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\n• Stationen mit klarem Ziel.\n• Einfacher Lauf mit gleichmässigem Rhytmus.\n• Over Coaching vermeiden.\n\nKurssetzung:\n• Zeitlicher Aspekt: von Tor zu Tor +/- 1.3 Sek.\n• Verzögerte Schwünge (Bananen) einbauen.\n\nGelände:\nEher flache/mittelsteile und gleichmässige Piste mit schnellen Rotationsmöglichkeiten.\n\nHilfsmittel:\nRS-Tore, Bäseli, Minikipp, Zeitmessung und Video gezielt einsetzen."}, {"cid": "ski-alpin|9|1|4", "sport": "Ski Alpin", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\n• Stationen: falls möglich mindestens 20 Richtungsänderungen pro Station.\n• Blocktrainings mit klarem Ziel (schnell, langsam, drehend, direkt, eng, weit, ... ).\n• Over Coaching vermeiden.\n\nKurssetzung:\n• Zeitlicher Aspekt: von Tor zu Tor +/- 1.3 Sek.\n\nGelände:\nEher flache/mittelsteile und gleichmässige Piste mit schnellen Rotationsmöglichkeiten.\n\nHilfsmittel:\nRS-Tore, Bäseli, Farbe (wenn möglich), Zeitmessung und Video gezielt einsetzen."}, {"cid": "ski-alpin|9|1|5", "sport": "Ski Alpin", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\n• Blocktrainings mit klarem Ziel (schnell, langsam, drehend, direkt, eng, weit, ... ).\n• Situativ bestmögliche Trainingsbedingungen sind erstrebenswert (falls nicht möglich müssen die Verhältnisse oder die Sicht stimmen um Sicherheit zu gewährleisten).\n• Over Coaching vermeiden.\n\nKurssetzung:\n• Zeitlicher Aspekt: von Tor zu Tor +/- 1.3 Sek.\n\nGelände:\nUnterschiedliches Gelände mit schnellen Rotationsmöglichkeiten\n\nHilfsmittel:\nRS-Tore, Farbe, Zeitmessung und Video gezielt einsetzen."}, {"cid": "ski-alpin|9|1|6", "sport": "Ski Alpin", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\n• Blocktrainings mit klarem Ziel (schnell, langsam, drehend, direkt, eng, weit, ... ).\n• Situativ bestmögliche Trainingsbedingungen sind erstrebenswert (falls nicht möglich müssen die Verhältnisse oder die Sicht stimmen um Sicherheit zu gewährleisten).\n• Over Coaching vermeiden.\n• Spezifische Pistenpräparation (vermehrt auf gewässerten Pisten).\n\nKurssetzung:\n• Zeitlicher Aspekt von Tor zu Tor +/- 1.3 Sek.\n\nGelände:\nUnterschiedliches Gelände mit schnellen Rotationsmöglichkeiten.\n\nHilfsmittel:\nRS-Tore, Farbe, Zeitmessung und Video einsetzen."}, {"cid": "ski-alpin|9|1|7", "sport": "Ski Alpin", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\n• Blocktrainings mit klarem Ziel (schnell, langsam, drehend, direkt, eng, weit, ... ).\n• Repetition bis zur Automatisierung.\n• Situativ bestmögliche Trainingsbedingungen sind erstrebenswert (falls nicht möglich müssen die Verhältnisse oder die Sicht stimmen um Sicherheit zu gewährleisten).\n• Over Coaching vermeiden.\n• Spezifische Pistenpräparation.\n\nKurssetzung:\nZeitlicher Aspekt: von Tor zu Tor +/- 1.3 Sek.\n\nGelände:\n• Unterschiedliches Gelände: flach, steil, Übergänge, Wellen-Mulden.\n• Schnelle Rotationsmöglichkeiten.\n\nHilfsmittel:\nRS-Tore, Farbe, Zeitmessung und Video einsetzen, GPS."}, {"cid": "ski-alpin|9|1|8", "sport": "Ski Alpin", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\n• Blocktrainings mit klarem Ziel (schnell, langsam, drehend, direkt, eng, weit, ... ).\n• Repetition bis zur Automatisierung.\n• Over Coaching vermeiden.\n• Situativ bestmögliche Trainingsbedingungen sind erstrebenswert (falls nicht möglich müssen die Verhältnisse oder die Sicht stimmen um Sicherheit zu gewährleisten).\n• Dem Wettkampfprofil angepasste Pistenpräparation.\n\nKurssetzung:\n• Zeitlicher Aspekt: von Tor zu Tor +/- 1.3 Sek.\n• Dem Wettkampfprofil angepasste Kurssetzung.\n\nGelände:\n• Unterschiedliches Gelände: flach, steil, Übergänge, Wellen-Mulden.\n• Schnelle Rotationsmöglichkeiten\n• Dem Wettkampfprofil angepasstes Gelände.\n\nHilfsmittel:\nRS-Tore, Farbe, Zeitmessung und Video einsetzen, GPS."}, {"cid": "ski-alpin|9|1|9", "sport": "Ski Alpin", "theme": "Technik & Taktik Riesenslalom (RS)", "label": "Methode Riesenslalom", "text": "Trainingsmethoden:\n• Blocktrainings mit klarem Ziel (schnell, langsam, drehend, direkt, eng, weit, ... ).\n• Repetition bis zur Automatisierung.\nOver Coaching vermeiden.\n• Situativ bestmögliche Trainingsbedingungen sind erstrebenswert (falls nicht möglich müssen die Verhältnisse oder die Sicht stimmen um Sicherheit zu gewährleisten).\n• Dem Wettkampfprofil angepasste Pistenpräparation.\n\nKurssetzung:\n• Zeitlicher Aspekt: von Tor zu Tor +/- 1.3 Sek.\n• Dem Wettkampfprofil angepasste Kurssetzung.\n\nGelände:\n• Unterschiedliches Gelände: flach, steil, Übergänge, Wellen-Mulden.\n• Schnelle Rotationsmöglichkeiten\n• Dem Wettkampfprofil angepasstes Gelände\n\nHilfsmittel:\nRS-Tore, Farbe, Zeitmessung und Video einsetzen, GPS."}, {"cid": "ski-alpin|10|0|1", "sport": "Ski Alp G/DH)", "label": "Methode Speed", "text": "Sicherheit!\nFreude an Geschwindigkeit vermitteln. Viel in aerodynamischer Position fahren. Viel Springen."}, {"cid": "ski-alpin|10|1|3", "sport": "Ski Alpin", "theme": "Technik & Taktik Speed (SG/DH)", "label": "Methode Speed", "text": "Trainingsmethoden:\nSicherheit!\nElementschulen z.B Sprung, Wellen, Gleiten, Gleitkurven\nMotivierende Kommunikation fördern\n\nKurssetzung:\nSicher-, Gelände- und Materialangepasst\nNiveaugerecht, so einfach wie möglich\n\nGelände:\nAusreichend gesichertes einfaches Gelände\n\nHilfsmittel:\nRS-Tore, Farbe, B-Netze, Funk, Zeitmessung und Video einsetzen"}, {"cid": "ski-alpin|10|1|4", "sport": "Ski Alpin", "theme": "Technik & Taktik Speed (SG/DH)", "label": "Methode Speed", "text": "Trainingsmethoden:\nSicherheit!\nElementschulen z.B Sprung, Wellen, Gleiten, Gleitkurven\nMotivierende Kommunikation fördern\n\nKurssetzung:\nSicher-, Gelände- und Materialangepasst\nNiveaugerecht, so einfach wie möglich\n\nGelände:\nAusreichend gesichertes einfaches bis mittelsteiles Gelände mit genügend Gefälle für Landungen\n\nHilfsmittel:\nRS-Tore, Farbe, B-Netze, Funk, Zeitmessung und Video einsetzen, Vollkombi"}, {"cid": "ski-alpin|10|1|5", "sport": "Ski Alpin", "theme": "Technik & Taktik Speed (SG/DH)", "label": "Methode Speed", "text": "Trainingsmethoden:\nSicherheit!\nElementschulen z.B Sprung, Wellen, Gleiten, Gleitkurven\nGezieltes Coaching\nSituativ bestmögliche Trainingsbedingungen sind erstrebenswert (falls nicht möglich müssen die Verhältnisse oder die Sicht stimmen um Sicherheit zu gewährleisten).\n\nKurssetzung:\nSicher- und Geländeangepasst\nVariationen einbringen\nMehrfachtore (2er,-3er, 4-er Tore)\n\nGelände:\nAusreichend gesichertes einfaches bis mittelsteiles Gelände mit genügend Gefälle für Landungen\n\nHilfsmittel:\nRS-Tore, Farbe, B-Netze, Funk, Zeitmessung und Video einsetzen, Vollkombi"}, {"cid": "ski-alpin|10|1|6", "sport": "Ski Alpin", "theme": "Technik & Taktik Speed (SG/DH)", "label": "Methode Speed", "text": "Trainingsmethoden:\nSicherheit!\nGezieltes und Datenbasiertes Coaching\nSituativ bestmögliche Trainingsbedingungen sind erstrebenswert (falls nicht möglich müssen die Verhältnisse oder die Sicht stimmen um Sicherheit zu gewährleisten).\n\nKurssetzung:\nSicher- und Geländeangepasst\nVariationen einbringen\nMehrfachtore (2er,-3er, 4-er Tore)\n\nGelände:\nAusreichend gesichertes unterschiedliches Gelände mit genügend Gefälle für Landungen\n\nHilfsmittel:\nRS-Tore, Farbe, B-Netze, Funk, Zeitmessung und Video einsetzen, Start-Material, GPS, Vollkombi"}, {"cid": "ski-alpin|10|1|7", "sport": "Ski Alpin", "theme": "Technik & Taktik Speed (SG/DH)", "label": "Methode Speed", "text": "Trainingsmethoden:\nSicherheit!\nElementtraining (z.B. Sprungtraining im Park,  Negativkurven,  Steilwandkurve,  Gleiten,  Wellen/Mulden, ...).\nGezieltes und Datenbasiertes Coaching\nOffizielle Trainings vor den Rennen nützen\nSG im Training simulieren (erster Lauf zählt).\nSituativ bestmögliche Trainingsbedingungen sind erstrebenswert (falls nicht möglich müssen die Verhältnisse oder die Sicht stimmen um Sicherheit zu gewährleisten).\n\nKurssetzung:\nSicher- und Geländeangepasst\nVariationen einbringen\nMehrfachtore (2er,-3er, 4-er Tore)\n\nGelände:\nAusreichend gesichertes unterschiedliches Gelände mit genügend Gefälle für Landungen\n\nHilfsmittel:\nRS-Tore, Farbe, B-Netze, Funk, Zeitmessung und Video einsetzen, Start-Material, GPS, Volllkombi"}, {"cid": "ski-alpin|11|0|0", "sport": "Ski Alpin", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen erzählen von einem Moment, auf den sie stolz sind."}, {"cid": "ski-alpin|11|0|1", "sport": "Ski Alpin", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben ihre Emotionen in schwierigen Situationen (z.B. bei Fehler) anhand einer Ampel.\n\nRot: Ich bin wütend.\nGelb: Ich bin unsicher.\nGrün: Ich bin ruhig/fokussiert."}, {"cid": "ski-alpin|11|0|2", "sport": "Ski Alpin", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen machen eine Aufgabe (z.B. Technikübung) mit Ablenkungen (z.B. Lärm): Fähigkeit testen, Konzentration zu halten."}, {"cid": "ski-alpin|11|0|3", "sport": "Ski Alpin", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Athleten:innen formulieren ein kleines Ziel für das Training und erklären, warum es ihnen wichtig ist.\nSC 2: Simulierte Stresssituation (z.B Wettkampfsimulation). Kinder sollen bewusst Techniken (z.B. Atmung) einsetzen, um „grün“ zu erreichen."}, {"cid": "ski-alpin|11|0|4", "sport": "Ski Alpin", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben eine Bestleistung: „Wie hast du dich gefühlt?“: Merkmale des persönlichen optimalen Leistungszustand identifizieren und  anwenden."}, {"cid": "ski-alpin|11|0|5", "sport": "Ski Alpin", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Während z.B. Intervalltraining bewusst Atemtechniken nutzen, um Ruhe zu bewahren.\nSC 3: Vor einer Technikaufgabe den Ablauf mental durchspielen."}, {"cid": "ski-alpin|11|0|6", "sport": "Ski Alpin", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Bei einer schwierigen Aufgabe (z.B. Zeitdruck) positive Selbstgespräche anwenden.\nSC 3: Technikübung mit eingebauten Ablenkungen durchführen."}, {"cid": "ski-alpin|11|0|7", "sport": "Ski Alpin", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC1: Vor dem Wettkampf eine etablierte mentale Aktivierungsroutine anwenden.\nSC2: Bei Drucksituationen gezielte Atemtechniken oder Selbstgespräche einsetzen.\nSC3: Nach einem Rückschlag den Fokus bewusst auf die nächste Aufgabe lenken.\nSC4: Eine bevorstehende Wettkampfsituation gezielt visualisieren."}, {"cid": "ski-alpin|11|1|0", "sport": "Ski Alpin", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative ermöglichen"}, {"cid": "ski-alpin|11|1|1", "sport": "Ski Alpin", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative fördern"}, {"cid": "ski-alpin|11|1|2", "sport": "Ski Alpin", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "ski-alpin|11|1|3", "sport": "Ski Alpin", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "ski-alpin|11|1|4", "sport": "Ski Alpin", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "ski-alpin|12|0|0", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Kinder schätzen, wie viel sie pro Training trinken sollten und überprüfen es (z.B. durch Markierungen an der Trinkflasche).\nSC 2: Kinder prüfen selbstständig, ob alle wichtigen Items dabei sind (Taschencheck)."}, {"cid": "ski-alpin|12|0|1", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Einen Tag bezüglich Ernährung dokumentieren und diskutieren: Essen, Trinken und Snacks."}, {"cid": "ski-alpin|12|0|2", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Selbständig eine Mahlzeit/Snack für vor, während und nach dem Training/Wettkampf zusammenstellen und diskutieren."}, {"cid": "ski-alpin|12|0|3", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Mit verschiedenen Snacks, Trinkstrategien oder Mahlzeiten vor/während/nach dem Training/Wettkampf experimentieren und individuell anpassen."}, {"cid": "ski-alpin|12|0|4", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC 1: Ernährung und Hydration unter Wettkampfbedingungen testen (z.B. Gels, isotonische Getränke während Belastung).\nSC 2: Flüssigkeitsverlust, Energiebedarf und Regeneration dokumentieren und auswerten."}, {"cid": "ski-alpin|12|0|5", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Skills-Checks (SC) Ernährung", "text": "SC: Etablierte Ernährungs- und Hydrationsstrategie für Training und Wettkampf."}, {"cid": "ski-alpin|12|1|0", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "ski-alpin|12|1|1", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "ski-alpin|12|1|2", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nBewusstheit und Anpassung stärken Verständnis für Makronährstoffe (Kohlenhydrate, Eiweiss, Fett) und Flüssigkeitsbedarf vertiefen.\n\nVor dem Training\n1–2h vorher ca. 500 ml Wasser trinken. Bei Hitze oder viel Salzverlust leicht salzige Getränke verwenden (1x Prise Salz).\n\nWährend des Trainings\nAlle 15–20' 150–200 ml trinken, >1h Belastung zusätzliche Kohlenhydrate beigeben (z.B. verdünnte Fruchtsäfte, kohlenhydratreiche Getränke).\n\nNach dem Training\n0.5-1 l Flüssigkeit innerhalb von 30'. Bei intensiven Belastungen Proteinshake, Recovery-Drink, Elektrolytgetränke oder leicht salziges Wasser verwenden."}, {"cid": "ski-alpin|12|1|3", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "ski-alpin|12|2|0", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "ski-alpin|12|2|1", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "ski-alpin|12|2|2", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Essen", "text": "Vor dem Training\n2–3h vorher: Kohlenhydratreiche, leicht verdauliche Mahlzeit (z.B. Vollkornbrot mit Honig). 30' vorher: Kleiner Snack (z.B. Banane)\n\nWährend des Trainings (>1h Belastung)\n30–60 g Kohlenhydrate pro h (z.B. Energieriegel, Trockenfrüchte)\n\nNach dem Training\nInnerhalb von 30': Snack mit Kohlenhydraten und Eiweiss (z. B. Joghurt mit Obst, Milchshake).\n\nHauptmahlzeit: Ausgewogen mit Kohlenhydraten (z.B. Reis, Nudeln), Eiweiss (z. B. Huhn, Linsen) und Gemüse."}, {"cid": "ski-alpin|12|2|3", "sport": "Ski Alpin", "theme": "Ernährung", "label": "Essen", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "ski-alpin|13|0|0", "sport": "Ski Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Fragen an die Kinder: Wie viele Stunden Schlaf brauchen wir? Was hilft uns besser zu schlafen?"}, {"cid": "ski-alpin|13|0|1", "sport": "Ski Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Eine Woche lang Schlafdauer und wie sie sich am nächsten Tag fühlen dokumentieren."}, {"cid": "ski-alpin|13|0|2", "sport": "Ski Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Vor dem Schlafen Atemtechniken oder progressive Muskelrelaxation (PMR) ausprobieren."}, {"cid": "ski-alpin|13|0|3", "sport": "Ski Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Schlafdauer und Qualität eine Woche lang dokumentieren, zusammen mit der Trainingsleistung.\nSC 2: Abendroutinen reflektieren und Anpassungen vornehmen."}, {"cid": "ski-alpin|13|0|4", "sport": "Ski Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC 1: Plan für Schlaf- und Essenszeiten vor einem Wettkampf erstellen und umsetzen.\nSC 2: Gedanken vor dem Schlaf „parken“, z.B. durch Aufschreiben oder Atemübungen (Grübelstopp)"}, {"cid": "ski-alpin|13|0|5", "sport": "Ski Alpin", "theme": "Schlaf", "label": "Skills-Checks (SC) Schlaf", "text": "SC: Etablierte Schlafroutine für Training und Wettkampf."}, {"cid": "ski-alpin|13|1|0", "sport": "Ski Alpin", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer: 8–10h/Nacht\nSchlaf fördert Konzentration, Energie und Regeneration."}, {"cid": "ski-alpin|13|1|1", "sport": "Ski Alpin", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Schlafdauer\n8–10h/Nacht\n\nRoutine\nGleiche Schlafenszeiten, auch am Wochenende.\n\nEntspannung\n1h vor dem Schlafen Bildschirme meiden, Rituale wie Lesen oder Atemübungen einführen.\n\nSchlafumgebung\nDunkel, kühl, ruhig (16–18°C)."}, {"cid": "ski-alpin|13|1|2", "sport": "Ski Alpin", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Regelmässige Schlafzeiten\nEntspannungsrituale einbauen\n\nGrübelstopp\nBei längerer Wachzeit aufstehen. Gedanken aufschreiben, um den Kopf zu entlasten. Negative Gedanken über Schlaf in positive Überzeugungen umwandeln.\n\nOptimierter Einsatz von Koffein und Hilfsmitteln\nWirkung beachten (HWZ 6h, verstärkte Wirkung bei Jugendlichen), mind. 6h vor dem Schlaf meiden. Augenmasken, Gehörschutz etc. verwenden.\n\nPowernaps einplanen\nKurze Nickerchen von 10–15' zur Regeneration, ideal nach dem Mittagessen.\n\nAnpassungen bei Reisen und Wettkämpfen\nSchlaf- und Essenszeiten an Zeitverschiebungen anpassen. Strategien gegen Jetlag nutzen."}, {"cid": "ski-alpin|13|1|3", "sport": "Ski Alpin", "theme": "Schlaf", "label": "Inhalt Schlaf", "text": "Eine gezielte und individuelle Schlafoptimierung sichert langfristige die Leistungsfähigkeit.\n\nRegelmässige Schlafroutinen und die Anpassung an Reisen oder Wettkämpfe sind entscheidend.\n\nSchlafprobleme sollten überwacht und bei Bedarf behandelt werden. Powernaps und Entspannungstechniken wie Grübelstopp fördern Erholung und mentale Ruhe."}, {"cid": "ski-alpin|14|0|0", "sport": "Ski Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Skiclub"}, {"cid": "ski-alpin|14|0|1", "sport": "Ski Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Skiclub, RLZ"}, {"cid": "ski-alpin|14|0|2", "sport": "Ski Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "RLZ, Skiclub"}, {"cid": "ski-alpin|14|0|3", "sport": "Ski Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "RV, NLZ, Swiss-Ski Kader"}, {"cid": "ski-alpin|14|0|4", "sport": "Ski Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "NLZ, Swiss-Ski Kader, RV"}, {"cid": "ski-alpin|14|0|5", "sport": "Ski Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss Ski Kader"}, {"cid": "ski-alpin|14|0|6", "sport": "Ski Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss Ski  A Kader"}, {"cid": "ski-alpin|14|0|7", "sport": "Ski Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Kader", "text": "Swiss Ski Kader NM"}, {"cid": "ski-alpin|14|1|1", "sport": "Ski Alpin", "theme": "Förderstrukturen & Wettkämpfe", "label": "Swiss Olympic Card", "text": "Lokal/Regional"}, {"cid": "ski-alpin|14|1|2", "sport": "Ski Alpin", "theme": "Förderstrukture hase 1\nMitte Mai bis August", "text": "Ziele:\nTrainingsgrundlagen breit aufbauen, Volumen und Häufigkeit steigern sowie sportartübergreifende Vielseitigkeit fördern.\n\nInhalt:\nAthletiktraining mit Fokus auf Langhanteltechnik, Rumpfstabilität und erste Sprungformen (~6.2 h/Woche), kombiniert mit Velo, Laufen, Schwimmen und ergänzenden Sportarten wie Leichtathletik oder Turnen."}, {"cid": "langlauf|2|1|3", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nTrainingsgrundlagen breit aufbauen sowie Volumen und Häufigkeit auf ein deutlich höheres Niveau steigern.\n\nInhalt:\nPolysportives Athletiktraining mit Langhanteltechnik, Rumpfstabilität und Sprungschule (~7.7 h/Woche), kombiniert mit Velo, Laufen, Schwimmen und ergänzenden Sportarten wie Bike, Leichtathletik oder Turnen."}, {"cid": "langlauf|2|1|4", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nKonditionelle Grundlagen breit und nachhaltig aufbauen sowie Volumen und Häufigkeit auf hohem Niveau steigern.\n\nInhalt:\nPolysportives Athletiktraining (~9.1 h/Woche) mit Fokus auf funktioneller Effizienz, Langhanteltechnik, Plyometrie und Rumpfkraft, kombiniert mit Grundlagenausdauer auf Velo, im Laufen und auf Rollski bei tiefer bis mittlerer Intensität."}, {"cid": "langlauf|2|1|5", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nKonditionelle Grundlagen breit und nachhaltig aufbauen sowie Volumen und Häufigkeit auf hohem Niveau steigern.\n\nInhalt:\nUmfangreiches Athletiktraining (~9.8 h/Woche) mit Fokus auf funktioneller Effizienz, Langhanteltechnik, Plyometrie und Rumpfkraft, kombiniert mit Grundlagenausdauer auf Velo, im Laufen und auf Rollski bei tiefer bis mittlerer Intensität."}, {"cid": "langlauf|2|1|6", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nKonditionelle Grundlagen breit und nachhaltig auf hohem Umfangsniveau (18–22 h/Woche) aufbauen.\n\nInhalt:\nAusdauertraining zu Fuss und auf Rollski, ergänzt mit Velo, Rudern und Schwimmen, kombiniert mit zwei intensiven Einheiten pro Woche (I4/I5) sowie Athletiktraining (~11.7 h/Woche) mit Fokus auf Langhanteltechnik, Plyometrie und Rumpfkraft."}, {"cid": "langlauf|2|1|7", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nKonditionelle Grundlagen breit und nachhaltig auf höchstem Umfangsniveau (18–22 h/Woche) aufbauen.\n\nInhalt:\nAusdauertraining zu Fuss und auf Rollski, ergänzt mit Velo, Rudern und Schwimmen, kombiniert mit zwei intensiven Einheiten pro Woche (I4/I5) sowie Athletiktraining (~13.4 h/Woche) mit Fokus auf Langhanteltechnik, Plyometrie und Rumpfkraft."}, {"cid": "langlauf|2|1|8", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 1\nMitte Mai bis August", "text": "Ziele:\nKonditionelle Grundlagen auf Weltklasseniveau ausbauen und individuelle Bedürfnisse gezielt entwickeln.\n\nInhalt:\nHochvolumiges Ausdauertraining zu Fuss und auf Rollski mit spezifischen Trainingsgeräten, ergänzt durch Velo, Rudern und Schwimmen sowie Athletiktraining (~14.2 h/Woche) mit Fokus auf Langhanteltechnik, Plyometrie und Rumpfkraft."}, {"cid": "langlauf|2|2|0", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Bewegungs- und Spielgrundformen entwickeln\nUmfangreich, vielseitig und herausfordernd"}, {"cid": "langlauf|2|2|1", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nSportartspezifische Bewegungsqualität auf Rollski festigen und die Schnelligkeits-/Agilitätsfenster gezielt nutzen.\n\nInhalt:\nErhöhter Anteil Rollski (klassisch und skating) mit Fokus auf Beinabstoss, Doppelstock und 1:2-Technik, ergänzt durch Sprint-, Koordinations |6", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nVO₂max und Grundlagenausdauer gezielt entwickeln sowie Muskelhypertrophie und Maximalkraft weiter ausbauen.\n\nInhalt:\nAusdauer- und Intervalltraining auf der Rollskibahn, ergänzt durch Sommerwettkämpfe (1–2 Rollski-Rennen, Trainingsrennen Langlauf) sowie intramuskuläres Koordinationstraining und Explosivkrafttraining mit Zusatzgewichten."}, {"cid": "langlauf|2|2|7", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nVO₂max und Grundlagenausdauer gezielt entwickeln sowie Muskelhypertrophie und Maximalkraft weiter ausbauen.\n\nInhalt:\nAusdauer- und Intervalltraining auf der Rollskibahn, ergänzt durch 2–4 nationale/internationale Rollski-Rennen und Trainingsrennen Langlauf sowie intramuskuläres Koordinationstraining und Explosivkrafttraining mit Zusatzgewichten."}, {"cid": "langlauf|2|2|8", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorbereitungsphase 2\nSeptember bis Oktober", "text": "Ziele:\nVO₂max, Laktattoleranz und Schwellen-Geschwindigkeit auf Weltklasseniveau entwickeln und Muskelhypertrophie sowie Maximalkraft weiter ausbauen.\n\nInhalt:\nAusdauer- und Intervalltraining auf der Rollskibahn, ergänzt durch 2–4 nationale/internationale Rollski-Rennen und Trainingsrennen Langlauf sowie intramuskuläres Koordinationstraining und Explosivkrafttraining mit Zusatzgewichten."}, {"cid": "langlauf|2|3|0", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Bewegungs- und Spielgrundformen entwickeln\nUmfangreich, vielseitig und herausfordernd"}, {"cid": "langlauf|2|3|1", "sport": "Langlauf", "theme": "Makroplanung", "label": "Vorwettkampfphase  November", "text": "Ziele:\nÜbergang vom Rollski auf Schneeschnee schaffen und spielerisches, sicheres Bewegen auf den Langlaufski (Klassisch und Skating) etablieren.\n\nInhalt:\nErste -, Explosiv- und Maximalkrafttraining (~3.8 h/Woche) bei gleichbleibender Intensität und an die Wettkämpfe angepasstem Volumen."}, {"cid": "langlauf|2|4|7", "sport": "Langlauf", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Ziele:\nWettkampfleistung im internationalen Spitzenkalender  abrufen und Form über gezieltes Tapering steuern.\n\nInhalt:\nWettkampforientiertes Skitraining mit individueller Belastungssteuerung, kombiniert mit erhaltendem Athletik-, Explosiv- und Maximalkrafttraining (~4.3 h/Woche) bei gleichbleibender Intensität und an die Wettkämpfe angepasstem Volumen."}, {"cid": "langlauf|2|4|8", "sport": "Langlauf", "theme": "Makroplanung", "label": "Wettkampfphase Dezember bis März", "text": "Ziele:\nWettkampfleistung im internationalen Spitzenkalender konstant abrufen und Form über gezieltes Tapering steuern.\n\nInhalt:\nWettkampforientiertes Skitraining mit hochgradig individualisierter Belastungssteuerung, kombiniert mit erhaltendem Athletik-, Explosiv- und Maximalkrafttraining (~4.6 h/Woche) bei gleichbleibender Intensität und an die Wettkämpfe angepasstem Volumen."}, {"cid": "langlauf|3|0|0", "sport": "Langlauf", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "Off Snow Skills F1-2\n\nTurnen\nLeichtathletik\nGeländetraining\nRollen und Gleiten\nRadsport"}, {"cid": "langlauf|3|0|1", "sport": "Langlauf", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC 1: 90' leichte bis moderate sportliche Bewegung am Stück\n\nSC 2: 30' intermittierende Bewegung am Stück (intensiv)"}, {"cid": "langlauf|3|0|2", "sport": "Langlauf", "theme": "Ausdauer", "label": "Skills-Checks (SC) & Leistungstests (LT) Ausdauer", "text": "SC 1\n150' am Stück auf Ski, Rollski und zu Fuss (moderat)\n\nSC 2\n20' am Stück auf Ski, RS und zu Fuss (intensiv)\n\nSC 3\n1000m-Lauf\n\nLT\nPISTE"}, {"cid": "langlauf|3|0|3", "sport": "Langlauf", "theme": "Ausdauer", "label": "S k gezielt trainieren\n• Schnelligkeit: Sprints, Sprünge, Spiele\n• Laufen: Berglauf und Cross\n• Velo 60–120'\n\nVorwettkampfphase\n• Trainingsformen aus VP2 laufen weiter\n• Technik im Fokus\n• Rollski, auch Technikparcours\n• Laufen mit Stöcken\n• Spiele und Staffeln\n• Koupiertes Gelände\n\nWettkampfphase:\n• Grundlagen- und Techniktraining auf\n• Schnee trotz Leistungseinbussen\n• Schneezeit (ca. 6 Monate) intensiv nutzen\n• Form über Wettkämpfe steuern\n• Viel Zeit auf Schnee und Ski\n• Spiele und Koordination\n• Abfahrten trainieren"}, {"cid": "langlauf|3|1|4", "sport": "Langlauf", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Vorbereitungsphase 1\n• Grundlagen aufbauen\n• Volumen und Häufigkeit steigern\n• Intensität tief bis mittel, kaum harte Einheiten\n\nVorbereitungsphase 2\n• Schwellentraining ergänzend zu Grundlagen\n• I2 gezielt, z.B. im Technikbereich\n• Kapazitätstraining nach Schwellenblock integrieren\n• Je nach Athletenprofil zwischen Kapazitäts- und Schwellentraining abwägen\n• Zweite Hälfte oft: ein Schwellen- und ein Kapazitätstraining pro Woche\n\nVorwettkampfphase\n• Meist alle Trainingsformen weiterhin enthalten\n• Formsteuerung über kurze Intervalle\n\nWettkampfphase:\n• Grundlagen und Technik auf Schnee trotz Leistungseinbussen\n• Schneezeit (ca. 6 Monate) nutzen\n• Formsteuerung mit kurzen und kombinierten Intervallen bei starker Wettkampfdichte"}, {"cid": "langlauf|3|1|5", "sport": "Langlauf", "theme": "Ausdauer", "label": "Inhalt Ausdauer", "text": "Vorbereitungsphase 1\n• Umfang 18–22h pro Woche\n• Ausdauertraining zu Fuss und auf Rollski, ergänzt mit Velo, Rudern, Schwimmen\n• 2 intensive Einheiten pro Woche (I4 und I5) zu Fuss oder Rollski\n\nVorbereitungsphase 2\n• VO₂max und Grundlagenausdauer entwickeln\n• Sommerwettkämpfe\n• Ausdauer- und Intervalltraining auf der Rollskibahn\n\nVorwettkampfphase\n• Rennintensität und VO₂max\n• Training auf Schnee und Ski\n\nWettkampfphase:\n• Wettkampfleistung erbringen\n• Tapering"} igkeit erreichen\n• Maximal schnell sein: hohe Schrittfrequenz & Schrittlänge\n• Schneller & geschickter die Richtungswechsel ohne Tempoverlust (stop & go)\n• Erholt & mit maximaler Intensität trainieren\n\nAgilität\n• Koordinationsleiter\n• Hindernisparcours\n• Gleichgewichtstraining (dynamisch & statisch)"}, {"cid": "langlauf|7|0|1", "sport": "Langlauf", "theme": "Technik & Taktik Übergeordnet", "label": "Skills-Checks (SC) & Leistungstests (LT) Technik", "text": "Individuelle Übungsstruktur nach Stärken/Schwächen-Analyse"}, {"cid": "langlauf|8|0|0", "sport": "Langlauf", "theme": "Technik", "label": "Technik Klassisch", "text": "Element Schnee entdecken\n• Gleiten\n• Schieben\n• Rutschen\n• Drehen\n• Springen\n• Balancieren\n• Bremsen auf Rutschgeräten (Langlaufski, Snowboard oder Ski)"}, {"cid": "langlauf|8|0|1", "sport": "Langlauf", "theme": "Technik", "label": "Technik Klassisch", "text": "Spielerisch den Schnee entdecken und sich variantenreich auf LL-Ski bewegen.\nSpielformen und abwechslungsreiche Übungen, die vielseitige Bewegungsarten fördern. Elefantenwaschen, Skills Park, Namen-Memory, Der Fuchs geht um, Spitalfangis etc.\n\nSicher und selbständig langlaufen und bremsen\n\nKL-Schritt (Beinarbeit)\nStreckung des Abstossbeines, stabiles Gleiten auf Gleitski\n\nDiagonal\nWechsel von Bein- und Armarbeit in diagonaler Bewegung für Vortrieb.\n\nGräten\nScherenschritte bergauf: Ski in V-Form setzen, Kick aus den Beinen (kein Gleiten)\n\nDoppelstock\nBeide Stöcke gleichzeitig einsetzen, Körper nach vorne bringen und Arme aktiv strecken.\n\nBogentreten\nSeitliches Treten in einer Bogenspurlinie, Gewicht auf den Aussenski\n\nSpurwechsel\nSki parallel anheben, Gewicht verlagern und sanft in die neue Spur setzen.\n\nÜbungen\nÜber Wurzeln steigen, Himbeeren pflücken, La-Ola-Welle, Schaukelschuhe etc."}, {"cid": "langlauf|8|1|0", "sport": "Langlauf", "theme": "Technik", "label": "Technik Skating", "text": "Element Schnee entdecken\n• Gleiten\n• Schieben\n• Rutschen\n• Drehen\n• Springen\n• Balancieren\n• Bremsen auf Rutschgeräten (Langlaufski, Snowboard oder Ski)"}, {"cid": "langlauf|8|1|1", "sport": "Langlauf", "theme": "Technik", "label": "Technik Skating", "text": "Spielerisch den Schnee entdecken und sich variantenreich auf LL-Ski bewegen.\nSpielformen und abwechslungsreiche Übungen, die vielseitige Bewegungsarten fördern. Elefantenwaschen, Skills Park, Namen-Memory, Der Fuchs geht um, Spitalfangis etc.\n\nSicher und selbständig langlaufen und bremsen\n\nSchlittschuschritt (Beinarbeit) Streckung des Abstossbeines (seitlich), stabiles Gleiten auf Gleitski\n\n1:2\nSchlittschuhschritt mit Doppelstockstoss auf jeden zweiten Beinabstoss.\n\n1:1\nSchlittschuhschritt mit Doppelstockstoss auf jeden Beinabstoss.\n\nAsymm. SS\nAsymmetrische Armarbeit (Führungsarm)  und gleichzeitiges aufsetzen von Stock und Ski (sonst gleich wie 1:2)\n\nDiagonal SS\nBeinschritt (seitlich) mit diagonalem Stockeinsatz.\n\nSchlittschuschritt ohne Stockeinsatz\nTiefer Schwerpunkt mit dynamischer Gewichtsverlagerung für längeres Gleiten.\n\nÜbungen\nKnöchel berühren, Zäunen, Glöckner, Hip-Hopper etc."}, {"cid": "langlauf|9|0|0", "sport": "Langlauf", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen erzählen von einem Moment, auf den sie stolz sind."}, {"cid": "langlauf|9|0|1", "sport": "Langlauf", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben ihre Emotionen in schwierigen Situationen (z.B. bei Fehler) anhand einer Ampel.\n\nRot: Ich bin wütend.\nGelb: Ich bin unsicher.\nGrün: Ich bin ruhig/fokussiert."}, {"cid": "langlauf|9|0|2", "sport": "Langlauf", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen machen eine Aufgabe (z.B. Technikübung) mit Ablenkungen (z.B. Lärm): Fähigkeit testen, Konzentration zu halten."}, {"cid": "langlauf|9|0|3", "sport": "Langlauf", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Athleten:innen formulieren ein kleines Ziel für das Training und erklären, warum es ihnen wichtig ist.\nSC 2: Simulierte Stresssituation (z.B Wettkampfsimulation). Kinder sollen bewusst Techniken (z.B. Atmung) einsetzen, um „grün“ zu erreichen."}, {"cid": "langlauf|9|0|4", "sport": "Langlauf", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC: Athleten:innen beschreiben eine Bestleistung: „Wie hast du dich gefühlt?“: Merkmale des persönlichen optimalen Leistungszustand identifizieren und  anwenden."}, {"cid": "langlauf|9|0|5", "sport": "Langlauf", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Während Training und Wettkampf bewusst Atemtechniken nutzen, um Ruhe zu bewahren.\nSC 3: Vor einer Technikaufgabe den Ablauf mental durchspielen."}, {"cid": "langlauf|9|0|6", "sport": "Langlauf", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC 1: Für jede Kategorie Prozessziele und Rangziele (später bewerten und anpassen).\nSC 2: Bei einer schwierigen Aufgabe (z.B. Zeitdruck) positive Selbstgespräche anwenden.\nSC 3: Technikübung mit eingebauten Ablenkungen durchführen."}, {"cid": "langlauf|9|0|7", "sport": "Langlauf", "theme": "Psyche", "label": "Skills-Checks (SC) Psyche", "text": "SC1: Vor dem Wettkampf eine etablierte mentale Aktivierungsroutine anwenden.\nSC2: Bei Drucksituationen gezielte Atemtechniken oder Selbstgespräche einsetzen.\nSC3: Nach einem Rückschlag den Fokus bewusst auf die nächste Aufgabe lenken.\nSC4: Eine bevorstehende Wettkampfsituation gezielt visualisieren."}, {"cid": "langlauf|9|1|0", "sport": "Langlauf", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative ermöglichen"}, {"cid": "langlauf|9|1|1", "sport": "Langlauf", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Freude am Tun\n• Selbstwahrnehmung fördern\n• Aktivierungsregulation aufbauen\n• Spielerische Bewegungssteuerung ermöglichen\n• Positives Lernumfeld schaffen\n• Analytische Fähigkeiten aufbauen\n• Eigeninitiative fördern"}, {"cid": "langlauf|9|1|2", "sport": "Langlauf", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "langlauf|9|1|3", "sport": "Langlauf", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "langlauf|9|1|4", "sport": "Langlauf", "theme": "Psyche", "label": "Inhalt Psyche", "text": "Psyche / Persönlichkeit\n• Zielsetzung ausbauen\n• Umgang mit Emotionen und Gedanken ausbauen\n• Optimaler Leistungszustand\n• Bewegungsvorstellung aufbauen\n• Fokus aufbauen\n• Positives Lernumfeld schaffen und Teamfähigkeit fördern\n• Analytische Fähigkeiten festigen\n• Eigeninitiative fördern\n• Karriereplanung"}, {"cid": "langlauf|10|0|0", "sport": "Langlauf", "theme": "Ernährung", "label": "Skills-Check (SC)", "text": "SC 1: Kinder schätzen, wie viel sie pro Training trinken sollten und überprüfen es (z.B. durch Markierungen an der Trinkflasche).\n\nSC 2: Kinder prüfen selbstständig, ob alle wichtigen Items dabei sind (Taschencheck)."}, {"cid": "langlauf|10|0|1", "sport": "Langlauf", "theme": "Ernährung", "label": "Skills-Check (SC)", "text": "SC: Einen Tag bezüglich Ernährung dokumentieren und diskutieren: Essen, Trinken und Snacks."}, {"cid": "langlauf|10|0|2", "sport": "Langlauf", "theme": "Ernährung", "label": "Skills-Check (SC)", "text": "SC: Selbständig eine Mahlzeit/Snack für vor, während und nach dem Training/Wettkampf zusammenstellen und diskutieren."}, {"cid": "langlauf|10|0|3", "sport": "Langlauf", "theme": "Ernährung", "label": "Skills-Check (SC)", "text": "SC: Mit verschiedenen Snacks, Trinkstrategien oder Mahlzeiten vor/während/nach dem Training/Wettkampf experimentieren und individuell anpassen."}, {"cid": "langlauf|10|0|4", "sport": "Langlauf", "theme": "Ernährung", "label": "Skills-Check (SC)", "text": "SC 1: Ernährung und Hydration unter Wettkampfbedingungen testen (z.B. Gels, isotonische Getränke während Belastung).\n\nSC 2: Flüssigkeitsverlust, Energiebedarf und Regeneration dokumentieren und auswerten."}, {"cid": "langlauf|10|0|5", "sport": "Langlauf", "theme": "Ernährung", "label": "Skills-Check (SC)", "text": "SC: Etablierte Ernährungs- und Hydrationsstrategie für Training und Wettkampf."}, {"cid": "langlauf|10|1|0", "sport": "Langlauf", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "langlauf|10|1|1", "sport": "Langlauf", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "langlauf|10|1|2", "sport": "Langlauf", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Ziel\nBewusstheit und Anpassung stärken Verständnis für Makronährstoffe (Kohlenhydrate, Eiweiss, Fett) und Flüssigkeitsbedarf vertiefen.\n\nVor dem Training\n1–2h vorher ca. 500 ml Wasser trinken. Bei Hitze oder viel Salzverlust leicht salzige Getränke verwenden (1x Prise Salz).\n\nWährend des Trainings\nAlle 15–20' 150–200 ml trinken, >1h Belastung zusätzliche Kohlenhydrate beigeben (z.B. verdünnte Fruchtsäfte, kohlenhydratreiche Getränke).\n\nNach dem Training\n0.5-1 l Flüssigkeit innerhalb von 30'. Bei intensiven Belastungen Proteinshake, Recovery-Drink, Elektrolytgetränke oder leicht salziges Wasser verwenden."}, {"cid": "langlauf|10|1|3", "sport": "Langlauf", "theme": "Ernährung", "label": "Flüssigkeit", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "langlauf|10|2|0", "sport": "Langlauf", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nFörderung gesunder Gewohnheiten im Alltag. Eltern einbinden mit Tipps oder Workshops.\n\nSportaschen-Checkliste implementieren\nWasserflasche, Snackbox und Wechselkleidung.\n\nBewusste Snack- und Trinkpausen im Training einbauen\nErklärungen geben (pro h Training = 500 ml Wasser oder verdünnter Saft)\n\nKochen im Team\nGemeinsame Snack-Zubereitung oder Kochkurse."}, {"cid": "langlauf|10|2|1", "sport": "Langlauf", "theme": "Ernährung", "label": "Essen", "text": "Ziel\nGrundverständnis für ausgewogene Ernährung. Förderung gesunder Gewohnheiten im Alltag. Verbindung zwischen Ernährung, Energie für Sport und Schule.\n\nAusgewogene Ernährung\n½ Gemüse/Obst, ¼ Kohlenhydrate, ¼ Eiweiss bei jeder Mahlzeit.\n\nTrinken\nWasser als Hauptgetränk, ca. 1,5–2 l täglich, mehr bei Training.\n\nRegelmässige Mahlzeiten\nFrühstück, Mittagessen, Abendessen und 2 gesunde Snacks (z.B. Obst, Nüsse).\n\nVorbereitung\nSnacks und Wasserflasche zum Training mitbringen."}, {"cid": "langlauf|10|2|2", "sport": "Langlauf", "theme": "Ernährung", "label": "Essen", "text": "Vor dem Training\n2–3h vorher: Kohlenhydratreiche, leicht verdauliche Mahlzeit (z.B. Vollkornbrot mit Honig). 30' vorher: Kleiner Snack (z.B. Banane)\n\nWährend des Trainings (>1h Belastung)\n30–60 g Kohlenhydrate pro h (z.B. Energieriegel, Trockenfrüchte)\n\nNach dem Training\nInnerhalb von 30': Snack mit Kohlenhydraten und Eiweiss (z. B. Joghurt mit Obst, Milchshake).\n\nHauptmahlzeit: Ausgewogen mit Kohlenhydraten (z.B. Reis, Nudeln), Eiweiss (z. B. Huhn, Linsen) und Gemüse."}, {"cid": "langlauf|10|2|3", "sport": "Langlauf", "theme": "Ernährung", "label": "Essen", "text": "Optimierung und Individualisierung\nFortgeschrittenes Wissen über Mikronährstoffe (Vitamine, Mineralstoffe) und deren Rolle für die Leistung."}, {"cid": "langlauf|11|0|0", "sport": "Langlauf", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC: Fragen an die Kinder: Wie viele Stunden Schlaf brauchen wir? Was hilft uns besser zu schlafen?"}, {"cid": "langlauf|11|0|1", "sport": "Langlauf", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC: Eine Woche lang Schlafdauer und wie sie sich am nächsten Tag fühlen dokumentieren."}, {"cid": "langlauf|11|0|2", "sport": "Langlauf", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC: Vor dem Schlafen Atemtechniken oder progressive Muskelrelaxation (PMR) ausprobieren."}, {"cid": "langlauf|11|0|3", "sport": "Langlauf", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC 1: Schlafdauer und Qualität eine Woche lang dokumentieren, zusammen mit der Trainingsleistung.\n\nSC 2: Abendroutinen reflektieren und Anpassungen vornehmen."}, {"cid": "langlauf|11|0|4", "sport": "Langlauf", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC 1: Plan für Schlaf- und Essenszeiten vor einem Wettkampf erstellen und umsetzen.\n\nSC 2: Gedanken vor dem Schlaf „parken“, z.B. durch Aufschreiben oder Atemübungen (Grübelstopp)"}, {"cid": "langlauf|11|0|5", "sport": "Langlauf", "theme": "Schlaf", "label": "Skills-Check (SC)", "text": "SC: Etablierte Schlafroutine für Training und Wettkampf."}, {"cid": "langlauf|11|1|0", "sport": "Langlauf", "theme": "Schlaf", "label": "Inhalt", "text": "Schlafdauer: 8–10h/Nacht\nSchlaf fördert Konzentration, Energie und Regeneration."}, {"cid": "langlauf|11|1|1", "sport": "Langlauf", "theme": "Schlaf", "label": "Inhalt", "text": "Schlafdauer\n8–10h/Nacht\n\nRoutine\nGleiche Schlafenszeiten, auch am Wochenende.\n\nEntspannung\n1h vor dem Schlafen Bildschirme meiden, Rituale wie Lesen oder Atemübungen einführen.\n\nSchlafumgebung\nDunkel, kühl, ruhig (16–18°C)."}, {"cid": "langlauf|11|1|2", "sport": "Langlauf", "theme": "Schlaf", "label": "Inhalt", "text": "Regelmässige Schlafzeiten\nEntspannungsrituale einbauen\n\nGedankenstopp\nBei längerer Wachzeit aufstehen. Gedanken aufschreiben, um den Kopf zu entlasten. Negative Gedanken über Schlaf in positive Überzeugungen umwandeln.\n\nOptimierter Einsatz von Koffein und Hilfsmitteln\nWirkung beachten (HWZ 6h, verstärkte Wirkung bei Jugendlichen), mind. 6h vor dem Schlaf meiden. Augenmasken, Gehörschutz etc. verwenden.\n\nPowernaps einplanen\nKurze Nickerchen von 10–15' zur Regeneration, ideal nach dem Mittagessen.\n\nAnpassungen bei Reisen und Wettkämpfen\nSchlaf- und Essenszeiten an Zeitverschiebungen anpassen. Strategien gegen Jetlag nutzen."}, {"cid": "langlauf|11|1|3", "sport": "Langlauf", "theme": "Schlaf", "label": "Inhalt", "text": "Eine gezielte und individuelle Schlafoptimierung sichert langfristige die Leistungsfähigkeit.\n\nRegelmässige Schlafroutinen und die Anpassung an Reisen oder Wettkämpfe sind entscheidend.\n\nSchlafprobleme sollten überwacht und bei Bedarf behande
